<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymOS — Programme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    :root,[data-theme="light"]{
      --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);--text-sm:clamp(.875rem,.8rem + .35vw,1rem);
      --text-base:clamp(1rem,.95rem + .25vw,1.125rem);--text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
      --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --sp1:.25rem;--sp2:.5rem;--sp3:.75rem;--sp4:1rem;--sp5:1.25rem;--sp6:1.5rem;--sp8:2rem;
      --bg:#f7f6f2;--surf:#f9f8f5;--surf2:#fbfbf9;--surfoff:#f3f0ec;--bord:#d4d1ca;
      --tx:#28251d;--txm:#6e6b64;--txf:#9a9891;
      --prim:#01696f;--primh:#0c4e54;--primhi:#cedcd8;
      --ok:#437a22;--warn:#964219;--err:#a12c7b;
      --rsm:.375rem;--rmd:.5rem;--rlg:.75rem;--rxl:1rem;--r2xl:1.5rem;
      --shsm:0 1px 2px rgba(40,37,29,.06);--shmd:0 12px 32px rgba(40,37,29,.12);
      --tr:180ms cubic-bezier(.16,1,.3,1);--font:'Satoshi',system-ui,sans-serif
    }
    [data-theme="dark"]{
      --bg:#131211;--surf:#1a1918;--surf2:#1e1d1b;--surfoff:#222120;--bord:#333230;
      --tx:#d0cfcd;--txm:#9e9d9a;--txf:#6e6c68;--prim:#4f98a3;--primh:#227f8b;--primhi:#1a2e30;
      --shsm:0 1px 2px rgba(0,0,0,.4);--shmd:0 12px 32px rgba(0,0,0,.5)
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:var(--font);font-size:var(--text-base);background:var(--bg);color:var(--tx);line-height:1.5}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer} a{color:inherit;text-decoration:none}

    /* LAYOUT */
    .app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;height:100dvh;overflow:hidden}
    .sidebar{grid-row:1/-1;background:linear-gradient(180deg,var(--surf),var(--surf2));border-right:1px solid var(--bord);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-inner{flex:1;overflow-y:auto;padding:var(--sp4)}
    .hdr{display:flex;align-items:center;justify-content:space-between;gap:var(--sp4);padding:var(--sp4) var(--sp6);border-bottom:1px solid var(--bord);background:color-mix(in oklab,var(--surf) 92%,transparent);backdrop-filter:blur(10px)}
    .main{overflow:auto;padding:var(--sp6);display:flex;flex-direction:column;gap:var(--sp6)}

    /* BRAND */
    .brand{display:flex;align-items:center;gap:var(--sp3);padding:var(--sp5) var(--sp4) var(--sp4);border-bottom:1px solid var(--bord)}
    .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primhi);color:var(--prim);flex-shrink:0;cursor:pointer}
    .logo svg{width:22px;height:22px}

    /* SIDEBAR PROG LIST */
    .sl-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txf);margin-bottom:var(--sp2);padding:0 var(--sp2)}
    .sl-list{display:flex;flex-direction:column;gap:2px;margin-bottom:var(--sp4)}
    .sl-item{display:flex;flex-direction:column;gap:.2rem;padding:var(--sp3);border-radius:var(--rlg);cursor:pointer;transition:all var(--tr);border:1px solid transparent;border-left:3px solid transparent}
    .sl-item:hover{background:var(--surfoff)}
    .sl-item.active{background:color-mix(in oklab,var(--prim) 8%,var(--surf));border-color:var(--prim)33;border-left-color:var(--prim)}
    .sl-item-name{font-size:var(--text-sm);font-weight:600;color:var(--tx)}
    .sl-item.active .sl-item-name{color:var(--prim)}
    .sl-item-meta{display:flex;align-items:center;gap:var(--sp2)}
    .sl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .sl-dot.actif{background:var(--ok)}
    .sl-dot.archive{background:var(--txf)}
    .sl-count{font-size:.68rem;color:var(--txf)}
    .new-prog-btn{display:flex;align-items:center;justify-content:center;gap:var(--sp2);width:100%;padding:var(--sp3);border-radius:var(--rlg);border:1px dashed var(--bord);background:transparent;color:var(--txm);font-size:var(--text-sm);font-weight:600;transition:all var(--tr);margin-bottom:var(--sp4)}
    .new-prog-btn:hover{border-color:var(--prim);color:var(--prim);background:var(--primhi)}
    .new-prog-btn svg{width:16px;height:16px}

    /* SIDEBAR FOOTER */
    .sf{padding:var(--sp4);border-top:1px solid var(--bord);display:grid;gap:var(--sp2)}
    .sf-row{display:flex;justify-content:space-between;font-size:var(--text-xs);color:var(--txm)}
    .sf-row strong{color:var(--tx)}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp2);min-height:44px;padding:.75rem 1rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf2);color:var(--tx);transition:all var(--tr)}
    .btn:hover:not(:disabled){background:var(--surfoff)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .iBtn{width:44px;height:44px;padding:0;flex-shrink:0}
    .iBtn svg{width:20px;height:20px}
    .btn-p{background:var(--prim);color:#fff;border-color:transparent}
    .btn-p:hover:not(:disabled){background:var(--primh)}
    .btn-sm{min-height:36px;padding:.4rem .85rem;font-size:var(--text-sm)}
    .btn-d{background:#a12c7b;color:#fff;border-color:transparent}
    .btn-d:hover:not(:disabled){background:#8a2268}
    [data-theme="dark"] .btn-d{background:#e060b8;color:#1a0a15}

    /* STATUS BAR */
    .status-bar{font-size:var(--text-xs);padding:.3rem .8rem;border-radius:999px;font-weight:600;transition:opacity .3s}

    /* EMPTY STATE */
    .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp5);text-align:center;padding:var(--sp8)}
    .es-icon{width:72px;height:72px;border-radius:var(--rxl);display:grid;place-items:center;background:var(--primhi);color:var(--prim)}
    .es-icon svg{width:36px;height:36px}
    .es-title{font-size:var(--text-lg);font-weight:700}
    .es-desc{font-size:var(--text-sm);color:var(--txm);max-width:340px;line-height:1.6}

    /* PROG HEADER */
    .prog-hdr{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:var(--sp5) var(--sp6);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp6);box-shadow:var(--shsm)}
    .ph-left{display:flex;flex-direction:column;gap:var(--sp2)}
    .ph-name{font-size:var(--text-lg);font-weight:700;letter-spacing:-.02em}
    .ph-desc{font-size:var(--text-sm);color:var(--txm);line-height:1.5}
    .ph-badges{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap}
    .ph-actions{display:flex;align-items:center;gap:var(--sp2);flex-shrink:0}
    .stbadge{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:999px;font-size:var(--text-xs);font-weight:700}
    .stbadge.actif{background:rgba(67,122,34,.1);color:var(--ok);border:1px solid rgba(67,122,34,.25)}
    .stbadge.archive{background:var(--surfoff);color:var(--txf);border:1px solid var(--bord)}
    [data-theme="dark"] .stbadge.actif{background:rgba(106,191,58,.15);color:#6abf3a;border-color:rgba(106,191,58,.3)}
    .count-badge{display:inline-flex;align-items:center;padding:.25rem .65rem;border-radius:999px;font-size:var(--text-xs);font-weight:600;background:var(--surfoff);color:var(--txm);border:1px solid var(--bord)}

    /* TYPE COLORS */
    :root{--tpush:#fa7b01;--tpull:#0161be;--tlegs:#5a9d24;--tfull:#8338bb;--tcardio:#b90207;--thaut:#01969b;--tbas:#974f1a;--tautre:#9a9891}

    /* SEANCES GRID */
    .sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp4);margin-bottom:var(--sp4)}
    .sec-title{font-weight:700;font-size:var(--text-sm);color:var(--txm);text-transform:uppercase;letter-spacing:.06em}
    .seances-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--sp4)}

    /* SEANCE CARD */
    .sc{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;cursor:pointer;transition:all var(--tr);box-shadow:var(--shsm);display:flex;flex-direction:column}
    .sc:hover{transform:translateY(-2px);box-shadow:var(--shmd)}
    .sc.active{box-shadow:0 0 0 2px var(--sc-color,var(--prim))}
    .sc-bar{height:4px;background:var(--sc-color,var(--bord))}
    .sc-body{padding:var(--sp4);display:flex;flex-direction:column;gap:var(--sp2);flex:1}
    .sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp2)}
    .sc-name{font-weight:700;font-size:var(--text-sm);flex:1}
    .type-badge{display:inline-flex;padding:.2rem .55rem;border-radius:999px;font-size:.62rem;font-weight:700;white-space:nowrap}
    .sc-jours{display:flex;flex-wrap:wrap;gap:.3rem}
    .jour-pill{background:var(--surfoff);padding:.1rem .45rem;border-radius:999px;font-size:.65rem;font-weight:600;color:var(--txm)}
    .sc-footer{padding:var(--sp2) var(--sp4);border-top:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between}
    .sc-cnt{font-size:var(--text-xs);color:var(--txf)}
    .sc-acts{display:flex;gap:2px}
    .sc-btn{width:28px;height:28px;border-radius:var(--rsm);border:none;background:none;color:var(--txf);display:grid;place-items:center;cursor:pointer;transition:all var(--tr)}
    .sc-btn:hover{background:var(--surfoff);color:var(--tx)}
    .sc-btn svg{width:14px;height:14px}
    .sc-add{background:transparent;border:1px dashed var(--bord);border-radius:var(--rxl);cursor:pointer;transition:all var(--tr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp2);padding:var(--sp6);min-height:130px;color:var(--txm)}
    .sc-add:hover{border-color:var(--prim);color:var(--prim);background:var(--primhi)}
    .sc-add svg{width:22px;height:22px}
    .sc-add span{font-size:var(--text-sm);font-weight:600}

    /* EXO PANEL */
    .exo-panel{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--shsm);animation:slideDown 220ms cubic-bezier(.16,1,.3,1);flex-shrink:0}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    .ep-bar{height:4px;background:var(--ep-color,var(--prim))}
    .ep-hdr{display:flex;align-items:center;gap:var(--sp4);padding:var(--sp4) var(--sp5);border-bottom:1px solid var(--bord);background:color-mix(in oklab,var(--ep-color,var(--prim)) 5%,var(--surf))}
    .ep-icon{width:36px;height:36px;border-radius:var(--rmd);display:grid;place-items:center;background:color-mix(in oklab,var(--ep-color,var(--prim)) 15%,var(--surf));color:var(--ep-color,var(--prim));flex-shrink:0}
    .ep-icon svg{width:18px;height:18px}
    .ep-close{margin-left:auto;background:none;border:none;color:var(--txf);cursor:pointer;padding:.3rem;border-radius:var(--rsm);display:grid;place-items:center;transition:all var(--tr)}
    .ep-close:hover{color:var(--tx);background:var(--surfoff)}
    .ep-close svg{width:16px;height:16px}
    .ep-body{padding:var(--sp4) var(--sp5)}

    /* EXO TABLE */
    .et-wrap{overflow-x:auto;border-radius:var(--rmd);border:1px solid var(--bord);scrollbar-color:var(--txf) var(--surfoff);scrollbar-width:auto}
    .et-wrap::-webkit-scrollbar{height:12px;width:12px}
    .et-wrap::-webkit-scrollbar-track{background:var(--surfoff)}
    .et-wrap::-webkit-scrollbar-thumb{background:var(--txf);border-radius:6px;border:2px solid var(--surfoff)}
    .et-wrap::-webkit-scrollbar-thumb:hover{background:var(--txm)}
    .et{width:100%;border-collapse:collapse;font-size:var(--text-xs);min-width:640px}
    .et-img{width:52px;height:52px;object-fit:contain;border-radius:var(--rsm);background:var(--surfoff);border:1px solid var(--bord);padding:3px;display:block}
    .et-img-ph{width:52px;height:52px;border-radius:var(--rsm);background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center}
    .et-img-ph svg{width:18px;height:18px}
    .et th{background:var(--surfoff);padding:.5rem .75rem;font-weight:700;text-align:left;white-space:nowrap;border-bottom:1px solid var(--bord);color:var(--txm)}
    .et td{padding:.55rem .75rem;border-bottom:1px solid var(--bord);vertical-align:middle}
    .et tbody tr:last-child td{border-bottom:none}
    .et tbody tr:hover{background:var(--surfoff)}
    .et-num{width:32px;text-align:center;color:var(--txf);font-weight:600}
    .et-name{font-weight:600}
    .grp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.4rem}
    .et-empty{padding:var(--sp6);text-align:center;color:var(--txf);font-style:italic}
    .et-acts{display:flex;align-items:center;gap:2px}
    .et-btn{background:none;border:none;cursor:pointer;color:var(--txf);padding:.2rem;border-radius:var(--rsm);transition:all var(--tr);display:grid;place-items:center}
    .et-btn:hover{background:var(--surfoff);color:var(--tx)}
    .et-btn.d:hover{background:rgba(161,44,123,.1);color:var(--err)}
    .et-btn svg{width:13px;height:13px}
    .et-btn.linked{color:var(--ep-color,var(--prim))}

    /* SUPERSETS / CIRCUITS */
    .et-grp-badge{display:block;font-size:.62rem;font-weight:700;padding:.05rem 0 .3rem 0;color:var(--ep-color,var(--prim))}
    .et tr.et-grouped td{background:color-mix(in oklab,var(--ep-color,var(--prim)) 5%,var(--surf))}
    .et tr.et-grouped td.et-name{border-left:3px solid var(--ep-color,var(--prim))}

    /* MODALS */
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 180ms ease}
    .ov.open{opacity:1;pointer-events:all}
    .modal{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:var(--sp6);width:min(520px,94vw);box-shadow:var(--shmd);display:grid;gap:var(--sp4);transform:translateY(8px);transition:transform 180ms ease;max-height:90dvh;overflow-y:auto}
    .ov.open .modal{transform:translateY(0)}
    .modal-sm{width:min(420px,92vw)}
    .modal-hdr{display:flex;align-items:center;gap:var(--sp3);padding-bottom:var(--sp4);border-bottom:1px solid var(--bord)}
    .modal-icon{width:40px;height:40px;border-radius:var(--rmd);display:grid;place-items:center;background:var(--primhi);color:var(--prim);flex-shrink:0}
    .modal-icon svg{width:20px;height:20px}
    .modal-title{font-weight:700;font-size:var(--text-base)}
    .modal-actions{display:flex;gap:var(--sp3);justify-content:flex-end;margin-top:var(--sp2)}
    .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp4)}
    .ffull{grid-column:1/-1}
    .field{display:grid;gap:var(--sp2)}
    .field label{font-size:var(--text-sm);font-weight:600}
    .finp{padding:.6rem .75rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);transition:border-color var(--tr)}
    .finp:focus-within{border-color:var(--prim)}
    .finp input,.finp textarea{border:none;outline:none;background:transparent;width:100%;color:var(--tx)}
    .finp textarea{resize:vertical;min-height:64px;line-height:1.5}
    .fsel{padding:.6rem .75rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);outline:none;width:100%;min-height:40px;transition:border-color var(--tr)}
    .fsel:focus{border-color:var(--prim)}
    .jours-grid{display:flex;flex-wrap:wrap;gap:var(--sp2)}
    .jck{display:none}
    .jlbl{display:inline-flex;align-items:center;padding:.3rem .75rem;border-radius:999px;border:1px solid var(--bord);font-size:var(--text-xs);font-weight:600;cursor:pointer;transition:all var(--tr);color:var(--txm);background:var(--surfoff)}
    .jck:checked+.jlbl{background:var(--primhi);color:var(--prim);border-color:var(--prim)}
    .merr{font-size:var(--text-xs);color:var(--err);background:rgba(161,44,123,.08);border:1px solid rgba(161,44,123,.2);border-radius:var(--rmd);padding:.5rem .75rem}
    .modal-danger-icon{width:48px;height:48px;border-radius:50%;background:rgba(161,44,123,.1);border:1px solid rgba(161,44,123,.25);display:grid;place-items:center;margin:0 auto var(--sp2)}
    .modal-danger-icon svg{width:22px;height:22px;color:#a12c7b}
    [data-theme="dark"] .modal-danger-icon{background:rgba(224,96,184,.15)}
    [data-theme="dark"] .modal-danger-icon svg{color:#e060b8}
    .modal-center{text-align:center;display:grid;gap:var(--sp2)}
    .modal-desc{font-size:var(--text-sm);color:var(--txm);line-height:1.5}

    /* ── CUSTOM EXERCISE PICKER ── */
    .exo-picker{position:relative;user-select:none}
    .exo-picker-trigger{display:flex;align-items:center;gap:var(--sp2);padding:.5rem .75rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);cursor:pointer;transition:border-color var(--tr);min-height:42px}
    .exo-picker.open .exo-picker-trigger{border-color:var(--prim)}
    .exo-picker-search{flex:1;border:none;outline:none;background:transparent;color:var(--tx);font-size:var(--text-sm);font-family:inherit;min-width:0}
    .exo-picker-arrow{width:16px;height:16px;flex-shrink:0;color:var(--txf);transition:transform var(--tr)}
    .exo-picker.open .exo-picker-arrow{transform:rotate(180deg)}
    .exo-picker-preview{display:flex;align-items:center;gap:var(--sp2);flex-shrink:0}
    .epp-img{width:30px;height:30px;border-radius:var(--rsm);object-fit:contain;background:var(--surfoff);border:1px solid var(--bord);flex-shrink:0;padding:2px}
    .epp-ph{width:30px;height:30px;border-radius:var(--rsm);background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center;flex-shrink:0}
    .epp-ph svg{width:14px;height:14px;color:var(--txf)}
    .epp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .exo-picker-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:300;background:var(--surf);border:1px solid var(--bord);border-radius:var(--rlg);box-shadow:var(--shmd);max-height:240px;overflow-y:auto;display:none}
    .exo-picker.open .exo-picker-list{display:block}
    .epi-empty{padding:var(--sp4);text-align:center;color:var(--txf);font-size:var(--text-sm);font-style:italic}
    .epi{display:flex;align-items:center;gap:var(--sp3);padding:.55rem .75rem;cursor:pointer;transition:background var(--tr);border-bottom:1px solid var(--bord)}
    .epi:last-child{border-bottom:none}
    .epi:hover,.epi.active{background:var(--surfoff)}
    .epi-img{width:36px;height:36px;border-radius:var(--rsm);object-fit:contain;background:var(--surfoff);border:1px solid var(--bord);flex-shrink:0;padding:2px}
    .epi-ph{width:36px;height:36px;border-radius:var(--rsm);background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center;flex-shrink:0}
    .epi-ph svg{width:16px;height:16px;color:var(--txf)}
    .epi-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
    .epi-info{flex:1;min-width:0}
    .epi-name{font-size:var(--text-sm);font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .epi-grp{font-size:.68rem;color:var(--txm);margin-top:.1rem}
    /* ── GROUP DISPLAY ── */
    .grp-display{display:flex;align-items:center;gap:var(--sp3);padding:.6rem .75rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surfoff);min-height:52px}
    .grp-display-ph{width:40px;height:40px;border-radius:var(--rmd);flex-shrink:0;display:grid;place-items:center;background:var(--surf);border:1px solid var(--bord);color:var(--txf)}
    .grp-display-img{width:40px;height:40px;border-radius:var(--rmd);object-fit:contain;background:var(--surf);border:1px solid var(--bord);padding:3px;flex-shrink:0}
    .grp-display-info{flex:1;min-width:0}
    .grp-display-name{font-size:var(--text-sm);font-weight:700}

<script>
// ═══════════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
const S = { progs:[], selProg:null, selSeance:null };
let _hist = [];
let _objectifsDb = {};

// --- Versionnage : journal des modifications, centralisé sur l'objet programme ---
const PROG_MODIF_FIELDS   = ['nom','description','statut'];
const SEANCE_MODIF_FIELDS = ['nom','type','jours'];
const EXO_MODIF_FIELDS    = ['nom','series','reps','poids','duree','distance','recup'];
const MODIF_LABELS = { nom:'Nom', description:'Description', statut:'Statut', type:'Type', jours:'Jours',
  series:'Séries', reps:'Répétitions', poids:'Poids', duree:'Durée', distance:'Distance', recup:'Récupération' };
function snapshotFields(obj, fields){
  const s={}; fields.forEach(f => { s[f] = Array.isArray(obj[f]) ? obj[f].join(', ') : (obj[f]||''); }); return s;
}
function recordModifs(prog, before, after, fields){
  if(!Array.isArray(prog.historique_modifs)) prog.historique_modifs=[];
  const nowIso = new Date().toISOString();
  fields.forEach(f => {
    const newVal = Array.isArray(after[f]) ? after[f].join(', ') : (after[f]||'');
    if(before[f] !== newVal){
      prog.historique_modifs.unshift({date:nowIso, champ:MODIF_LABELS[f]||f, ancienne_valeur:before[f], nouvelle_valeur:newVal});
    }
  });
}
function truncModif(v){ v=v||'—'; return v.length>40 ? v.slice(0,40)+'…' : v; }
function openHistoryModal(progId){
  const prog = getProg(progId); if(!prog) return;
  document.getElementById('mHistoryTitle').textContent = `Historique des modifications — ${prog.nom}`;
  const list = document.getElementById('historyList'); list.innerHTML='';
  const modifs = prog.historique_modifs||[];
  if(!modifs.length){
    list.innerHTML = '<div style="padding:var(--sp4);text-align:center;color:var(--txf);font-style:italic;font-size:var(--text-sm)">Aucune modification enregistrée pour l\'instant.</div>';

function save(){

  GymDB.write('programmes.json', S.progs);
}
function load(){
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    S.progs = r ? JSON.parse(r) : [];
    if(!Array.isArray(S.progs)) S.progs = [];
  } catch { S.progs = []; }
}
async function loadFromDb(){
  const data = await GymDB.read('programmes.json');
  if(Array.isArray(data) && data.length){ S.progs = data; return true; }
  return false;
}
function getExoLib(){ try { return JSON.parse(localStorage.getItem(EXO_LIB_KEY)||'{}').rows||[]; } catch{ return []; } }
function getLatestRef(nom){
  try {
    const lib = getExoLib();
    const objs = JSON.parse(localStorage.getItem(OBJ_KEY)||'{}');
    const row = lib.find(e => e.exercice?.toLowerCase() === nom.toLowerCase());
    if(!row) return null;
    const entries = objs[row.id];
    if(!entries?.length) return null;
    return entries.slice().sort((a,b) => b.date.localeCompare(a.date))[0];
  } catch{ return null; }
}
// Champs pertinents pour un exercice, déduits des références remplies dans Exercices.html
// (mêmes règles que Seance.html/Historique.html) — sans référence, tout est affiché.
const CHAMP_KEYS = ['series','reps','poids','rm1','duree','distance','puissance','inclinaison'];
function computeChampsActifs(nom){
  try {
    const lib = getExoLib();
    const objs = JSON.parse(localStorage.getItem(OBJ_KEY)||'{}');
    const row = lib.find(e => e.exercice?.toLowerCase() === nom?.toLowerCase());
    const entries = row ? (objs[row.id]||[]) : [];
    if(!entries.length) return new Set(CHAMP_KEYS);
    const actifs = new Set();
    entries.forEach(e => CHAMP_KEYS.forEach(k => { if(e[k]) actifs.add(k); }));
    return actifs;
  } catch { return new Set(CHAMP_KEYS); }
}
// Affiche/masque les champs du formulaire d'exercice selon la pertinence pour l'exercice choisi.
function applyChampsVisibility(nom){
  const champs = nom ? computeChampsActifs(nom) : new Set(CHAMP_KEYS);
  const map = {series:'fldExSeries',reps:'fldExReps',poids:'fldExPoids',duree:'fldExDuree',distance:'fldExDist',puissance:'fldExPuissance',inclinaison:'fldExInclinaison'};
  Object.entries(map).forEach(([k,id])=>{
    const el=document.getElementById(id);
    if(el) el.style.display = champs.has(k) ? '' : 'none';
  });
}

// Parse une cible de répétitions ("8-12", "10", "") -> borne basse minimale exigée, ou null si non chiffrée
function parseRepsTarget(reps){
  if(!reps) return null;
  const m = String(reps).match(/(\d+)/);
  return m ? parseInt(m[1]) : null;
}
// Suggestion de progression : si la dernière séance réelle où cet exercice a été pratiqué
// a vu toutes ses séries réussies (séries complétées >= visées, poids et reps réalisés >= visés),
// propose +2,5 kg par rapport au poids actuellement visé.
function checkProgressionSuggestion(nomExercice, targetSeries, targetReps, targetPoids){
  const poidsNum = parseFloat(targetPoids);
  if(!nomExercice || !poidsNum || poidsNum<=0) return null;
  const matches = (_hist||[]).filter(h => (h.exercices||[]).some(e => e.nom===nomExercice));
  if(!matches.length) return null;
  const last = matches.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'')).pop();
  const entry = (last.exercices||[]).find(e => e.nom===nomExercice);
  const series = entry?.series||[];
  const seriesVisees = parseInt(targetSeries)||0;
  if(!series.length || (seriesVisees && series.length < seriesVisees)) return null;
  const minReps = parseRepsTarget(targetReps);
  const allSuccess = series.every(s => {
    const p = parseFloat(s.poids);
    const r = parseInt(s.reps);
    const poidsOk = !isNaN(p) ? p >= poidsNum : true;
    const repsOk = (minReps!==null && !isNaN(r)) ? r >= minReps : true;
    return poidsOk && repsOk;
  });
  if(!allSuccess) return null;
  return { lastDate: last.date, suggestedPoids: Math.round((poidsNum+2.5)*10)/10 };
}

function buildExoRow(seance, e, i, exos, groupLetters){
  const total = exos.length;
  const gc = MC[e.groupe]||'#9a9891';
  const tr = document.createElement('tr'); tr.dataset.exoId = e.id;
  const isGroupFirst = e.groupId && (i===0 || exos[i-1].groupId !== e.groupId);
  if(e.groupId){ tr.classList.add('et-grouped'); }

  // Cellule # et cellule image
  const tdNum = document.createElement('td'); tdNum.className='et-num'; tdNum.textContent=i+1;
  tr.appendChild(tdNum);

  const tdImg = document.createElement('td'); tdImg.style.cssText='padding:.3rem .5rem;vertical-align:middle;width:60px';
  const imgSrc = e.image || getExoImage(e.nom);
  if (imgSrc) {
    const img = document.createElement('img'); img.className='et-img';
    img.src=`./img/${imgSrc}`; img.alt=e.nom||'';
    img.style.cursor='zoom-in'; img.title='Voir la fiche exercice';
    img.onerror=()=>{ img.replaceWith(buildEtImgPh(gc)); };
    img.addEventListener('click', () => openExoInfoFromTable(e.nom));
    tdImg.appendChild(img);
  } else {
    const ph = buildEtImgPh(gc);
    ph.style.cursor='pointer'; ph.title='Voir la fiche exercice';
    ph.addEventListener('click', () => openExoInfoFromTable(e.nom));
    tdImg.appendChild(ph);
  }
  tr.appendChild(tdImg);

  else { const sp=document.createElement('span');sp.style.width='20px';acts.appendChild(sp); }
  if(i<total-1){ const d=document.createElement('button');d.className='et-btn';d.title='Descendre';d.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>`;d.addEventListener('click',()=>moveExo(seance.id,e.id,1));acts.appendChild(d); }

    }

  acts.append(ed,dl); actTd.appendChild(acts); tr.appendChild(actTd);

}

// Déplace tout le bloc contigu (superset) auquel appartient l'exercice comme une seule unité,
// en l'échangeant avec le bloc adjacent (simple exercice ou autre superset).
function moveExo(seanceId,exoId,dir){
  const prog=getProg(S.selProg); const seance=getSeance(prog,seanceId); if(!seance?.exercices)return;
  const arr=seance.exercices; const idx=arr.findIndex(e=>e.id===exoId); if(idx<0)return;
  const gid=arr[idx].groupId;
  let start=idx, end=idx;
  if(gid){
    while(start>0 && arr[start-1].groupId===gid) start--;
    while(end<arr.length-1 && arr[end+1].groupId===gid) end++;
  }
  const block = arr.slice(start,end+1);
  if(dir<0){
    if(start===0) return;
    let otherStart=start-1;
    const oGid=arr[otherStart].groupId;
    if(oGid){ while(otherStart>0 && arr[otherStart-1].groupId===oGid) otherStart--; }
    const other = arr.slice(otherStart,start);
    arr.splice(otherStart, end-otherStart+1, ...block, ...other);
  } else {
    if(end===arr.length-1) return;
    let otherEnd=end+1;
    const oGid=arr[otherEnd].groupId;
    if(oGid){ while(otherEnd<arr.length-1 && arr[otherEnd+1].groupId===oGid) otherEnd++; }
    const other = arr.slice(end+1,otherEnd+1);
    arr.splice(start, otherEnd-start+1, ...other, ...block);
  }
  save(); S.selSeance=seanceId; renderMain();
}

// Lie/dissocie un exercice avec celui qui le précède (création/extension/rupture d'un superset)
function toggleLinkWithPrevious(seanceId,exoId){
  const prog=getProg(S.selProg); const seance=getSeance(prog,seanceId); if(!seance?.exercices)return;
  const arr=seance.exercices; const idx=arr.findIndex(e=>e.id===exoId); if(idx<=0)return;
  const cur=arr[idx], prev=arr[idx-1];
  if(cur.groupId && cur.groupId===prev.groupId){
    cur.groupId=null;
    const remaining=arr.filter(x=>x.groupId===prev.groupId);
    if(remaining.length===1) remaining[0].groupId=null;
  } else {
    const gid=prev.groupId||uid();
    prev.groupId=gid; cur.groupId=gid;
  }
  save(); S.selSeance=seanceId; renderMain();
}

// --- Modèles de programme prêts à l'emploi ---
function resolveExoLibFields(nom){
  try {
    const lib = getExoLib();
    const e = lib.find(x => x.exercice?.toLowerCase() === nom?.toLowerCase());
    return e ? { groupe: e.groupe_musculaire||'', image: e.image||'' } : { groupe:'', image:'' };
  } catch { return { groupe:'', image:'' }; }
}
function openTemplateModal(){
  const list = document.getElementById('templateList'); list.innerHTML='';
  PROGRAM_TEMPLATES.forEach((tpl, idx) => {
    const card = document.createElement('button'); card.type='button';
    card.style.cssText='display:flex;flex-direction:column;gap:.3rem;text-align:left;padding:var(--sp3) var(--sp4);border-radius:var(--rlg);border:1px solid var(--bord);background:var(--surf2);cursor:pointer;transition:all var(--tr);width:100%;font:inherit;color:var(--tx)';
    card.addEventListener('mouseenter',()=>card.style.borderColor='var(--prim)');
    card.addEventListener('mouseleave',()=>card.style.borderColor='var(--bord)');

  });

}
function createFromTemplate(idx){
  const tpl = PROGRAM_TEMPLATES[idx]; if(!tpl) return;
  const newId = uid();
  const seances = tpl.seances.map(s => ({
    id: uid(), nom: s.nom, type: s.type, jours: [],
    exercices: s.exercices.map(e => {
      const { groupe, image } = resolveExoLibFields(e.nom);
      return { id: uid(), nom: e.nom, groupe, image, series: e.series||'', reps: e.reps||'', poids: e.poids||'', recup: e.recup||'', duree: e.duree||'', distance: e.distance||'', note: '' };
    })
  }));
  S.progs.push({ id:newId, nom:tpl.nom, description:tpl.description, statut:'actif', dateCreation:new Date().toISOString().split('T')[0], seances, historique_modifs:[] });
  S.selProg=newId; S.selSeance=null;

  showStatus(`Programme "${tpl.nom}" créé depuis le modèle.`);
}

let _exoSeanceId=null;

function buildExoPicker(lib) {
  let filtered = [...lib];
  const picker  = document.getElementById('exoPicker');
  const search  = document.getElementById('exoSearch');
  const list    = document.getElementById('exoList');
  const preview = document.getElementById('exoPreview');
  const nomInp  = document.getElementById('exNom');

  function renderList(items) {
    list.innerHTML = '';
    if (!items.length) {
      const el = document.createElement('div'); el.className = 'epi-empty';
      el.textContent = 'Aucun exercice trouvé.'; list.appendChild(el); return;
    }
    items.forEach(e => {
      const hex = MC[e.groupe_musculaire] || '#9a9891';
      const [r,g,b] = hexRgb(hex);
      const imgSrc = e.image || e.image_muscle || e.image_groupe || '';
      const item = document.createElement('div'); item.className = 'epi';
      if (e.exercice === nomInp.value) item.classList.add('active');
      // Image ou placeholder coloré
      if (imgSrc) {
        const img = document.createElement('img'); img.className='epi-img';
        img.src=`./img/${imgSrc}`; img.alt=e.exercice;
        img.onerror=()=>{ img.replaceWith(makePh(hex)); };
        item.appendChild(img);
      } else { item.appendChild(makePh(hex)); }
      const dot = document.createElement('span'); dot.className='epi-dot'; dot.style.background=hex;
      const info = document.createElement('div'); info.className='epi-info';
      const name = document.createElement('div'); name.className='epi-name'; name.textContent=e.exercice||'';
      const grp  = document.createElement('div'); grp.className='epi-grp';
      grp.textContent=(e.groupe_musculaire||'') + (e.muscle?' · '+e.muscle:'');
      info.append(name,grp); item.append(dot,info);
      item.addEventListener('mousedown', ev => { ev.preventDefault(); selectExo(e); });
      list.appendChild(item);
    });
  }

  function makePh(hex) {
    const [r,g,b]=hexRgb(hex);
    const ph=document.createElement('div'); ph.className='epi-ph';
    ph.style.background=`rgba(${r},${g},${b},.15)`;
    ph.style.borderColor=`rgba(${r},${g},${b},.3)`;
    ph.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="${hex}" stroke-width="1.5"><path d="M6 18V8.5C6 6.57 7.57 5 9.5 5h.5v14H9.5A3.5 3.5 0 0 1 6 15.5"/><path d="M18 18V8.5C18 6.57 16.43 5 14.5 5H14v14h.5a3.5 3.5 0 0 0 3.5-3.5"/></svg>`;
    return ph;
  }

  let _selectedExoImage = '';

  function selectExo(e) {
    nomInp.value = e.exercice;
    search.value = e.exercice;
    _selectedExoImage = e.image || e.image_muscle || e.image_groupe || '';
    picker.classList.remove('open');
    // Preview dans le trigger
    const hex = MC[e.groupe_musculaire]||'#9a9891';
    const imgSrc = _selectedExoImage;
    preview.innerHTML='';
    if (imgSrc) {
      const img=document.createElement('img'); img.className='epp-img';
      img.src=`./img/${imgSrc}`; img.alt=e.exercice;
      img.onerror=()=>{ img.replaceWith(makePph(hex)); };
      preview.appendChild(img);
    } else { preview.appendChild(makePph(hex)); }
    const dot=document.createElement('span'); dot.className='epp-dot'; dot.style.background=hex;
    preview.append(dot); preview.style.display='flex';
    updateGroupDisplay(e);
    applyChampsVisibility(e.exercice);
    autoFillRef(e.exercice);
  }

  function makePph(hex) {
    const [r,g,b]=hexRgb(hex);
    const ph=document.createElement('div'); ph.className='epp-ph';
    ph.style.background=`rgba(${r},${g},${b},.15)`;
    ph.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="${hex}" stroke-width="1.5"><path d="M6 18V8.5C6 6.57 7.57 5 9.5 5h.5v14H9.5A3.5 3.5 0 0 1 6 15.5"/><path d="M18 18V8.5C18 6.57 16.43 5 14.5 5H14v14h.5a3.5 3.5 0 0 0 3.5-3.5"/></svg>`;
    return ph;
  }

  search.addEventListener('focus', () => {
    picker.classList.add('open');
    filtered = lib.filter(e => !search.value || e.exercice?.toLowerCase().includes(search.value.toLowerCase()));
    renderList(filtered);
  });
  search.addEventListener('input', () => {
    picker.classList.add('open');
    filtered = lib.filter(e => e.exercice?.toLowerCase().includes(search.value.toLowerCase()));
    renderList(filtered);
  });
  document.addEventListener('click', e => {
    if (!picker.contains(e.target)) picker.classList.remove('open');
  }, { capture: true });

  renderList(lib);
}

  const grp = exoData?.groupe_musculaire || '';

  const hex = MC[grp] || '#9a9891';

  const gmusc = document.getElementById('grpMuscle');

function showPhColor(ph, hex) {

function autoFillRef(nom) {
  const ref = getLatestRef(nom);
  if(ref){
    if(ref.series)   document.getElementById('exSeries').value=ref.series;
    if(ref.reps)     document.getElementById('exReps').value=ref.reps;
    if(ref.poids)    document.getElementById('exPoids').value=ref.poids;
    if(ref.duree)    document.getElementById('exDuree').value=ref.duree;
    if(ref.distance) document.getElementById('exDist').value=ref.distance;
    if(ref.recup)    document.getElementById('exRecup').value=ref.recup;
    const hint=document.getElementById('exHint');
    hint.textContent=`↩ Référence du ${new Date(ref.date+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})} chargée`;
    hint.style.display='block';
    setTimeout(()=>hint.style.display='none',3500);
  }
  renderProgSuggestion(nom, document.getElementById('exSeries'), document.getElementById('exReps'), document.getElementById('exPoids'), document.getElementById('exProgSuggest'));
}

// Affiche (si applicable) une suggestion de progression sous les champs séries/reps/poids visés,
// avec un bouton pour appliquer directement le poids suggéré.
function renderProgSuggestion(nom, seriesEl, repsEl, poidsEl, el){
  if(!el) return;
  el.style.display='none'; el.innerHTML='';
  if(!seriesEl||!repsEl||!poidsEl) return;
  const sugg = checkProgressionSuggestion(nom, seriesEl.value, repsEl.value, poidsEl.value);
  if(!sugg) return;
  const dateStr = new Date(sugg.lastDate+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
  el.innerHTML = `<span>💪 Toutes les séries réussies le ${dateStr} → suggestion : <strong>${sugg.suggestedPoids} kg</strong></span>`;
  const btn=document.createElement('button'); btn.type='button'; btn.className='btn btn-sm'; btn.style.cssText='padding:.15rem .5rem;min-height:auto';
  btn.textContent='Appliquer';
  btn.addEventListener('click',()=>{ poidsEl.value=sugg.suggestedPoids; el.style.display='none'; });
  el.appendChild(btn);
  el.style.display='flex';
}

function getExoImage(nom) {

function confirmExoModal(){
  const nom=document.getElementById('exNom').value.trim();
  if(!nom){ document.getElementById('exErr').style.display='block'; document.getElementById('exErr').querySelector('div').textContent="Sélectionnez un exercice dans la liste."; document.getElementById('exoSearch').focus(); return; }
  document.getElementById('exOk').disabled=true;
  const prog=getProg(S.selProg); const seance=getSeance(prog,_exoSeanceId); if(!seance){closeExoModal();return;}
  const fields = {
    nom, groupe:document.getElementById('exGroupe').value,
    image: getExoImage(nom),
    series:document.getElementById('exSeries').value.trim(),reps:document.getElementById('exReps').value.trim(),
    poids:document.getElementById('exPoids').value.trim(),recup:document.getElementById('exRecup').value.trim(),
    duree:document.getElementById('exDuree').value.trim(),distance:document.getElementById('exDist').value.trim(),
    puissance:document.getElementById('exPuissance').value.trim(),inclinaison:document.getElementById('exInclinaison').value.trim(),
    note:document.getElementById('exNote').value.trim()
  };
  if(_editExoId){
    if(!seance.exercices)seance.exercices=[];
    const e=seance.exercices.find(x=>x.id===_editExoId);
    if(e){
      const before=snapshotFields(e, EXO_MODIF_FIELDS);
      Object.assign(e, fields);
      if(prog) recordModifs(prog, before, e, EXO_MODIF_FIELDS);
    }
  } else {
    if(!seance.exercices)seance.exercices=[];
    seance.exercices.push({ id:uid(), ...fields });
    if(prog){
      if(!Array.isArray(prog.historique_modifs)) prog.historique_modifs=[];
      prog.historique_modifs.unshift({date:new Date().toISOString(), champ:'Exercice ajouté', ancienne_valeur:'', nouvelle_valeur:nom});
    }
  }
  const wasEditing = !!_editExoId;
  const keepSeanceId = _exoSeanceId;
  save(); closeExoModal(); S.selSeance=keepSeanceId; renderMain(); showStatus(wasEditing?`"${nom}" modifié.`:`"${nom}" ajouté.`);
}

// IMPORT / EXPORT XML
// ═══════════════════════════════════════════════════════════════════════════════
function progsToXml(progs) {
  const ex = v => String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<programmes>'];
  progs.forEach(p => {
    lines.push('  <programme>');
    lines.push(`    <nom>${ex(p.nom)}</nom>`);
    lines.push(`    <description>${ex(p.description||'')}</description>`);
    lines.push(`    <statut>${ex(p.statut||'actif')}</statut>`);
    lines.push(`    <dateCreation>${ex(p.dateCreation||'')}</dateCreation>`);
    lines.push('    <seances>');
    (p.seances||[]).forEach(s => {
      lines.push('      <seance>');
      lines.push(`        <nom>${ex(s.nom)}</nom>`);
      lines.push(`        <type>${ex(s.type||'')}</type>`);
      lines.push('        <jours>');
      (s.jours||[]).forEach(j => lines.push(`          <jour>${ex(j)}</jour>`));
      lines.push('        </jours>');
      lines.push('        <exercices>');
      (s.exercices||[]).forEach(e => {
        lines.push('          <exercice>');
        ['nom','groupe','series','reps','poids','recup','duree','distance','note'].forEach(f =>
          lines.push(`            <${f}>${ex(e[f]||'')}</${f}>`)
        );
        lines.push('          </exercice>');
      });
      lines.push('        </exercices>');
      lines.push('      </seance>');
    });
    lines.push('    </seances>');
    lines.push('  </programme>');
  });
  lines.push('</programmes>');
  return lines.join('\n');
}

function parseProgsXml(xmlText) {
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, 'application/xml');
  if (xml.querySelector('parsererror')) throw new Error('XML invalide.');
  const txt = el => el?.textContent?.trim() || '';
  return [...xml.querySelectorAll('programmes > programme')].map(p => ({
    id: uid(),
    nom:          txt(p.querySelector('nom')),
    description:  txt(p.querySelector('description')),
    statut:       txt(p.querySelector('statut')) || 'actif',
    dateCreation: txt(p.querySelector('dateCreation')),
    seances: [...p.querySelectorAll('seances > seance')].map(s => ({
      id: uid(),
      nom:  txt(s.querySelector('nom')),
      type: txt(s.querySelector('type')) || 'Autre',
      jours: [...s.querySelectorAll('jours > jour')].map(j => j.textContent.trim()).filter(Boolean),
      exercices: [...s.querySelectorAll('exercices > exercice')].map(e => ({
        id: uid(),
        nom:      txt(e.querySelector('nom')),
        groupe:   txt(e.querySelector('groupe')),
        series:   txt(e.querySelector('series')),
        reps:     txt(e.querySelector('reps')),
        poids:    txt(e.querySelector('poids')),
        recup:    txt(e.querySelector('recup')),
        duree:    txt(e.querySelector('duree')),
        distance: txt(e.querySelector('distance')),
        note:     txt(e.querySelector('note')),
      }))
    }))
  }));
}

function exportXml() {
  const xml  = progsToXml(S.progs);
  const blob = new Blob([xml], { type: 'application/xml' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'programmes.xml';
  a.click(); URL.revokeObjectURL(a.href);
  showStatus('Export XML généré.');
}

async function importXml(file) {
  try {
    const text  = await file.text();
    const progs = parseProgsXml(text);
    if (!progs.length) { showStatus('Aucun programme trouvé dans le fichier.', false); return; }
    S.progs = progs; S.selProg = null; S.selSeance = null;
    save(); renderSidebar(); renderMain();
    showStatus(`${progs.length} programme(s) importé(s) depuis ${file.name}`);
  } catch(e) { showStatus('Erreur XML : ' + e.message, false); }
}
