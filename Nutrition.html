<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GymOS — Nutrition</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surf:#f9f8f5;--surf2:#fbfbf9;--surfoff:#f3f0ec;--bord:#d4d1ca;
  --tx:#28251d;--txm:#6e6b64;--txf:#9a9891;
  --prim:#01696f;--primh:#0c4e54;--primhi:#cedcd8;--ok:#437a22;--err:#a12c7b;
  --shsm:0 1px 3px rgba(40,37,29,.08);--shmd:0 8px 24px rgba(40,37,29,.12);
  --tr:180ms cubic-bezier(.16,1,.3,1);--font:'Satoshi',system-ui,sans-serif;
  --rsm:.375rem;--rmd:.5rem;--rlg:.75rem;--rxl:1rem;
  --ccal:#e05a00;--cprot:#0161be;--ccarb:#437a22;--cfat:#964219;
}
[data-theme="dark"]{
  --bg:#131211;--surf:#1a1918;--surf2:#1e1d1b;--surfoff:#222120;--bord:#333230;
  --tx:#d0cfcd;--txm:#9e9d9a;--txf:#6e6c68;--prim:#4f98a3;--shmd:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--tx);font-size:clamp(13px,1.3vw,15px)}
button,input,select,textarea{font:inherit}button{cursor:pointer}

.app{display:grid;grid-template-rows:auto auto 1fr;height:100dvh;overflow:hidden}
.hdr{display:flex;align-items:center;gap:.6rem;padding:.6rem 1.25rem;border-bottom:1px solid var(--bord);background:color-mix(in oklab,var(--surf) 92%,transparent);backdrop-filter:blur(10px)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--bord);background:var(--surf);overflow-x:auto;flex-shrink:0}
.tab{padding:.55rem 1.1rem;font-size:.8rem;font-weight:600;color:var(--txm);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all var(--tr)}
.tab:hover{color:var(--tx);background:var(--surfoff)}
.tab.active{color:var(--prim);border-bottom-color:var(--prim)}
.tab-content{display:none;height:100%;overflow:hidden}
.tab-content.active{display:flex;flex-direction:column}

.btn{display:inline-flex;align-items:center;gap:.3rem;padding:.4rem .75rem;min-height:32px;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf2);color:var(--tx);font-size:.78rem;font-weight:500;cursor:pointer;transition:all var(--tr)}
.btn:hover{background:var(--surfoff)}.btn-p{background:var(--prim);color:#fff;border-color:transparent}.btn-p:hover{background:var(--primh)}
.btn-sm{min-height:26px;padding:.2rem .5rem;font-size:.72rem}
.btn-icon{width:34px;height:34px;padding:0;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bord);background:var(--surf2);color:var(--txm);transition:all var(--tr);flex-shrink:0}
.btn-icon:hover{background:var(--surfoff);color:var(--tx)}.btn-icon svg{width:15px;height:15px}
.inp{padding:.42rem .6rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.8rem;outline:none;transition:border-color var(--tr);width:100%}
.inp:focus{border-color:var(--prim)}
.sel{padding:.42rem .6rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.78rem;outline:none;cursor:pointer;width:100%}
.fld{display:grid;gap:.22rem}.fld label{font-size:.67rem;font-weight:700;color:var(--txm);text-transform:uppercase;letter-spacing:.05em}
.panel{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);box-shadow:var(--shsm);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;border-bottom:1px solid var(--bord)}
.pt{font-weight:700;font-size:.85rem}

/* ── ONGLET REPAS ── */
.repas-layout{display:grid;grid-template-columns:330px 1fr 300px;overflow:hidden;flex:1}
/* Calendrier gauche */
.cal-sidebar{overflow-y:auto;border-right:1px solid var(--bord);background:var(--surf)}
.cal-month-hdr{font-weight:800;font-size:.72rem;text-align:center;padding:.55rem;text-transform:uppercase;letter-spacing:.06em;color:#fff;cursor:default;position:sticky;top:0}
.cal-day-row{display:flex;align-items:center;gap:.35rem;padding:.28rem .6rem;border-bottom:1px solid var(--bord);cursor:pointer;transition:background var(--tr);min-height:30px}
.cal-day-row:hover{background:var(--surfoff)}
.cal-day-row.active{background:color-mix(in oklab,var(--prim) 10%,var(--surf));border-left:3px solid var(--prim)}
.cal-day-row.today .cal-day-num{color:var(--prim);font-weight:900}
.cal-day-row.has-log{background:color-mix(in oklab,var(--ccal) 5%,var(--surf))}
.cal-day-row.active.has-log{background:color-mix(in oklab,var(--prim) 10%,var(--surf))}
.cal-day-note{display:inline-flex;align-items:center;gap:2px;padding:.05rem .3rem;border-radius:.3rem;font-size:.58rem;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-day-session{display:inline-flex;align-items:center;gap:2px;padding:.05rem .3rem;border-radius:.3rem;font-size:.58rem;font-weight:700;cursor:pointer;flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-note-add{opacity:0;width:16px;height:16px;border-radius:.25rem;border:1px dashed var(--bord);background:none;cursor:pointer;display:grid;place-items:center;font-size:.65rem;color:var(--txm);padding:0;flex-shrink:0;transition:opacity .15s}
.cal-day-row:hover .cal-note-add{opacity:1}
.cal-note-add:hover{border-color:var(--prim);color:var(--prim)}
/* Session popup */
.ses-popup{position:fixed;z-index:500;background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);box-shadow:var(--shmd);padding:.85rem 1rem;width:min(360px,90vw);display:flex;flex-direction:column;gap:.5rem}
.cal-day-num{font-size:.75rem;font-weight:700;color:var(--txm);width:18px;text-align:right;flex-shrink:0}
.cal-day-ab{font-size:.62rem;font-weight:700;color:var(--txf);width:20px;flex-shrink:0}
.cal-day-dots{display:flex;gap:2px;align-items:center;flex:1}
.cal-dot{width:5px;height:5px;border-radius:50%}
/* Centre repas */
.repas-center{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.date-nav{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;background:var(--surf);border-bottom:1px solid var(--bord);flex-shrink:0}
.date-lbl{font-weight:700;font-size:.95rem;text-align:center;flex:1}
.meal-block{border-bottom:1px solid var(--bord);background:var(--surf)}
.meal-hdr-row{display:flex;align-items:center;padding:.7rem 1.25rem;gap:.75rem}
.meal-emoji{font-size:1.1rem;flex-shrink:0}
.meal-name-txt{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;flex:1}
.meal-kcal-txt{font-size:.75rem;color:var(--txm)}
.food-row{display:flex;align-items:center;gap:.5rem;padding:.35rem 1.25rem .35rem 2.5rem;border-top:1px dashed var(--bord);background:var(--surf2)}
.fi{width:30px;height:30px;object-fit:contain;border-radius:.35rem;background:var(--surfoff);border:1px solid var(--bord);padding:2px;flex-shrink:0}
.fph{width:30px;height:30px;border-radius:.35rem;background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center;font-size:.7rem;flex-shrink:0;color:var(--txf)}
/* Picker inline */
.food-picker{background:var(--surfoff);border-top:1px solid var(--bord);display:none;flex-direction:column}
.food-picker.open{display:flex}
.fp-list{overflow-y:auto;max-height:200px}
.fp-item{display:flex;align-items:center;gap:.5rem;padding:.35rem .85rem;border-bottom:1px solid var(--bord);cursor:pointer;transition:background var(--tr)}
.fp-item:hover,.fp-item.sel{background:color-mix(in oklab,var(--prim) 7%,var(--surf))}
.fp-calc{padding:.55rem .85rem;border-top:1px solid var(--bord);background:var(--surf);display:none;flex-wrap:wrap;gap:.4rem;align-items:center}
.fp-calc.show{display:flex}
/* Droite macros + hist */
.repas-right{overflow-y:auto;border-left:1px solid var(--bord);background:var(--surf);display:flex;flex-direction:column;gap:0}
/* Macro rings */
.macro-rings-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;padding:.85rem .65rem;border-bottom:1px solid var(--bord)}
.mr-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.ring-outer{position:relative;width:60px;height:60px}
.ring-svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surfoff);stroke-width:6}
.ring-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.16,1,.3,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.mr-lbl{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--txm)}
.mr-val{font-size:.6rem;font-weight:700}
.mr-pct{font-size:.55rem;color:var(--txf)}
/* Hist right */
.hist-row{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;border-bottom:1px solid var(--bord);cursor:pointer;transition:background var(--tr)}
.hist-row:hover{background:var(--surfoff)}
.hist-dt{font-size:.7rem;font-weight:700;width:68px;flex-shrink:0}
.hist-bars{display:flex;gap:2px;align-items:center;flex:1}
.hbar{height:8px;border-radius:2px;min-width:2px}

/* ── ONGLET ALIMENTS ── */
.foods-layout{display:grid;grid-template-columns:280px 1fr;flex:1;overflow:hidden}
.foods-sidebar{border-right:1px solid var(--bord);overflow-y:auto;display:flex;flex-direction:column}
.food-list-item{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;border-bottom:1px solid var(--bord);cursor:pointer;transition:background var(--tr)}
.food-list-item:hover,.food-list-item.active{background:color-mix(in oklab,var(--prim) 7%,var(--surf))}
.fli-img{width:34px;height:34px;object-fit:contain;border-radius:.4rem;background:var(--surfoff);border:1px solid var(--bord);padding:2px;flex-shrink:0}
.fli-ph{width:34px;height:34px;border-radius:.4rem;background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center;flex-shrink:0;color:var(--txf);font-size:.75rem}
.fli-info{flex:1;min-width:0}
.fli-name{font-size:.8rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fli-macros{font-size:.62rem;color:var(--txm)}
.food-detail{overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:.85rem}
.fd-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden}
.fd-img-area{background:var(--surfoff);display:flex;align-items:center;justify-content:center;height:160px;border-bottom:1px solid var(--bord)}
.fd-img{max-width:100%;max-height:140px;object-fit:contain;border-radius:.5rem}
.macro-bar-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.45rem}
.macro-bar-row:last-child{margin-bottom:0}
.mbl{font-size:.72rem;font-weight:600;width:80px;flex-shrink:0}
.mbb{flex:1;height:8px;border-radius:999px;background:var(--surfoff);overflow:hidden}
.mbf{height:100%;border-radius:999px}
.mbv{font-size:.68rem;color:var(--txm);width:50px;text-align:right;flex-shrink:0}

/* ── COMPLÉMENTS & RECETTES ── */
.list-content{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem}
.list-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--shsm)}
.lc-hdr{display:flex;align-items:center;gap:.65rem;padding:.75rem 1rem;border-bottom:1px solid var(--bord)}
.lc-img{width:44px;height:44px;object-fit:contain;border-radius:.5rem;background:var(--surfoff);border:1px solid var(--bord);padding:3px;flex-shrink:0}
.lc-ph{width:44px;height:44px;border-radius:.5rem;background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center;flex-shrink:0;font-size:1.1rem}
.lc-info{flex:1;min-width:0}
.lc-name{font-size:.88rem;font-weight:700}
.lc-sub{font-size:.68rem;color:var(--txm);margin-top:.1rem}
.lc-body{padding:.75rem 1rem}
.ing-row{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px dashed var(--bord);font-size:.78rem}
.ing-row:last-child{border-bottom:none}

/* ── DASHBOARD ── */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1rem;flex:1;overflow-y:auto}
.dash-full{grid-column:1/-1}
.stat-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:.9rem 1.1rem;box-shadow:var(--shsm);border-top:3px solid var(--sc)}
.sc-val{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;line-height:1;margin:.2rem 0}
.sc-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txm)}
.sc-sub{font-size:.68rem;color:var(--txf);margin-top:.2rem}

/* ── MODALES ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:400;display:none;align-items:center;justify-content:center}
.modal{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:1.1rem;width:min(520px,96vw);box-shadow:var(--shmd);display:flex;flex-direction:column;gap:.65rem;max-height:90dvh;overflow-y:auto}
.mt{font-weight:700;font-size:.92rem}
.mr2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.mr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.ma{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.2rem}
.sep{border:none;border-top:1px solid var(--bord);margin:.1rem 0}
.img-pick-btn{display:flex;align-items:center;gap:.5rem;padding:.38rem .6rem;border:1px solid var(--bord);border-radius:var(--rmd);background:var(--surf);cursor:pointer;transition:all var(--tr);min-height:34px}
.img-pick-btn:hover{border-color:var(--prim);background:var(--surfoff)}
.ipt{width:32px;height:32px;object-fit:contain;border-radius:.3rem;background:var(--surfoff);flex-shrink:0}
.calc-row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;background:var(--surfoff);border-radius:var(--rmd);padding:.5rem .65rem}
.calc-res{font-size:.75rem;color:var(--tx);background:var(--surf);border-radius:var(--rmd);padding:.3rem .55rem;border:1px solid var(--bord);min-width:160px}

@media(max-width:900px){
  .repas-layout{grid-template-columns:1fr;grid-template-rows:180px 1fr 220px}
  .cal-sidebar{border-right:none;border-bottom:1px solid var(--bord)}
  .repas-right{border-left:none;border-top:1px solid var(--bord)}
  .foods-layout{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header class="hdr">
  <button class="btn-icon" id="homeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><polyline points="9 21 9 12 15 12 15 21"/></svg></button>
  <span style="font-weight:700;font-size:1rem;flex:1">Nutrition</span>
  <button class="btn btn-sm" id="copyDayBtn">📋 Copier ce jour</button>
  <button class="btn btn-sm" id="goalsBtn">⚙ Objectifs</button>
  <input type="file" id="nutriImportFile" accept=".json,application/json" style="display:none">
  <button class="btn-icon" id="nutriImportBtn" title="Importer (remplace toutes les données nutrition)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
  <button class="btn-icon" id="nutriExportBtn" title="Exporter tout (JSON)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  </button>
  <button class="btn-icon" id="themeBtn"><svg id="thDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg id="thLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
</header>

<!-- TABS -->
<nav class="tabs">
  <button class="tab active" data-tab="dash">🏠 Tableau de bord</button>
  <button class="tab" data-tab="repas">🍽 Repas</button>
  <button class="tab" data-tab="aliments">🥗 Aliments</button>
  <button class="tab" data-tab="complements">💊 Compléments</button>
  <button class="tab" data-tab="recettes">📖 Recettes</button>
  <button class="tab" data-tab="smoothies">🥤 Smoothies</button>
</nav>

<!-- ═══ DASHBOARD ═══ -->
<div class="tab-content active" id="tab-dash">
  <div class="dash-grid" id="dashGrid"></div>
</div>

<!-- ═══ REPAS ═══ -->
<div class="tab-content" id="tab-repas">
  <div class="repas-layout">
    <div class="cal-sidebar" id="calSidebar"></div>
    <div class="repas-center">
      <div class="date-nav">
        <button class="btn-icon" id="prevDay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <div class="date-lbl" id="dateLbl">—</div>
        <button class="btn-icon" id="nextDay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
      <div style="overflow-y:auto;flex:1" id="mealsArea"></div>
    </div>
    <div class="repas-right">
      <div class="macro-rings-grid" id="macroRings"></div>
      <div class="ph"><span class="pt">📅 Historique</span><span id="histCount" style="font-size:.68rem;color:var(--txm)"></span></div>
      <div style="overflow-y:auto;flex:1" id="histPanel"></div>
    </div>
  </div>
</div>

<!-- ═══ ALIMENTS ═══ -->
<div class="tab-content" id="tab-aliments">
  <div style="padding:.6rem .85rem;border-bottom:1px solid var(--bord);display:flex;gap:.5rem;background:var(--surf);flex-shrink:0">
    <input class="inp" id="foodSearchInp" placeholder="🔎 Rechercher un aliment…" style="font-size:.78rem">
    <select class="sel" id="foodCatFilter" style="width:140px"><option value="">Tous</option><option value="food">Aliment</option><option value="supp">Complément</option></select>
    <button class="btn btn-p btn-sm" id="addFoodBtn">+ Nouveau</button>
  </div>
  <div class="foods-layout" style="flex:1">
    <div class="foods-sidebar" id="foodsList"></div>
    <div class="food-detail" id="foodDetail"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--txf);font-size:.82rem;font-style:italic">Sélectionnez un aliment</div></div>
  </div>
</div>

<!-- ═══ COMPLÉMENTS ═══ -->
<div class="tab-content" id="tab-complements">
  <div style="padding:.6rem .85rem;border-bottom:1px solid var(--bord);display:flex;gap:.5rem;background:var(--surf);flex-shrink:0">
    <span style="font-size:.82rem;font-weight:600;flex:1;display:flex;align-items:center">💊 Suivi des compléments</span>
    <button class="btn btn-p btn-sm" id="addSuppBtn">+ Ajouter</button>
  </div>
  <div class="list-content" id="suppList"></div>
</div>

<!-- ═══ RECETTES ═══ -->
<div class="tab-content" id="tab-recettes">
  <div style="padding:.6rem .85rem;border-bottom:1px solid var(--bord);display:flex;gap:.5rem;background:var(--surf);flex-shrink:0">
    <input class="inp" id="recipeSearch" placeholder="🔎 Rechercher une recette…" style="font-size:.78rem">
    <button class="btn btn-p btn-sm" id="addRecipeBtn">+ Nouvelle recette</button>
  </div>
  <div class="list-content" id="recipeList"></div>
</div>

<!-- ═══ SMOOTHIES ═══ -->
<div class="tab-content" id="tab-smoothies">

<script src="db.js"></script>
<script src="gymos-utils.js"></script>
<script>
// ══ CONSTANTES ══
const NK='gymos-nutrition-v2';
const n1=v=>Math.round((v||0)*10)/10;
const CIRC=2*Math.PI*22;
const MEALS=[{id:'breakfast',e:'🌅',n:'Petit-déjeuner'},{id:'lunch',e:'☀️',n:'Déjeuner'},{id:'dinner',e:'🌙',n:'Dîner'},{id:'snack',e:'🍎',n:'Collation'}];
const MACROS=[{k:'cal',l:'Calories',u:'kcal',c:'var(--ccal)'},{k:'prot',l:'Protéines',u:'g',c:'var(--cprot)'},{k:'carb',l:'Glucides',u:'g',c:'var(--ccarb)'},{k:'fat',l:'Lipides',u:'g',c:'var(--cfat)'}];
const DOW=['DI','LU','MA','ME','JE','VE','SA'];
const MNAMES=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MCOLS=['#2d6cdf','#5bb8d4','#3a8a3f','#5aaa3a','#8bc34a','#e8a025','#8b5a2b','#cc3333','#e0612a','#9b59b6','#d63a8e','#4a6080'];

let _d={goals:{cal:2000,prot:150,carb:250,fat:70},foods:[],supplements:[],recipes:[],smoothies:[],logs:{}};
let _cur=dateToISO(new Date());
let _selFoodId=null,_editFoodId=null,_editRecipeId=null,_editRecipeType=null;
let _openMeal=null;
let _rvIngs=[]; // ingrédients recette en cours d'édition
let _atmData=null; // données pour ajouter au repas

// ══ STOCKAGE ══
function load(){try{_d=JSON.parse(localStorage.getItem(NK)||'null')||{goals:{cal:2000,prot:150,carb:250,fat:70},foods:[],supplements:[],recipes:[],smoothies:[],logs:{}};}catch{}}
function save(){localStorage.setItem(NK,JSON.stringify(_d));GymDB.write('nutrition.json',_d);}

// ══ HELPERS ══
function macros4qty(food,qty){const f=qty/100;return{cal:n1((food.per100.cal||0)*f),prot:n1((food.per100.prot||0)*f),carb:n1((food.per100.carb||0)*f),fat:n1((food.per100.fat||0)*f)};}
function dayTotals(d){return(_d.logs[d]||[]).reduce((t,e)=>({cal:t.cal+(e.cal||0),prot:t.prot+(e.prot||0),carb:t.carb+(e.carb||0),fat:t.fat+(e.fat||0)}),{cal:0,prot:0,carb:0,fat:0});}
function fmtD(iso){const d=new Date(iso+'T00:00'),t=todayISO(),y=addDaysTo(t,-1);if(iso===t)return"Aujourd'hui";if(iso===y)return'Hier';return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function fmtShort(iso){const d=new Date(iso+'T00:00');return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function recipeCalc(ings){return ings.reduce((t,ing)=>{const f=_d.foods.find(x=>x.id===ing.foodId);if(!f)return t;const m=macros4qty(f,ing.qty);return{cal:t.cal+m.cal,prot:t.prot+m.prot,carb:t.carb+m.carb,fat:t.fat+m.fat};},{cal:0,prot:0,carb:0,fat:0});}

// ══ DATE HELPERS (local, pas UTC) ══
function dateToISO(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function todayISO(){return dateToISO(new Date());}
function addDaysTo(iso,n){const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return dateToISO(d);}

// ══ NOTES AGENDA (partagées avec Historique) ══
const NOTE_KEY='gymos-agenda-notes-v1';
let _notes={};
const NOTE_COLORS=['#01696f','#0161be','#fa7b01','#5a9d24','#a12c7b','#974f1a','#374151','#dc2626'];
function loadNotes(){try{_notes=JSON.parse(localStorage.getItem(NOTE_KEY)||'{}');}catch{_notes={};}}
function saveNotes(){localStorage.setItem(NOTE_KEY,JSON.stringify(_notes));}

// ══ SÉANCES DEPUIS HISTORIQUE ══
let _sessions={};
function loadSessions(){
  try{
    const hist=JSON.parse(localStorage.getItem('gymos-historique-v1')||'[]');
    _sessions={};
    hist.forEach(h=>{if(!_sessions[h.date])_sessions[h.date]=[];_sessions[h.date].push(h);});
  }catch{_sessions={};}
}

// ══ POPUP SESSION ══
let _sesPopupEl=null;
function showSessionPopup(sessions,anchor){
  closeSesPopup();
  const pop=document.createElement('div'); pop.className='ses-popup'; _sesPopupEl=pop;
  const rect=anchor.getBoundingClientRect();
  pop.style.cssText=`position:fixed;z-index:500;left:${Math.min(rect.right+6,window.innerWidth-380)}px;top:${Math.min(rect.top,window.innerHeight-300)}px`;
  pop.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem"><div style="font-weight:700;font-size:.85rem">Séance${sessions.length>1?'s':''} — ${fmtShort(sessions[0].date)}</div><button id="closeSesBtn" style="border:none;background:none;cursor:pointer;color:var(--txm);font-size:1.1rem;line-height:1">×</button></div>`;
  sessions.forEach(h=>{
    const nbS=(h.exercices||[]).reduce((n,e)=>n+(e.series?.length||0),0);
    const sec=document.createElement('div'); sec.style.cssText='border-top:1px solid var(--bord);padding-top:.45rem;margin-top:.35rem';
    sec.innerHTML=`<div style="font-size:.8rem;font-weight:700;margin-bottom:.25rem">${esc(h.seanceNom||'Séance libre')} <span style="color:var(--txm);font-weight:400;font-size:.7rem">${h.heure||''}</span></div>`;
    (h.exercices||[]).slice(0,5).forEach(e=>{
      sec.innerHTML+=`<div style="font-size:.72rem;color:var(--txm);padding:.1rem 0">• ${esc(e.nom)} <span style="color:var(--txf)">${(e.series||[]).length} sér.</span></div>`;
    });
    if((h.exercices||[]).length>5) sec.innerHTML+=`<div style="font-size:.65rem;color:var(--txf)">+ ${h.exercices.length-5} autres…</div>`;
    sec.innerHTML+=`<div style="margin-top:.3rem;font-size:.7rem;color:var(--txm)">${nbS} séries · ${h.volumeTotal>0?h.volumeTotal+'kg':''} · ${h.dureeMin?h.dureeMin+'min':''}</div>`;
    pop.appendChild(sec);
  });
  document.body.appendChild(pop);
  pop.querySelector('#closeSesBtn').addEventListener('click',closeSesPopup);
  setTimeout(()=>document.addEventListener('click',closeSesOnClickOut),100);
}
function closeSesPopup(){if(_sesPopupEl){_sesPopupEl.remove();_sesPopupEl=null;document.removeEventListener('click',closeSesOnClickOut);}}
function closeSesOnClickOut(e){if(_sesPopupEl&&!_sesPopupEl.contains(e.target))closeSesPopup();}

// ══ MODALE NOTE ══
let _noteTarget=null;
let _noteColor=NOTE_COLORS[0];
let _noteEditId=null;
function openNoteModal(dateStr,editId=null){
  _noteTarget=dateStr; _noteEditId=editId;
  const existing=editId?(_notes[dateStr]||[]).find(n=>n.id===editId):null;
  _noteColor=existing?.color||NOTE_COLORS[0];
  const ov=document.createElement('div'); ov.id='noteModalOv'; ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:600;display:flex;align-items:center;justify-content:center';
  const box=document.createElement('div'); box.style.cssText='background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:1.1rem;width:min(360px,94vw);box-shadow:var(--shmd);display:flex;flex-direction:column;gap:.65rem';
  const colorGrid=NOTE_COLORS.map(c=>`<button class="nc-btn" data-color="${c}" style="width:22px;height:22px;border-radius:50%;background:${c};border:3px solid ${c===_noteColor?'var(--tx)':c};cursor:pointer;padding:0;flex-shrink:0"></button>`).join('');
  box.innerHTML=`<div style="font-weight:700;font-size:.88rem">📝 Note du jour — ${fmtShort(dateStr)}</div>
    <input id="noteInp" class="inp" placeholder="Votre note…" value="${esc(existing?.text||'')}">
    <div style="display:flex;gap:.35rem;flex-wrap:wrap">${colorGrid}</div>
    <div style="display:flex;gap:.4rem;justify-content:flex-end">
      ${editId?'<button id="noteDelBtn" class="btn btn-sm" style="color:var(--err);border-color:var(--err)44">Supprimer</button>':''}
      <button id="noteCancelBtn" class="btn btn-sm">Annuler</button>
      <button id="noteSaveBtn" class="btn btn-sm btn-p">Sauvegarder</button>
    </div>`;
  ov.appendChild(box); document.body.appendChild(ov);
  box.querySelectorAll('.nc-btn').forEach(btn=>{btn.addEventListener('click',()=>{_noteColor=btn.dataset.color;box.querySelectorAll('.nc-btn').forEach(b=>b.style.border=`3px solid ${b.dataset.color===_noteColor?'var(--tx)':b.dataset.color}`);});});
  box.querySelector('#noteSaveBtn').addEventListener('click',()=>{
    const txt=box.querySelector('#noteInp').value.trim(); if(!txt)return;
    if(!_notes[_noteTarget])_notes[_noteTarget]=[];
    if(_noteEditId){const i=_notes[_noteTarget].findIndex(n=>n.id===_noteEditId);if(i>=0)_notes[_noteTarget][i]={id:_noteEditId,text:txt,color:_noteColor};}
    else _notes[_noteTarget].push({id:Math.random().toString(36).slice(2,8),text:txt,color:_noteColor});
    saveNotes(); ov.remove(); renderCalSidebar();
  });
  box.querySelector('#noteCancelBtn').addEventListener('click',()=>ov.remove());
  if(editId) box.querySelector('#noteDelBtn').addEventListener('click',()=>{
    _notes[_noteTarget]=(_notes[_noteTarget]||[]).filter(n=>n.id!==editId);
    saveNotes(); ov.remove(); renderCalSidebar();
  });
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  setTimeout(()=>box.querySelector('#noteInp').focus(),50);
}
function switchTab(id){
  document.querySelectorAll('.tab,.tab-content').forEach(el=>{
    el.classList.toggle('active',(el.dataset.tab||el.id.replace('tab-',''))===id);
  });
  if(id==='dash') renderDash();
  else if(id==='repas'){loadSessions();setDate(_cur);}
  else if(id==='aliments') renderFoodsList();
  else if(id==='complements') renderSupplements();
  else if(id==='recettes') renderRecipes();
  else if(id==='smoothies') renderSmoothies();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

// ══ DASHBOARD ══
function renderDash(){
  const g=document.getElementById('dashGrid'); g.innerHTML='';
  const today=_cur;
  const logDates=Object.keys(_d.logs).filter(d=>(_d.logs[d]||[]).length>0).sort().reverse();
  const tot=dayTotals(today);
  const g7=_d.goals;
  // Stat cards
  const cards=[
    {val:logDates.length,lbl:'Jours enregistrés',sub:'au total',sc:'var(--prim)'},
    {val:Math.round(tot.cal)+' kcal',lbl:"Aujourd'hui",sub:`Obj: ${g7.cal} kcal`,sc:'var(--ccal)'},
    {val:n1(tot.prot)+'g',lbl:'Protéines aujourd\'hui',sub:`Obj: ${g7.prot}g`,sc:'var(--cprot)'},
    {val:_d.foods.length,lbl:'Aliments en base',sub:_d.recipes.length+' recettes · '+_d.smoothies.length+' smoothies',sc:'var(--ok)'},
  ];
  const statRow=document.createElement('div'); statRow.className='dash-full'; statRow.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem';
  cards.forEach(({val,lbl,sub,sc})=>{
    const c=document.createElement('div');c.className='stat-card';c.style.setProperty('--sc',sc);
    c.innerHTML=`<div class="sc-lbl">${lbl}</div><div class="sc-val">${val}</div><div class="sc-sub">${sub}</div>`;
    statRow.appendChild(c);
  }); g.appendChild(statRow);
  // Graphe semaine
  const weekCard=document.createElement('div'); weekCard.className='panel dash-full'; weekCard.style.marginBottom='.25rem';
  const maxD=new Date(today+'T00:00');const days7=Array.from({length:7},(_,i)=>{const d=new Date(maxD);d.setDate(maxD.getDate()-6+i);return dateToISO(d);});
  const mxCal=Math.max(1,...days7.map(d=>dayTotals(d).cal));
  weekCard.innerHTML=`<div class="ph"><span class="pt">📊 Calories — 7 derniers jours</span></div><div style="padding:.75rem 1rem;display:flex;gap:4px;align-items:flex-end;height:100px">
  ${days7.map(d=>{const cal=dayTotals(d).cal;const pct=Math.max(2,Math.round(cal/mxCal*100));const isT=d===today;
    return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:100%;height:${pct}%;background:${isT?'var(--ccal)':'var(--txm)'};opacity:${isT?1:.45};border-radius:3px 3px 0 0;min-height:2px" title="${cal} kcal"></div><div style="font-size:.6rem;color:var(--txf)">${new Date(d+'T00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'})}</div></div>`;
  }).join('')}</div>`;
  g.appendChild(weekCard);
  // Historique récent
  const histCard=document.createElement('div'); histCard.className='panel';
  histCard.innerHTML=`<div class="ph"><span class="pt">📅 Journées récentes</span></div>`;
  const hl=document.createElement('div'); hl.style.cssText='overflow-y:auto;max-height:240px';
  logDates.slice(0,15).forEach(d=>{
    const tot=dayTotals(d);
    const row=document.createElement('div'); row.className='hist-row'; row.style.cursor='pointer';
    const mxC=Math.max(1,_d.goals.cal);
    row.innerHTML=`<div class="hist-dt">${fmtShort(d)}</div>
      <div class="hist-bars"><div class="hbar" style="width:${Math.round(tot.cal/mxC*100)}px;background:var(--ccal)"></div><div class="hbar" style="width:${Math.round(tot.prot/_d.goals.prot*60)}px;background:var(--cprot)"></div></div>
      <div style="font-size:.68rem;color:var(--txm);text-align:right;flex-shrink:0">${Math.round(tot.cal)} kcal</div>

  // Top aliments
  const topCard=document.createElement('div'); topCard.className='panel';
  const freq={};
  Object.values(_d.logs).flat().forEach(e=>{freq[e.name]=(freq[e.name]||0)+1;});
  const topFoods=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8);
  topCard.innerHTML=`<div class="ph"><span class="pt">🏆 Aliments fréquents</span></div>`;
  const tl=document.createElement('div'); tl.style.padding='.65rem 1rem';
  const maxF=Math.max(1,...topFoods.map(([,v])=>v));
  topFoods.forEach(([name,cnt])=>{
    const f=_d.foods.find(x=>x.name===name);
    tl.innerHTML+=`<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem">
      ${f?.image?`<img style="width:24px;height:24px;object-fit:contain;border-radius:.3rem;background:var(--surfoff);border:1px solid var(--bord)" src="./img/${f.image}" onerror="this.style.display='none'">`:'<div style="width:24px;height:24px;display:grid;place-items:center;font-size:.75rem">🍽</div>'}
      <span style="font-size:.78rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</span>
      <div style="flex:1;height:7px;background:var(--surfoff);border-radius:999px;overflow:hidden;max-width:80px"><div style="width:${Math.round(cnt/maxF*100)}%;height:100%;background:var(--prim);border-radius:999px"></div></div>
      <span style="font-size:.65rem;color:var(--txm)">${cnt}×</span></div>`;
  });
  if(!topFoods.length) tl.innerHTML='<div style="color:var(--txf);font-size:.78rem;font-style:italic;text-align:center;padding:.5rem">Aucun historique</div>';
  topCard.appendChild(tl); g.appendChild(topCard);
}

// ══ CALENDRIER SIDEBAR ══
function renderCalSidebar(){
  const sb=document.getElementById('calSidebar'); sb.innerHTML='';
  const todayStr=todayISO();
  const curD=new Date(_cur+'T00:00');
  const yr=curD.getFullYear(), mo=curD.getMonth();
  const mColor=MCOLS[mo];
  const hdr=document.createElement('div'); hdr.className='cal-month-hdr'; hdr.style.background=mColor;
  hdr.textContent=MNAMES[mo].toUpperCase()+' '+yr;
  sb.appendChild(hdr);
  const last=new Date(yr,mo+1,0).getDate();
  for(let d=1;d<=last;d++){
    const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dObj=new Date(dateStr+'T00:00');
    const dow=dObj.getDay();
    const hasLog=(_d.logs[dateStr]||[]).length>0;
    const isToday=dateStr===todayStr;
    const isActive=dateStr===_cur;
    const dayNotes=_notes[dateStr]||[];
    const daySess=_sessions[dateStr]||[];
    const row=document.createElement('div');
    row.className='cal-day-row'+(isToday?' today':'')+(isActive?' active':'')+(hasLog?' has-log':'');
    // Fond weekend
    if(dow===0||dow===6) row.style.background=row.style.background||'rgba(0,0,0,.02)';
    // Numéro + abbrév
    const numEl=document.createElement('span'); numEl.className='cal-day-num';
    numEl.style.color=isToday?mColor:''; numEl.textContent=d;
    const abEl=document.createElement('span'); abEl.className='cal-day-ab'; abEl.textContent=DOW[dow];
    row.append(numEl,abEl);
    // Séances
    daySess.forEach(h=>{
      const pill=document.createElement('span'); pill.className='cal-day-session';
      const tc={'Push':'#fa7b01','Pull':'#0161be','Legs':'#5a9d24','Full Body':'#8338bb','Cardio':'#b90207'}[h.seanceType]||'#9a9891';
      pill.style.background=`rgba(${parseInt(tc.slice(1,3),16)},${parseInt(tc.slice(3,5),16)},${parseInt(tc.slice(5,7),16)},.15)`;
      pill.style.color=tc; pill.style.border=`1px solid ${tc}55`;
      pill.textContent='🏋 '+(h.seanceNom||'Séance').slice(0,10); pill.title=h.seanceNom||'Séance';
      pill.addEventListener('click',e=>{e.stopPropagation();showSessionPopup(daySess,pill);});
      row.appendChild(pill);
    });
    // Notes
    dayNotes.forEach(note=>{
      const pill=document.createElement('span'); pill.className='cal-day-note'; pill.style.background=note.color;
      pill.textContent='📝 '+note.text; pill.title='Cliquer pour modifier';
      pill.addEventListener('click',e=>{e.stopPropagation();openNoteModal(dateStr,note.id);});
      row.appendChild(pill);
    });
    // Indicateur repas
    if(hasLog){
      const tot=dayTotals(dateStr);const pct=Math.min(1,tot.cal/(_d.goals.cal||1));
      const dot=document.createElement('div');dot.style.cssText=`width:${Math.max(4,Math.round(pct*28))}px;height:5px;border-radius:999px;background:var(--ccal);flex-shrink:0`;dot.title=`${Math.round(tot.cal)} kcal`;
      row.appendChild(dot);
    }
    // Bouton + note (au survol)
    const addNoteBtn=document.createElement('button'); addNoteBtn.className='cal-note-add'; addNoteBtn.textContent='+'; addNoteBtn.title='Ajouter une note';
    addNoteBtn.addEventListener('click',e=>{e.stopPropagation();openNoteModal(dateStr);});
    row.appendChild(addNoteBtn);
    row.addEventListener('click',()=>setDate(dateStr));
    sb.appendChild(row);
  }
  // Nav mois
  const navRow=document.createElement('div'); navRow.style.cssText='display:flex;gap:.3rem;padding:.45rem .65rem;border-top:1px solid var(--bord);flex-shrink:0';
  const prevM=document.createElement('button'); prevM.className='btn btn-sm'; prevM.style.flex='1'; prevM.textContent='← Préc.';
  prevM.addEventListener('click',()=>{const d=new Date(_cur+'T00:00');setDate(dateToISO(new Date(d.getFullYear(),d.getMonth(),0)));renderCalSidebar();});
  const nextM=document.createElement('button'); nextM.className='btn btn-sm'; nextM.style.flex='1'; nextM.textContent='Suiv. →';
  nextM.addEventListener('click',()=>{const d=new Date(_cur+'T00:00');setDate(dateToISO(new Date(d.getFullYear(),d.getMonth()+1,1)));renderCalSidebar();});
  navRow.append(prevM,nextM); sb.appendChild(navRow);
}

// ══ REPAS ══
function renderMeals(){
  const log=_d.logs[_cur]||[];
  const area=document.getElementById('mealsArea'); area.innerHTML='';
  MEALS.forEach(meal=>{
    const entries=log.filter(e=>e.meal===meal.id);
    const mCal=Math.round(entries.reduce((t,e)=>t+(e.cal||0),0));
    const block=document.createElement('div'); block.className='meal-block';
    const hdrRow=document.createElement('div'); hdrRow.className='meal-hdr-row';
    hdrRow.innerHTML=`<span class="meal-emoji">${meal.e}</span><span class="meal-name-txt">${meal.n}</span><span class="meal-kcal-txt">${mCal} kcal</span>`;
    const addBtn=document.createElement('button'); addBtn.className='btn btn-sm'; addBtn.textContent='+ Ajouter';
    addBtn.addEventListener('click',e=>{e.stopPropagation();_openMeal=_openMeal===meal.id?null:meal.id;renderMeals();});
    hdrRow.appendChild(addBtn); block.appendChild(hdrRow);
    entries.forEach(e=>{
      const f=_d.foods.find(x=>x.id===e.foodId)||{name:e.name,image:e.image||''};
      const row=document.createElement('div'); row.className='food-row';
      const del=document.createElement('button'); del.className='btn-icon' ; del.style.cssText='width:22px;height:22px;border:none;background:none;color:var(--txf)'; del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="11" height="11"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      del.addEventListener('click',()=>{_d.logs[_cur]=(_d.logs[_cur]||[]).filter(x=>x.id!==e.id);save();renderMeals();renderMacroRings();renderHist();renderCalSidebar();});
      const imgEl=e.image||f.image?document.createElement('img'):document.createElement('div');
      if(e.image||f.image){imgEl.className='fi';imgEl.src=`./img/${e.image||f.image}`;imgEl.onerror=()=>{imgEl.className='fph';imgEl.innerHTML='🍽';};}
      else{imgEl.className='fph';imgEl.innerHTML='🍽';}
      row.appendChild(imgEl);
      row.innerHTML+=`<span style="flex:1;min-width:0"><span style="font-size:.78rem;font-weight:600">${esc(e.name)}</span><span style="font-size:.62rem;color:var(--txm)"> · ${e.qty}g</span></span>
        <span style="font-size:.62rem;color:var(--txm);text-align:right;flex-shrink:0">${Math.round(e.cal||0)} kcal<br>P${n1(e.prot)}g G${n1(e.carb)}g L${n1(e.fat)}g</span>`;
      row.appendChild(del); block.appendChild(row);
    });
    // Picker inline
    const picker=buildMealPicker(meal.id);
    if(_openMeal===meal.id) picker.classList.add('open');
    block.appendChild(picker);
    area.appendChild(block);
  });
}

function buildMealPicker(mealId){
  const wrap=document.createElement('div'); wrap.className='food-picker';
  const searchBar=document.createElement('div'); searchBar.style.cssText='display:flex;gap:.4rem;padding:.45rem .75rem;border-bottom:1px solid var(--bord)';
  const srch=document.createElement('input'); srch.className='inp'; srch.style.fontSize='.76rem'; srch.placeholder='Rechercher…';
  const crBtn=document.createElement('button'); crBtn.className='btn btn-sm'; crBtn.textContent='+ Créer';
  crBtn.addEventListener('click',()=>openFoodModal(null, mealId));
  searchBar.append(srch,crBtn); wrap.appendChild(searchBar);
  const list=document.createElement('div'); list.className='fp-list'; wrap.appendChild(list);
  const calc=document.createElement('div'); calc.className='fp-calc'; wrap.appendChild(calc);
  const footer=document.createElement('div'); footer.style.cssText='display:flex;gap:.4rem;justify-content:flex-end;padding:.45rem .75rem;border-top:1px solid var(--bord)';
  const closeBtn=document.createElement('button'); closeBtn.className='btn btn-sm'; closeBtn.textContent='Fermer';
  closeBtn.addEventListener('click',()=>{_openMeal=null;renderMeals();});
  const addBtn=document.createElement('button'); addBtn.className='btn btn-sm btn-p'; addBtn.textContent='Ajouter'; addBtn.disabled=true;
  footer.append(closeBtn,addBtn); wrap.appendChild(footer);
  let selFood=null;

  function refreshList(q){
    list.innerHTML='';
    const all=[..._d.foods, ..._d.recipes.map(r=>({...r,_recipe:true})), ..._d.smoothies.map(s=>({...s,_smoothie:true}))];
    const filtered=all.filter(f=>!q||f.name.toLowerCase().includes(q.toLowerCase()));
    if(!filtered.length){list.innerHTML='<div style="padding:.65rem;text-align:center;color:var(--txf);font-size:.75rem;font-style:italic">Aucun résultat</div>';return;}
    filtered.forEach(f=>{
      const item=document.createElement('div'); item.className='fp-item';
      const imgSrc=f.image;
      const img=imgSrc?`<img class="fi" src="./img/${imgSrc}" onerror="this.className='fph';this.innerHTML='🍽'" alt="" style="width:28px;height:28px">`:`<div class="fph" style="width:28px;height:28px;font-size:.7rem">${f._recipe?'📖':f._smoothie?'🥤':'🍽'}</div>`;
      const macroTxt=f._recipe||f._smoothie?`${Math.round((recipeCalc(f.ingredients||[]).cal)/(f.portions||1))} kcal/portion`:`${f.per100?.cal||0} kcal/100g${f.unitWeight?` · 1 unité=${f.unitWeight}g`:''}`;
      item.innerHTML=img+`<div style="flex:1;min-width:0"><div style="font-size:.78rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</div><div style="font-size:.62rem;color:var(--txm)">${macroTxt}</div></div>`;
      item.addEventListener('click',()=>{
        list.querySelectorAll('.fp-item').forEach(i=>i.classList.remove('sel'));
        item.classList.add('sel'); selFood=f; addBtn.disabled=false;
        openPickCalc(calc,f);
      });
      list.appendChild(item);
    });
  }
  refreshList('');
  srch.addEventListener('input',()=>refreshList(srch.value));

  function openPickCalc(c,food){
    c.innerHTML=''; c.classList.add('show');
    const isRecipe=food._recipe||food._smoothie;
    const hasUnit=!isRecipe&&food.unitWeight>0;
    const qi=document.createElement('input'); qi.type='number'; qi.className='inp'; qi.style.cssText='width:85px;font-size:.76rem';
    qi.value=isRecipe?'1':(hasUnit?'1':'100');
    const us=document.createElement('select'); us.className='sel'; us.style.cssText='width:120px;font-size:.75rem';
    us.innerHTML=isRecipe?`<option value="portion">portions</option><option value="g">grammes</option>`:
      `<option value="g">grammes</option>${hasUnit?`<option value="unit" selected>unités (${food.unitWeight}g)</option>`:''}`;
    const rb=document.createElement('button'); rb.className='btn btn-sm btn-p'; rb.textContent='Calculer';
    const res=document.createElement('div'); res.style.cssText='font-size:.72rem;color:var(--tx);background:var(--surf);border-radius:var(--rmd);padding:.25rem .5rem;border:1px solid var(--bord);margin-top:.25rem;width:100%';
    function doCalc(){
      const q=parseFloat(qi.value)||0; const u=us.value;
      let m,grams;
      if(isRecipe){const tot=recipeCalc(food.ingredients||[]);const per=food.portions||1;grams=u==='portion'?q*100:q;m=u==='portion'?{cal:n1(tot.cal/per*q),prot:n1(tot.prot/per*q),carb:n1(tot.carb/per*q),fat:n1(tot.fat/per*q)}:macros4qty({per100:{cal:tot.cal/per,prot:tot.prot/per,carb:tot.carb/per,fat:tot.fat/per},unitWeight:100},q);}
      else{grams=u==='unit'?q*(food.unitWeight||100):q;m=macros4qty(food,grams);}
      res.textContent=`→ ${m.cal} kcal · P${m.prot}g · G${m.carb}g · L${m.fat}g`;
      c._computed={food,qty:grams,m};
    }
    rb.addEventListener('click',doCalc); qi.addEventListener('keydown',e=>e.key==='Enter'&&doCalc());
    doCalc();
    c.append(qi,us,rb,res);
  }

  addBtn.addEventListener('click',()=>{
    if(!selFood||!calc._computed)return;
    const{food,qty,m}=calc._computed;
    const entry={id:uid(),meal:mealId,foodId:food.id||'',name:food.name,image:food.image||'',qty:Math.round(qty),...m};
    if(!_d.logs[_cur])_d.logs[_cur]=[];
    _d.logs[_cur].push(entry); save();
    _openMeal=null; renderMeals(); renderMacroRings(); renderHist(); renderCalSidebar();
  });
  return wrap;
}

// ══ MACRO RINGS ══
function renderMacroRings(){
  const tot=dayTotals(_cur);
  const c=document.getElementById('macroRings'); c.innerHTML='';
  MACROS.forEach(({k,l,u,c:col})=>{
    const val=tot[k]||0,goal=_d.goals[k]||1;
    const pct=Math.min(1,val/goal);
    const offset=CIRC*(1-pct);
    const wrap=document.createElement('div'); wrap.className='mr-wrap';
    const ro=document.createElement('div'); ro.className='ring-outer';
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.className='ring-svg'; svg.setAttribute('viewBox','0 0 52 52');
    const bg=document.createElementNS('http://www.w3.org/2000/svg','circle'); bg.className='ring-bg';bg.setAttribute('cx','26');bg.setAttribute('cy','26');bg.setAttribute('r','22');
    const fill=document.createElementNS('http://www.w3.org/2000/svg','circle'); fill.className='ring-fill';fill.setAttribute('cx','26');fill.setAttribute('cy','26');fill.setAttribute('r','22');fill.setAttribute('stroke',col);fill.setAttribute('stroke-dasharray',CIRC);fill.setAttribute('stroke-dashoffset',offset);
    svg.append(bg,fill);ro.appendChild(svg);
    const center=document.createElement('div'); center.className='ring-center';
    center.innerHTML=`<span style="font-size:.62rem;font-weight:800;color:${col}">${Math.round(val)}</span><span style="font-size:.5rem;color:var(--txf)">${u}</span>`;
    ro.appendChild(center); wrap.appendChild(ro);
    wrap.innerHTML+=`<div class="mr-lbl">${l}</div><div class="mr-val" style="color:${col}">${Math.round(val)}/${Math.round(goal)}${u}</div><div class="mr-pct">${Math.round(pct*100)}%</div>`;
    wrap.insertBefore(ro,wrap.firstChild); c.appendChild(wrap);
  });
}

// ══ HISTORIQUE DROITE ══
function renderHist(){
  const p=document.getElementById('histPanel'); p.innerHTML='';
  const dates=Object.keys(_d.logs).filter(d=>(_d.logs[d]||[]).length).sort().reverse().slice(0,25);
  document.getElementById('histCount').textContent=dates.length+' jour'+(dates.length!==1?'s':'');
  const mxC=Math.max(1,...dates.map(d=>dayTotals(d).cal));
  dates.forEach(d=>{
    const tot=dayTotals(d);
    const row=document.createElement('div'); row.className='hist-row'; row.style.cursor='pointer';
    const isA=d===_cur;

    row.innerHTML=`<div class="hist-dt">${fmtShort(d)}</div>
      <div class="hist-bars"><div class="hbar" style="width:${Math.round(tot.cal/mxC*80)}px;background:var(--ccal)" title="${Math.round(tot.cal)} kcal"></div><div class="hbar" style="width:${Math.round(tot.prot/(_d.goals.prot||1)*50)}px;background:var(--cprot)"></div></div>

    row.querySelector('[title="Copier"]').addEventListener('click',e=>{e.stopPropagation();openCopy(d);});
    row.addEventListener('click',()=>setDate(d));
    p.appendChild(row);
  });
}

function updateFvUnit(){
  const uw=parseFloat(document.getElementById('fv-unit').value)||0;

  v.style.display='block';

  const p=n1((parseFloat(document.getElementById('fv-prot').value)||0)*uw/100);
  const g=n1((parseFloat(document.getElementById('fv-carb').value)||0)*uw/100);
  const l=n1((parseFloat(document.getElementById('fv-fat').value)||0)*uw/100);
  v.innerHTML=`<span style="font-weight:700;color:var(--txm)">Par unité (${uw}g) :</span> <span style="color:var(--ccal)">${c} kcal</span> · <span style="color:var(--cprot)">P${p}g</span> · <span style="color:var(--ccarb)">G${g}g</span> · <span style="color:var(--cfat)">L${l}g</span>`;
  document.getElementById('fv-cunit').innerHTML=`<option value="g">grammes</option><option value="unit">unités (${uw}g)</option>`;
}
// Synchronisation prix/kg ↔ prix/unité
function syncPriceFromKg(){
  const pkg=parseFloat(document.getElementById('fv-pricekg').value)||0;
  const uw=parseFloat(document.getElementById('fv-unit').value)||0;
  if(pkg>0&&uw>0){
    const pu=n1(pkg*uw/1000);
    document.getElementById('fv-priceunit').value=pu;
  }
  updatePricePreview();
}
function syncPriceFromUnit(){
  const pu=parseFloat(document.getElementById('fv-priceunit').value)||0;
  const uw=parseFloat(document.getElementById('fv-unit').value)||0;
  if(pu>0&&uw>0){
    const pkg=n1(pu/uw*1000);
    document.getElementById('fv-pricekg').value=pkg;
  }
  updatePricePreview();
}
function updatePricePreview(){
  const pkg=parseFloat(document.getElementById('fv-pricekg').value)||0;
  const pu=parseFloat(document.getElementById('fv-priceunit').value)||0;
  const uw=parseFloat(document.getElementById('fv-unit').value)||0;
  const prev=document.getElementById('fv-pricePreview');
  const parts=[];
  if(pkg>0) parts.push(`<span style="color:var(--prim);font-weight:700">${pkg.toFixed(2)} €</span>/kg`);
  if(pkg>0) parts.push(`<span style="color:var(--prim);font-weight:700">${n1(pkg/10).toFixed(2)} €</span>/100g`);
  if(pu>0&&uw>0) parts.push(`<span style="color:var(--prim);font-weight:700">${pu.toFixed(2)} €</span>/unité (${uw}g)`);
  if(parts.length){prev.style.display='block';prev.innerHTML=parts.join(' · ');}
  else prev.style.display='none';
}

  const rec={id:_editRecipeId||uid(),name,image:document.getElementById('rv-img').value.trim(),portions:parseInt(document.getElementById('rv-portions').value)||1,note:document.getElementById('rv-note').value.trim(),ingredients:_rvIngs};
  const arr=_editRecipeType==='smoothie'?_d.smoothies:_d.recipes;
  if(_editRecipeId){const i=arr.findIndex(x=>x.id===_editRecipeId);if(i>=0)arr[i]=rec;}else arr.push(rec);
  save(); document.getElementById('recipeOv').style.display='none';
  if(_editRecipeType==='smoothie')renderSmoothies();else renderRecipes();
});
document.getElementById('rv-del').addEventListener('click',()=>{
  if(!_editRecipeId)return;
  const arr=_editRecipeType==='smoothie'?_d.smoothies:_d.recipes;
  if(_editRecipeType==='smoothie')_d.smoothies=arr.filter(x=>x.id!==_editRecipeId);
  else _d.recipes=arr.filter(x=>x.id!==_editRecipeId);
  save(); document.getElementById('recipeOv').style.display='none';
  if(_editRecipeType==='smoothie')renderSmoothies();else renderRecipes();
});
document.getElementById('rv-cancel').addEventListener('click',()=>document.getElementById('recipeOv').style.display='none');
document.getElementById('recipeOvClose').addEventListener('click',()=>document.getElementById('recipeOv').style.display='none');
document.getElementById('addRecipeBtn').addEventListener('click',()=>openRecipeModal(null,false));
document.getElementById('addSmoothieBtn').addEventListener('click',()=>openRecipeModal(null,true));

// ══ OBJECTIFS ══
document.getElementById('goalsBtn').addEventListener('click',()=>{
  ['cal','prot','carb','fat'].forEach(k=>document.getElementById('go-'+k).value=_d.goals[k]);
  document.getElementById('goalsOv').style.display='flex';
});
document.getElementById('go-save').addEventListener('click',()=>{
  ['cal','prot','carb','fat'].forEach(k=>_d.goals[k]=parseFloat(document.getElementById('go-'+k).value)||_d.goals[k]);
  save(); document.getElementById('goalsOv').style.display='none'; renderMacroRings();
});
document.getElementById('go-cancel').addEventListener('click',()=>document.getElementById('goalsOv').style.display='none');

// ══ COPIER JOUR ══
function openCopy(fromDate){
  const t=new Date();t.setDate(t.getDate()+1);
  document.getElementById('cp-date').value=addDaysTo(todayISO(),1);
  document.getElementById('copyOv').dataset.from=fromDate;
  document.getElementById('copyOv').style.display='flex';
}
document.getElementById('copyDayBtn').addEventListener('click',()=>openCopy(_cur));
document.getElementById('cp-confirm').addEventListener('click',()=>{
  const target=document.getElementById('cp-date').value;
  const from=document.getElementById('copyOv').dataset.from;
  if(!target||!from)return;
  const src=JSON.parse(JSON.stringify(_d.logs[from]||[])).map(e=>({...e,id:uid()}));
  _d.logs[target]=_d.logs[target]?[..._d.logs[target],...src]:src;
  save(); document.getElementById('copyOv').style.display='none';
  setDate(target); switchTab('repas');
});
document.getElementById('cp-cancel').addEventListener('click',()=>document.getElementById('copyOv').style.display='none');

// ══ FERMETURE MODALES ══
['foodOv','recipeOv','addToMealOv','goalsOv','copyOv'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target===document.getElementById(id))document.getElementById(id).style.display='none';});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')['foodOv','recipeOv','addToMealOv','goalsOv','copyOv'].forEach(id=>{const el=document.getElementById(id);if(el.style.display==='flex')el.style.display='none';});});

// ══ EXPORT / IMPORT ══
function downloadJSON(data, filename){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}
function exportNutrition(){
  downloadJSON(_d, `nutrition-${new Date().toISOString().split('T')[0]}.json`);
}
function importNutrition(file){
  const reader=new FileReader();
  reader.onload=e=>{
    let data;
    try{ data=JSON.parse(e.target.result); }
    catch{ alert('Erreur : fichier JSON invalide'); return; }
    if(!data||typeof data!=='object'||Array.isArray(data)||!data.goals){
      alert('Erreur : ce fichier ne ressemble pas à un export nutrition valide');
      return;
    }
    if(!confirm('Cela va REMPLACER toutes les données nutrition actuelles (objectifs, aliments, recettes, smoothies, historique de repas) par le contenu du fichier importé. Continuer ?')) return;
    _d=data;
    save();
    location.reload();
  };
  reader.readAsText(file);
}
document.getElementById('nutriExportBtn').addEventListener('click',exportNutrition);
document.getElementById('nutriImportBtn').addEventListener('click',()=>document.getElementById('nutriImportFile').click());
document.getElementById('nutriImportFile').addEventListener('change',function(){
  if(this.files[0]) importNutrition(this.files[0]);
  this.value='';
});

// ══ THÈME ══
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

// ══ INIT ══
(async function init(){
  applyTheme(localStorage.getItem('muscle-xml-theme')||'light');
  load(); loadNotes(); loadSessions();
  await GymDB.init();
  try{const d=await GymDB.read('nutrition.json');if(d?.goals){_d=d;localStorage.setItem(NK,JSON.stringify(d));}}catch{}
  _cur=todayISO();
  document.getElementById('dateLbl').textContent=fmtD(_cur);
  document.getElementById('nextDay').disabled=true;
  renderDash();
})();
</script>
