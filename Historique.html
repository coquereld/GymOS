// VUE ANNUELLE
// ══════════════════════════════════════════════════════════════
let _annualYear = new Date().getFullYear();

function renderAnnual(){
  const main=document.getElementById('mainArea'); main.innerHTML='';
  const byDate=buildSessionsByDate();
  const todayStr=new Date().toISOString().split('T')[0];

  const outer=document.createElement('div'); outer.className='annual-outer';

  // Navigation année
  const nav=document.createElement('div'); nav.className='annual-nav';
  const prevBtn=document.createElement('button'); prevBtn.className='annual-nav-btn';
  prevBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>';
  prevBtn.addEventListener('click',()=>{ _annualYear--; renderAnnual(); });
  const label=document.createElement('div'); label.className='annual-year-label'; label.textContent=_annualYear;
  const nextBtn=document.createElement('button'); nextBtn.className='annual-nav-btn';
  nextBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>';
  nextBtn.addEventListener('click',()=>{ _annualYear++; renderAnnual(); });
  nav.append(prevBtn,label,nextBtn); outer.appendChild(nav);

  const grid=document.createElement('div'); grid.className='annual-grid';

  for(let mo=0;mo<12;mo++){
    const mColor=ANNUAL_COLORS[mo];
    const daysInMonth=new Date(_annualYear,mo+1,0).getDate();
    const col=document.createElement('div'); col.className='annual-month-col';
    col.style.borderColor=mColor+'55';
    const hdr=document.createElement('div'); hdr.className='annual-month-hdr';
    hdr.style.cssText=`background:${mColor};cursor:pointer;user-select:none;transition:filter .15s`;
    hdr.addEventListener('mouseenter',()=>hdr.style.filter='brightness(1.15)');
    hdr.addEventListener('mouseleave',()=>hdr.style.filter='');
    hdr.title=`Ouvrir ${MONTH_NAMES_FR[mo]}`;
    hdr.addEventListener('click',()=>renderMonthZoom(_annualYear,mo)); hdr.textContent=MONTH_NAMES_FR[mo].slice(0,4).toUpperCase();
    col.appendChild(hdr);

    for(let day=1;day<=daysInMonth;day++){
      const dateStr=`${_annualYear}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const d=new Date(dateStr+'T00:00');
      const dowStr=DOW_FR2[d.getDay()];
      const sessions=byDate[dateStr]||[];
      const isToday=dateStr===todayStr;

      const row=document.createElement('div');
      const dow2=d.getDay();
      const isWE=(dow2===0||dow2===6);
      const hol=getHoliday(dateStr);
      row.className='annual-day-row'+(sessions.length?' has-session':'')+(isToday?' today':'')+(isWE?' weekend':'')+(dow2===0?' week-end-sep':'')+(hol?' holiday':'');
      if(sessions.length){
        const [r,g,b]=hexRgb(mColor);
        row.style.background=`rgba(${r},${g},${b},.15)`;
      }

      const numEl=document.createElement('span'); numEl.className='annual-day-num'; numEl.textContent=day;
      const dowEl=document.createElement('span'); dowEl.className='annual-day-dow'; dowEl.textContent=DOW_FR2[d.getDay()];
      // Numéro de semaine sur les lundis
      if(d.getDay()===1){ row.appendChild(wkBadge(dateStr)); }
      row.append(numEl,dowEl);
      if(hol){ const he=document.createElement('span'); he.style.cssText='font-size:.55rem;flex-shrink:0;line-height:1;cursor:default'; he.textContent=hol.e; he.title=hol.n; row.appendChild(he); }

      if(sessions.length){
        const musWrap=document.createElement('div'); musWrap.className='annual-mus-wrap';
        const muscles=new Set(sessions.flatMap(h=>getSessionMuscles(h)));
        [...muscles].slice(0,3).forEach(m=>{
          const src=MUSCLE_IMG[m]; if(!src) return;
          const img=document.createElement('img'); img.className='annual-mus-icon';
          img.src=src; img.alt=m; img.onerror=()=>img.remove();
          musWrap.appendChild(img);
        });
        row.appendChild(musWrap);
        row.addEventListener('click',()=>renderMonthZoom(_annualYear,mo));
      }
      // Notes dans la vue annuelle (dots visibles avec tooltip)
      const annNotes=(_agendaNotes[dateStr]||[]);
      if(annNotes.length){
        const nw=document.createElement('div'); nw.style.cssText='display:flex;gap:2px;flex-wrap:wrap;align-items:center';
        annNotes.forEach(n=>nw.appendChild(makeNoteEl(n,'dot')));
        row.appendChild(nw);
      }
      col.appendChild(row);
    }
    grid.appendChild(col);
  }
  outer.appendChild(grid);
  main.appendChild(outer);
}

// ══════════════════════════════════════════════════════════════
// VUE MOIS ZOOMÉ (3 panneaux)
// ══════════════════════════════════════════════════════════════
function renderMonthZoom(year, month) {
  const main = document.getElementById('mainArea');
  main.innerHTML = '';
  const byDate = buildSessionsByDate();
  const todayStr = new Date().toISOString().split('T')[0];
  const mColor = ANNUAL_COLORS[month];
  const [mr,mg,mb] = hexRgb(mColor);
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // Conteneur 3 colonnes
  const root = document.createElement('div');
  root.style.cssText = 'display:grid;grid-template-columns:240px 1fr;height:100%;overflow:hidden';

  // ── Colonne gauche : calendrier du mois ──
  const leftWrap = document.createElement('div');
  leftWrap.style.cssText = 'display:flex;flex-direction:column;border-right:1px solid var(--bord);overflow:hidden;height:100%';

  // Header mois
  const leftHdr = document.createElement('div');
  leftHdr.style.cssText = `display:flex;align-items:center;gap:.5rem;padding:.6rem .75rem;background:${mColor};color:#fff;flex-shrink:0`;
  const backBtn = document.createElement('button');
  backBtn.style.cssText = 'background:rgba(255,255,255,.2);border:none;border-radius:.4rem;cursor:pointer;padding:.2rem .5rem;color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:.25rem;flex-shrink:0';
  backBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> Annuel`;
  backBtn.addEventListener('click', () => { _annualYear = year; switchView('annual'); });
  const monthLabel = document.createElement('div');
  monthLabel.style.cssText = 'font-weight:800;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;flex:1;text-align:center';
  monthLabel.textContent = `${MONTH_NAMES_FR[month]} ${year}`;
  leftHdr.append(backBtn, monthLabel);
  leftWrap.appendChild(leftHdr);

  // Jours du mois
  const daysCol = document.createElement('div');
  daysCol.style.cssText = 'overflow-y:auto;flex:1';
  let activeDay = null;

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const d = new Date(dateStr+'T00:00');
    const dow = d.getDay();
    const isWeekend = dow===0||dow===6;
    const isToday = dateStr===todayStr;
    const hol = getHoliday(dateStr);
    const sessions = byDate[dateStr]||[];
    const notes = (_agendaNotes[dateStr]||[]);

    // Séparateur de semaine avant chaque lundi
    if(dow===1){
      const sep=document.createElement('div');
      sep.style.cssText='display:flex;align-items:center;gap:.3rem;padding:.12rem .6rem;background:color-mix(in oklab,var(--prim) 5%,var(--surf));border-top:1px solid color-mix(in oklab,var(--prim) 18%,var(--bord))';
      sep.innerHTML=`<span style="font-size:.6rem;font-weight:800;color:var(--prim);flex-shrink:0">S${getISOWeek(dateStr)}</span><span style="flex:1;height:1px;background:color-mix(in oklab,var(--prim) 15%,var(--bord))"></span>`;
      daysCol.appendChild(sep);
    }

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:.35rem;padding:.28rem .65rem;border-bottom:1px solid var(--bord);min-height:32px;cursor:default;transition:background .12s'+(dow===0?';border-bottom:2px solid var(--bord)':'');
    if (isWeekend) row.style.background = 'rgba(0,0,0,.025)';
    if (sessions.length) { row.style.cursor='pointer'; row.style.background=`rgba(${mr},${mg},${mb},.08)`; }
    if (isToday) row.style.outline = `2px solid ${mColor}`;

    const numEl = document.createElement('span');
    numEl.style.cssText = `font-size:.72rem;font-weight:800;color:${(hol||isToday)?mColor:'var(--txm)'};width:18px;text-align:right;flex-shrink:0`;
    numEl.textContent = day;
    const dowEl = document.createElement('span');
    dowEl.style.cssText = `font-size:.6rem;font-weight:700;color:${isWeekend?mColor:'var(--txf)'};width:20px;flex-shrink:0`;
    dowEl.textContent = DOW_FR2[dow];
    row.append(numEl, dowEl);

    if (hol) {
      const he = document.createElement('span'); he.textContent = hol.e; he.title = hol.n; he.style.cssText='font-size:.68rem;flex-shrink:0';
      row.appendChild(he);
    }

    // Icônes muscles des séances
    const sesWrap = document.createElement('div'); sesWrap.style.cssText='display:flex;gap:1px;align-items:center;flex:1;flex-wrap:wrap;min-width:0';
    sessions.forEach(h => {
      const muscles = getSessionMuscles(h);
      muscles.slice(0,4).forEach(m => {
        const src = MUSCLE_IMG[m]; if (!src) return;
        const img = document.createElement('img'); img.src = src; img.alt = m;
        img.style.cssText = 'width:18px;height:18px;object-fit:contain'; img.onerror=()=>img.remove();
        sesWrap.appendChild(img);
      });
    });
    row.appendChild(sesWrap);

    // Notes — pills cliquables avec icône et texte
    notes.forEach(note => {
      const pill = document.createElement('div');
      pill.style.cssText=`display:inline-flex;align-items:center;gap:3px;padding:.15rem .4rem .15rem .3rem;border-radius:.4rem;background:${note.color};cursor:pointer;max-width:140px;flex-shrink:0;border:1px solid rgba(255,255,255,.25)`;
      pill.title=`Modifier la note : "${note.text}"`;
      const icon=document.createElement('span'); icon.textContent='📝'; icon.style.cssText='font-size:.7rem;flex-shrink:0;line-height:1';
      const txt=document.createElement('span'); txt.textContent=note.text; txt.style.cssText='font-size:.62rem;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px;flex:1';
      const del=document.createElement('button'); del.textContent='×'; del.title='Supprimer';
      del.style.cssText='background:rgba(255,255,255,.3);border:none;border-radius:50%;width:14px;height:14px;cursor:pointer;color:#fff;font-size:.65rem;line-height:1;display:grid;place-items:center;padding:0;flex-shrink:0;font-weight:700';
      del.addEventListener('mouseenter',()=>del.style.background='rgba(255,255,255,.55)');
      del.addEventListener('mouseleave',()=>del.style.background='rgba(255,255,255,.3)');
      del.addEventListener('click',ev=>{
        ev.stopPropagation();
        // Supprimer directement sans passer par la modale
        _agendaNotes[dateStr]=(_agendaNotes[dateStr]||[]).filter(n=>n.id!==note.id);
        saveNotes(); renderMonthZoom(year,month);
      });
      pill.append(icon,txt,del);
      pill.addEventListener('click',ev=>{
        ev.stopPropagation();
        openNoteModal(dateStr, note.id, ()=>renderMonthZoom(year,month));
      });
      row.appendChild(pill);
    });

    // Bouton + note (visible au survol)
    const addBtn = document.createElement('button');
    addBtn.style.cssText='opacity:0;min-width:22px;height:22px;border-radius:.35rem;border:1px dashed var(--bord);background:rgba(255,255,255,.6);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--txm);font-size:.72rem;line-height:1;padding:0 3px;flex-shrink:0;transition:opacity .15s;gap:2px;font-weight:700';
    addBtn.innerHTML='<span style="font-size:.7rem">📝</span> +'; addBtn.title='Ajouter une note';
    addBtn.addEventListener('click',ev=>{
      ev.stopPropagation();
      openNoteModal(dateStr, null, ()=>renderMonthZoom(year, month));
    });
    row.addEventListener('mouseenter',()=>addBtn.style.opacity='1');
    row.addEventListener('mouseleave',()=>addBtn.style.opacity='0');
    row.appendChild(addBtn);

    if (sessions.length) {
      row.addEventListener('click', () => {
        daysCol.querySelectorAll('[data-active]').forEach(el=>{ el.removeAttribute('data-active'); el.style.borderLeft=''; });
        row.setAttribute('data-active','1'); row.style.borderLeft=`3px solid ${mColor}`;
        activeDay = dateStr;
        showZoomSession(sessions[0].id, midPanel, rightPanel, mColor);
      });
    }
    daysCol.appendChild(row);
  }
  leftWrap.appendChild(daysCol);

  // ── Colonne droite : split milieu + droite ──
  const rightSplit = document.createElement('div');
  rightSplit.style.cssText = 'display:grid;grid-template-columns:1fr 380px;height:100%;overflow:hidden';
  const midPanel = document.createElement('div');
  midPanel.style.cssText = 'overflow-y:auto;border-right:1px solid var(--bord);background:var(--bg)';
  midPanel.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--txf);font-size:.82rem;text-align:center;padding:2rem">Cliquez sur un jour avec une séance</div>`;
  const rightPanel = document.createElement('div');
  rightPanel.style.cssText = 'overflow-y:auto;background:var(--surf)';
  rightPanel.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--txf);font-size:.8rem;text-align:center;padding:2rem">Cliquez sur un exercice<br>pour voir sa fiche</div>`;

  rightSplit.append(midPanel, rightPanel);
  root.append(leftWrap, rightSplit);
  main.appendChild(root);

  // Si une seule séance ce mois, l'ouvrir automatiquement
  const allSessions = Object.entries(byDate)
    .filter(([d])=>d.startsWith(`${year}-${String(month+1).padStart(2,'0')}-`))
    .flatMap(([,ss])=>ss);
  if (allSessions.length === 1) {
    setTimeout(()=> showZoomSession(allSessions[0].id, midPanel, rightPanel, mColor), 50);
  }
}

function showZoomSession(hId, midPanel, rightPanel, mColor) {
  const h = _hist.find(x=>x.id===hId); if (!h) return;
  const hex = TC[h.seanceType]||'#9a9891';
  const [r,g,b] = hexRgb(hex);
  midPanel.innerHTML = '';
  const wrap = document.createElement('div'); wrap.style.cssText='padding:.85rem 1rem;display:flex;flex-direction:column;gap:.75rem;max-width:700px;margin:0 auto';

  // Header séance
  const hdrCard = document.createElement('div');
  hdrCard.style.cssText=`background:rgba(${r},${g},${b},.06);border:1px solid rgba(${r},${g},${b},.2);border-radius:var(--rxl);overflow:hidden`;
  const hdrRow = document.createElement('div'); hdrRow.style.cssText='display:flex;align-items:center;gap:.65rem;padding:.85rem 1rem;flex-wrap:wrap';
  const badge=document.createElement('span'); badge.style.cssText=`font-size:.65rem;font-weight:800;padding:.25rem .65rem;border-radius:999px;background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.35)`;
  badge.textContent=h.seanceType||'Libre';
  const nameDiv=document.createElement('div'); nameDiv.style.flex='1;min-width:0';
  nameDiv.innerHTML=`<div style="font-weight:700;font-size:.95rem;color:${hex}">${esc(h.seanceNom||'Séance libre')}</div><div style="font-size:.7rem;color:var(--txm)">${esc(h.programmeNom||'')}${h.heure?' · '+h.heure:''}${h.heureF?' → '+h.heureF:''}</div>`;
  const dateDiv=document.createElement('div'); dateDiv.style.cssText='font-size:.72rem;color:var(--txm);text-align:right';
  dateDiv.innerHTML=`<div style="font-weight:600;color:var(--tx)">${fmtDate(h.date)}</div>`;
  hdrRow.append(badge,nameDiv,dateDiv);

  // Bouton éditer la séance
  const editSessionBtn=document.createElement('button');
  editSessionBtn.style.cssText='display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .75rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;margin-left:auto;flex-shrink:0;white-space:nowrap';
  editSessionBtn.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> Modifier la séance`;
  editSessionBtn.addEventListener('mouseenter',()=>editSessionBtn.style.background='var(--surfoff)');
  editSessionBtn.addEventListener('mouseleave',()=>editSessionBtn.style.background='var(--surf)');
  editSessionBtn.addEventListener('click',()=>{
    _selId=h.id; _editMode=true;
    switchView('list'); renderSidebar(); renderDetail();
  });
  hdrRow.appendChild(editSessionBtn);
  // Stats
  const nbS=(h.exercices||[]).reduce((n,e)=>n+(e.series?.length||0),0);
  const statsRow=document.createElement('div'); statsRow.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--bord)';
  [{v:fmtDur(h.dureeMin),l:'Durée'},{v:nbS,l:'Séries'},{v:h.volumeTotal>0?h.volumeTotal+'kg':'—',l:'Volume'}].forEach(({v,l},i)=>{
    const s=document.createElement('div'); s.style.cssText='padding:.5rem;text-align:center'+(i<2?';border-right:1px solid var(--bord)':'');
    s.innerHTML=`<div style="font-size:.95rem;font-weight:700;color:${hex}">${v}</div><div style="font-size:.58rem;text-transform:uppercase;letter-spacing:.05em;color:var(--txm)">${l}</div>`;
    statsRow.appendChild(s);
  });
  hdrCard.append(hdrRow,statsRow); wrap.appendChild(hdrCard);

  // Liste exercices
  if ((h.exercices||[]).length) {
    const exoTitle=document.createElement('div'); exoTitle.style.cssText='font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--txf)'; exoTitle.textContent='Exercices';
    wrap.appendChild(exoTitle);
    const exoCard=document.createElement('div'); exoCard.style.cssText='background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--shsm)';
    (h.exercices||[]).forEach((e,i)=>{
      const ehex=grpc(e.groupe);
      const muscles=getSessionMuscles({exercices:[e]});
      const nbEs=(e.series||[]).length;
      const maxP=Math.max(0,...(e.series||[]).map(s=>parseFloat(s.poids)||0));
      const exoImgSrc=getExoImg(e.nom);
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:.55rem;padding:.5rem .85rem;border-bottom:1px solid var(--bord);cursor:pointer;transition:background .12s';
      if(i===(h.exercices||[]).length-1) row.style.borderBottom='none';
      row.addEventListener('mouseenter',()=>row.style.background='var(--surfoff)');
      row.addEventListener('mouseleave',()=>row.style.background='');
      // Dot couleur groupe
      const dot=document.createElement('span'); dot.style.cssText=`width:8px;height:8px;border-radius:50%;background:${ehex};flex-shrink:0`;
      // Image muscle groupe
      const musImgsEl=document.createElement('div'); musImgsEl.style.cssText='display:flex;gap:2px;flex-shrink:0';
      muscles.slice(0,2).forEach(m=>{
        const src=MUSCLE_IMG[m]; if(!src) return;
        const img=document.createElement('img'); img.src=src; img.alt=m;
        img.style.cssText='width:26px;height:26px;object-fit:contain'; img.onerror=()=>img.remove();
        musImgsEl.appendChild(img);
      });
      // Image exercice
      const exoImgEl=document.createElement('div'); exoImgEl.style.cssText='flex-shrink:0';
      if(exoImgSrc){
        const exoImg=document.createElement('img'); exoImg.src='./img/'+exoImgSrc; exoImg.alt=e.nom;
        exoImg.style.cssText='width:38px;height:38px;object-fit:contain;border-radius:.4rem;background:var(--surfoff);border:1px solid var(--bord);padding:2px';
        exoImg.onerror=()=>exoImg.style.display='none';
        exoImgEl.appendChild(exoImg);
      }
      // Texte
      const infoEl=document.createElement('div'); infoEl.style.cssText='flex:1;min-width:0';
      infoEl.innerHTML=`<div style="font-size:.8rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.nom)}</div><div style="font-size:.65rem;color:var(--txm)">${esc(e.groupe||'')}</div>`;
      const statEl=document.createElement('div'); statEl.style.cssText='font-size:.7rem;color:var(--txm);text-align:right;flex-shrink:0';
      statEl.textContent=`${nbEs} sér.${maxP>0?' · '+maxP+'kg':''}`;
      // Flèche accordion
      const chevron=document.createElement('span'); chevron.style.cssText='color:var(--txm);flex-shrink:0;transition:transform .2s;font-size:.7rem;line-height:1'; chevron.textContent='▶';
      row.append(dot,musImgsEl,exoImgEl,infoEl,statEl,chevron);

      // Panneau accordéon séries
      const seriesPanel=document.createElement('div');
      seriesPanel.style.cssText='display:none;border-top:1px solid var(--bord);background:var(--surfoff);padding:.5rem .85rem;overflow:hidden';
      let panelOpen=false;

      function buildSeriesPanel(){
        seriesPanel.innerHTML='';
        const done=(e.series||[]).filter(s=>s.reps||s.poids||s.duree||s.distance||s.ressenti);
        if(!done.length){ const p=document.createElement('div'); p.style.cssText='font-size:.72rem;color:var(--txf);font-style:italic;padding:.25rem 0'; p.textContent='Aucune série enregistrée.'; seriesPanel.appendChild(p); return; }
        // Colonnes dynamiques
        const hasDuree=true;  // toujours affiché
        const hasDist=true;   // toujours affiché
        const tbl=document.createElement('table'); tbl.style.cssText='width:100%;border-collapse:collapse;font-size:.72rem';
        let thHtml='<thead><tr style="border-bottom:1px solid var(--bord)"><th style="padding:.25rem .5rem;text-align:left;color:var(--txf);font-size:.6rem;font-weight:700;text-transform:uppercase">#</th><th style="padding:.25rem .5rem;text-align:center;color:var(--txf);font-size:.6rem;font-weight:700;text-transform:uppercase">Reps</th><th style="padding:.25rem .5rem;text-align:center;color:var(--txf);font-size:.6rem;font-weight:700;text-transform:uppercase">Kg</th>';
        if(hasDuree) thHtml+='<th style="padding:.25rem .5rem;text-align:center;color:var(--txf);font-size:.6rem;font-weight:700;text-transform:uppercase">Durée</th>';
        if(hasDist)  thHtml+='<th style="padding:.25rem .5rem;text-align:center;color:var(--txf);font-size:.6rem;font-weight:700;text-transform:uppercase">Distance</th>';
        thHtml+='<th style="padding:.25rem .5rem;text-align:left;color:var(--txf);font-size:.6rem;font-weight:700;text-transform:uppercase">Ressenti</th></tr></thead>';
        tbl.innerHTML=thHtml;
        const tbody=document.createElement('tbody');
        done.forEach((s,si)=>{
          const ress=RESSENTI.find(x=>x.key===s.ressenti);
          const resHtml=ress?`<span style="display:inline-flex;align-items:center;gap:.2rem;padding:.1rem .4rem;border-radius:999px;font-size:.65rem;font-weight:700;background:${ress.bg};color:${ress.color}">${ress.emoji} ${ress.label}</span>`:'<span style="color:var(--txf)">—</span>';
          const tr=document.createElement('tr'); tr.style.cssText='border-bottom:1px solid var(--bord)';
          let tdHtml=`<td style="padding:.28rem .5rem;color:var(--txm)">${si+1}</td><td style="padding:.28rem .5rem;text-align:center">${s.reps||'—'}</td><td style="padding:.28rem .5rem;text-align:center">${s.poids?s.poids+' kg':'—'}</td>`;
          if(hasDuree) tdHtml+=`<td style="padding:.28rem .5rem;text-align:center">${s.duree||'—'}</td>`;
          if(hasDist)  tdHtml+=`<td style="padding:.28rem .5rem;text-align:center">${s.distance||'—'}</td>`;
          tdHtml+=`<td style="padding:.28rem .5rem">${resHtml}</td>`;
          tr.innerHTML=tdHtml; tbody.appendChild(tr);
        });
        tbody.lastChild.style.borderBottom='none';
        tbl.appendChild(tbody); seriesPanel.appendChild(tbl);
      }

      function togglePanel(){
        panelOpen=!panelOpen;
        if(panelOpen){ buildSeriesPanel(); seriesPanel.style.display='block'; chevron.style.transform='rotate(90deg)'; }
        else { seriesPanel.style.display='none'; chevron.style.transform=''; }
      }

      // Clic exercice → accordion + panneau droit
      row.addEventListener('click',()=>{
        // Fermer les autres accordéons
        exoCard.querySelectorAll('[data-exo-active]').forEach(el=>{
          el.removeAttribute('data-exo-active'); el.style.borderLeft='';
          const nextSib=el.nextElementSibling;
          if(nextSib&&nextSib.dataset.seriesPanel){ nextSib.style.display='none'; el.querySelector('span[data-chevron]')&&(el.querySelector('span[data-chevron]').style.transform=''); }
        });
        panelOpen=false; // reset pour le toggle qui suit
        row.setAttribute('data-exo-active','1'); row.style.borderLeft=`3px solid ${ehex}`;
        togglePanel();
        showZoomExoInfo(e.nom, rightPanel);
      });

      chevron.dataset.chevron='1';
      exoCard.appendChild(row);
      seriesPanel.dataset.seriesPanel='1';
      exoCard.appendChild(seriesPanel);
    });
    wrap.appendChild(exoCard);
  }

  // Note globale
  if (h.noteGlobale) {
    const noteEl=document.createElement('div'); noteEl.style.cssText='background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:.75rem 1rem;font-size:.78rem;color:var(--txm);font-style:italic;line-height:1.6';
    noteEl.textContent=h.noteGlobale; wrap.appendChild(noteEl);
  }
  midPanel.appendChild(wrap);
}

function showZoomExoInfo(nom, rightPanel) {
  const exo = _exoLib.find(e=>e.exercice?.toLowerCase()===nom?.toLowerCase())||{exercice:nom};
  const hex = MC[(exo.groupe_musculaire||'').split(',')[0].trim()]||'#01696f';
  const [r,g,b] = hexRgb(hex);
  rightPanel.innerHTML = '';
  const wrap = document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;height:100%';

  // Header
  const hdr=document.createElement('div'); hdr.style.cssText=`padding:.75rem 1rem;background:rgba(${r},${g},${b},.08);border-bottom:1px solid rgba(${r},${g},${b},.2);display:flex;align-items:center;gap:.6rem;flex-shrink:0`;
  const badge=document.createElement('span'); badge.style.cssText=`font-size:.62rem;font-weight:800;padding:.2rem .55rem;border-radius:999px;background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.3)`;
  badge.textContent=exo.groupe_musculaire||'—';
  const nameCol=document.createElement('div'); nameCol.style.cssText='flex:1;min-width:0';
  nameCol.innerHTML=`<div style="font-weight:700;font-size:.9rem;color:${hex};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(exo.exercice||'—')}</div><div style="font-size:.68rem;color:var(--txm);margin-top:.1rem">${esc([exo.muscle,exo.subdivision&&exo.subdivision!=='—'?exo.subdivision:''].filter(Boolean).join(' · '))}</div>`;
  const closeBtn=document.createElement('button'); closeBtn.style.cssText='width:28px;height:28px;border-radius:50%;border:1px solid var(--bord);background:var(--surf);cursor:pointer;display:grid;place-items:center;color:var(--txm);padding:0;flex-shrink:0';
  closeBtn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  closeBtn.addEventListener('click',()=>{ rightPanel.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--txf);font-size:.8rem;text-align:center;padding:2rem">Cliquez sur un exercice<br>pour voir sa fiche</div>`; });
  hdr.append(badge,nameCol,closeBtn); wrap.appendChild(hdr);

  // Body scrollable
  const body=document.createElement('div'); body.style.cssText='overflow-y:auto;flex:1;padding:.85rem 1rem;display:flex;flex-direction:column;gap:.75rem';

  // Image
  if (exo.image) {
    const imgWrap=document.createElement('div'); imgWrap.style.cssText='display:flex;justify-content:center;background:var(--surfoff);border-radius:var(--rlg);padding:.75rem;border:1px solid var(--bord)';
    const img=document.createElement('img'); img.src='./img/'+exo.image; img.alt=exo.exercice;
    img.style.cssText='max-width:100%;max-height:200px;object-fit:contain;border-radius:.5rem';
    img.onerror=()=>imgWrap.style.display='none';
    imgWrap.appendChild(img); body.appendChild(imgWrap);
  }

  // Tags
  const tags=[exo.equipement,exo.type_exercice].filter(Boolean);
  if(tags.length){
    const tagRow=document.createElement('div'); tagRow.style.cssText='display:flex;gap:.35rem;flex-wrap:wrap';
    tags.forEach(t=>{ const s=document.createElement('span'); s.style.cssText='padding:.2rem .55rem;border-radius:999px;font-size:.65rem;font-weight:600;background:var(--surfoff);color:var(--txm);border:1px solid var(--bord)'; s.textContent=t; tagRow.appendChild(s); });
    body.appendChild(tagRow);
  }

  // Sections texte
  [{lbl:'Muscles secondaires',val:exo.muscle_secondaire},{lbl:'Descriptif',val:exo.descriptif},{lbl:'Exécution',val:exo.execution}].forEach(({lbl,val})=>{
    if(!val) return;
    const sec=document.createElement('div'); sec.style.cssText='display:flex;flex-direction:column;gap:.3rem';
    const t=document.createElement('div'); t.style.cssText=`font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:${hex};padding-bottom:.2rem;border-bottom:1px solid rgba(${r},${g},${b},.2)`;t.textContent=lbl;
    const tx=document.createElement('div'); tx.style.cssText='font-size:.78rem;line-height:1.6;color:var(--tx);white-space:pre-wrap';tx.textContent=val;
    sec.append(t,tx); body.appendChild(sec);
  });
  if(!body.children.length||body.children.length<2){
    const ph=document.createElement('div'); ph.style.cssText='color:var(--txf);font-size:.78rem;font-style:italic'; ph.textContent='Aucune information renseignée.'; body.appendChild(ph);
  }

  wrap.appendChild(body);
  rightPanel.appendChild(wrap);
}

// ══════════════════════════════════════════════════════════════
// HELPER NOTE DISPLAY (adaptatif selon l'espace dispo)
// ══════════════════════════════════════════════════════════════
function makeNoteEl(note, mode) {
  // mode: 'dot'=5px point | 'icon'=📝 seul | 'pill'=📝 + texte
  if (mode==='dot'){
    const nd=document.createElement('span');
    nd.style.cssText=`width:7px;height:7px;border-radius:50%;background:${note.color};border:1px solid rgba(0,0,0,.15);flex-shrink:0;cursor:default`;
    nd.title=`📝 ${note.text}`; return nd;
  }
  if (mode==='icon'){
    const ic=document.createElement('span');
    ic.style.cssText=`display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:.25rem;background:${note.color};flex-shrink:0;font-size:.6rem;line-height:1;cursor:default`;
    ic.textContent='📝'; ic.title=note.text; return ic;
  }
  // 'pill'
  const p=document.createElement('span');
  p.style.cssText=`display:inline-flex;align-items:center;gap:2px;padding:.1rem .35rem;border-radius:.3rem;background:${note.color};flex-shrink:0;cursor:pointer;max-width:110px;border:1px solid rgba(255,255,255,.2)`;
  p.title=note.text;
  const ico=document.createElement('span'); ico.textContent='📝'; ico.style.cssText='font-size:.6rem;flex-shrink:0;line-height:1';
  const tx=document.createElement('span'); tx.textContent=note.text; tx.style.cssText='font-size:.6rem;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  p.append(ico,tx); return p;
}

// ══════════════════════════════════════════════════════════════
// HELPER RENDU MULTI-MOIS (partagé par 3 et 6 mois)
// ══════════════════════════════════════════════════════════════
function renderNMonths(n, startYear, startMonth, onPrev, onNext) {
  const main=document.getElementById('mainArea'); main.innerHTML='';
  const byDate=buildSessionsByDate();
  const todayStr=new Date().toISOString().split('T')[0];
  const noteMode = n<=3 ? 'pill' : 'icon'; // 3 mois → pill, 6 mois → icon
  const rowMinH = n<=3 ? 40 : 34; // hauteur min par jour
  const maxIcons = n<=3 ? 5 : 3;   // icônes muscles max

  const outer=document.createElement('div'); outer.style.cssText='overflow:auto;padding:.75rem;height:100%;box-sizing:border-box';

  // Navigation
  const nav=document.createElement('div'); nav.style.cssText='display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:.75rem';
  const prevBtn=document.createElement('button'); prevBtn.className='annual-nav-btn';
  prevBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>';
  prevBtn.addEventListener('click',onPrev);
  const endM={y:startYear,m:startMonth+n-1}; while(endM.m>11){endM.m-=12;endM.y++;}
  const label=document.createElement('div'); label.style.cssText='font-size:.95rem;font-weight:700;min-width:280px;text-align:center';
  label.textContent=`${MONTH_NAMES_FR[startMonth]} ${startYear} — ${MONTH_NAMES_FR[endM.m]} ${endM.y}`;
  const nextBtn=document.createElement('button'); nextBtn.className='annual-nav-btn';
  nextBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>';
  nextBtn.addEventListener('click',onNext);
  nav.append(prevBtn,label,nextBtn); outer.appendChild(nav);

  // Grille N colonnes (1 seule ligne)
  const grid=document.createElement('div'); grid.style.cssText=`display:grid;grid-template-columns:repeat(${n},1fr);gap:.6rem;min-width:${n<=3?600:900}px`;

  for(let i=0;i<n;i++){
    let mo=startMonth+i, yr=startYear;
    while(mo>11){mo-=12;yr++;} while(mo<0){mo+=12;yr--;}
    const mColor=ANNUAL_COLORS[mo];
    const [mr,mg,mb]=hexRgb(mColor);
    const daysInMonth=new Date(yr,mo+1,0).getDate();
    const col=document.createElement('div'); col.style.cssText=`border-radius:var(--rlg);overflow:hidden;border:2px solid ${mColor}`;

    // En-tête mois cliquable
    const hdr=document.createElement('div'); hdr.style.cssText=`background:${mColor};font-weight:800;font-size:.8rem;text-align:center;padding:.55rem .3rem;text-transform:uppercase;letter-spacing:.05em;color:#fff;cursor:pointer;transition:filter .15s`;
    hdr.textContent=`${MONTH_NAMES_FR[mo]} ${yr}`;
    hdr.addEventListener('mouseenter',()=>hdr.style.filter='brightness(1.12)');
    hdr.addEventListener('mouseleave',()=>hdr.style.filter='');
    hdr.addEventListener('click',()=>renderMonthZoom(yr,mo));
    col.appendChild(hdr);

    for(let day=1;day<=daysInMonth;day++){
      const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const d=new Date(dateStr+'T00:00');
      const dow=d.getDay();
      const isWeekend=dow===0||dow===6;
      const isToday=dateStr===todayStr;
      const hol=getHoliday(dateStr);
      const sessions=byDate[dateStr]||[];
      const dayNotes=(_agendaNotes[dateStr]||[]);

      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:3px;padding:.25rem .5rem;border-bottom:1px solid var(--bord);min-height:'+rowMinH+'px;font-size:.65rem;transition:background .12s;flex-wrap:nowrap'+(dow===0?';border-bottom:2px solid var(--bord)':'');
      if(isWeekend) row.style.background='rgba(0,0,0,.025)';
      if(sessions.length){row.style.cursor='pointer';row.style.background=`rgba(${mr},${mg},${mb},.1)`;}
      if(isToday) row.style.outline=`2px solid ${mColor}`;

      const numEl=document.createElement('span'); numEl.style.cssText=`width:16px;text-align:right;font-weight:800;color:${hol?mColor:'var(--txm)'};flex-shrink:0`; numEl.textContent=day;
      const dowEl=document.createElement('span'); dowEl.style.cssText=`width:20px;font-weight:700;color:${isWeekend?mColor:'var(--txf)'};flex-shrink:0`; dowEl.textContent=DOW_FR2[dow];
      // Numéro de semaine sur les lundis
      if(dow===1){ row.appendChild(wkBadge(dateStr)); }
      row.append(numEl,dowEl);

      if(hol){ const he=document.createElement('span'); he.style.cssText='font-size:.65rem;flex-shrink:0'; he.textContent=hol.e; he.title=hol.n; row.appendChild(he); }

      if(sessions.length){
        const muscles=new Set(sessions.flatMap(h=>getSessionMuscles(h)));
        [...muscles].slice(0,maxIcons).forEach(m=>{
          const src=MUSCLE_IMG[m]; if(!src) return;
          const img=document.createElement('img'); img.style.cssText='width:'+(n<=3?18:15)+'px;height:'+(n<=3?18:15)+'px;object-fit:contain;flex-shrink:0';
          img.src=src; img.alt=m; img.onerror=()=>img.remove(); row.appendChild(img);
        });
        if(noteMode==='pill'){
          const sname=document.createElement('span'); sname.style.cssText='flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--tx);font-size:.62rem';
          sname.textContent=(sessions[0].seanceNom||'').slice(0,20); row.appendChild(sname);
        }
        row.addEventListener('click',()=>renderMonthZoom(yr,mo));
      } else {
        // Espace flexible pour les notes
        const spacer=document.createElement('span'); spacer.style.flex='1'; row.appendChild(spacer);
      }

      // Notes
      dayNotes.forEach(note=>{
        const el=makeNoteEl(note, noteMode);
        el.addEventListener('click',ev=>{ ev.stopPropagation(); openNoteModal(dateStr, note.id, n<=3?render3Months:render6Months); });
        row.appendChild(el);
      });

      // Bouton + note (visible au survol)
      const addNoteBtn=document.createElement('button');
      addNoteBtn.style.cssText='opacity:0;min-width:18px;height:18px;border-radius:.3rem;border:1px dashed var(--bord);background:rgba(255,255,255,.6);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--txm);font-size:.6rem;padding:0;flex-shrink:0;transition:opacity .15s;font-weight:700';
      addNoteBtn.innerHTML='📝<span style="font-size:.55rem">+</span>'; addNoteBtn.title='Ajouter une note';
      addNoteBtn.addEventListener('click',ev=>{
        ev.stopPropagation();
        openNoteModal(dateStr, null, n<=3?render3Months:render6Months);
      });
      row.addEventListener('mouseenter',()=>addNoteBtn.style.opacity='1');
      row.addEventListener('mouseleave',()=>addNoteBtn.style.opacity='0');
      row.appendChild(addNoteBtn);

      col.appendChild(row);
    }
    grid.appendChild(col);
  }
  outer.appendChild(grid);
  main.appendChild(outer);
}

// ── Vue 3 mois ──
let _3mY=new Date().getFullYear(), _3mM=Math.max(0,new Date().getMonth()-1);
function render3Months(){
  while(_3mM<0){_3mM+=12;_3mY--;} while(_3mM>11){_3mM-=12;_3mY++;}
  renderNMonths(3,_3mY,_3mM,()=>{_3mM-=3;render3Months();},()=>{_3mM+=3;render3Months();});
}

// ── Vue 6 mois ──
let _6mStartYear=new Date().getFullYear(), _6mStartMonth=Math.max(0,new Date().getMonth()-2);
function render6Months(){
  while(_6mStartMonth<0){_6mStartMonth+=12;_6mStartYear--;} while(_6mStartMonth>11){_6mStartMonth-=12;_6mStartYear++;}
  renderNMonths(6,_6mStartYear,_6mStartMonth,()=>{_6mStartMonth-=6;render6Months();},()=>{_6mStartMonth+=6;render6Months();});
}

// ══════════════════════════════════════════════════════════════
// UPDATE SWITCHVIEW + BUTTONS
// ══════════════════════════════════════════════════════════════
function switchView(v){
  _currentView = v;
  const btns={list:'viewListBtn', annual:'viewAnnualBtn', '3months':'view3mBtn', '6months':'view6mBtn'};
  Object.entries(btns).forEach(([view,id])=>{ const el=document.getElementById(id); if(el) el.classList.toggle('active',view===v); });
  if(v==='annual') renderAnnual();
  else if(v==='3months') render3Months();
  else if(v==='6months') render6Months();
  else renderDetail();
}

document.getElementById('viewListBtn').addEventListener('click',()=>switchView('list'));
document.getElementById('viewAnnualBtn').addEventListener('click',()=>switchView('annual'));
document.getElementById('view3mBtn').addEventListener('click',()=>switchView('3months'));
document.getElementById('view6mBtn').addEventListener('click',()=>switchView('6months'));

// Charger les notes après que Script 2 est défini
loadNotes();
</script>

  const PAGES=[
    {href:'index.html',     label:'Accueil',    emoji:'🏠', color:'#01696f'},
    {href:'Dashboard.html', label:'Dashboard',  emoji:'📊', color:'#01696f'},
    {href:'Corps.html',     label:'Corps',      emoji:'💪', color:'#b90207'},
    {href:'Exercices.html', label:'Exercices',  emoji:'🏋', color:'#fa7b01'},
    {href:'Programme.html', label:'Programme',  emoji:'📋', color:'#8338bb'},
    {href:'Seance.html',    label:'Séance',     emoji:'⏱', color:'#437a22'},
    {href:'Historique.html',label:'Historique', emoji:'📅', color:'#0161be'},
    {href:'Progression.html',label:'Progression',emoji:'📈',color:'#5a9d24'},
    {href:'Nutrition.html', label:'Nutrition',  emoji:'🥗', color:'#964219'},
  ];
  const cur=(window.location.pathname.split('/').pop()||'index.html');
  const nav=document.getElementById('gymosNavItems');
  if(nav){
    PAGES.forEach(p=>{
      const isC=cur===p.href||(cur===''&&p.href==='index.html');
      const a=document.createElement('a');
      a.href=p.href;
      a.style.cssText=`display:flex;align-items:center;gap:.7rem;padding:.58rem .85rem;border-radius:.6rem;font-size:.82rem;font-weight:${isC?700:500};color:${isC?p.color:'var(--color-text,#28251d)'};background:${isC?p.color+'18':'transparent'};text-decoration:none;transition:background .12s,color .12s;border-left:3px solid ${isC?p.color:'transparent'}`;
      const em=document.createElement('span');em.textContent=p.emoji;em.style.cssText='font-size:1rem;width:22px;text-align:center;flex-shrink:0';
      const lb=document.createElement('span');lb.textContent=p.label;lb.style.flex='1';
      a.append(em,lb);
      if(isC){const d=document.createElement('span');d.style.cssText=`width:6px;height:6px;border-radius:50%;background:${p.color};flex-shrink:0`;a.appendChild(d);}
      a.addEventListener('mouseenter',()=>{if(!isC){a.style.background='var(--color-surface-offset,#f3f0ec)';}});
      a.addEventListener('mouseleave',()=>{if(!isC){a.style.background='transparent';}});
      nav.appendChild(a);
    });
  }
  function openNav(){document.getElementById('gymosNavPanel').style.display='flex';}
  function closeNav(){document.getElementById('gymosNavPanel').style.display='none';}
  // Remplacer le homeBtn pour ouvrir le nav panel
  const hb=document.getElementById('homeBtn');
  if(hb){
    const nb=hb.cloneNode(true);
    hb.parentNode.replaceChild(nb,hb);
    nb.id='homeBtn';
    nb.title='Navigation';
    nb.addEventListener('click',e=>{e.stopPropagation();openNav();});
  }
  document.getElementById('gymosNavClose').addEventListener('click',closeNav);
  document.getElementById('gymosNavBackdrop').addEventListener('click',closeNav);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});
})();
</script>
