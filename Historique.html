<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GymOS — Historique</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surf:#f9f8f5;--surf2:#fbfbf9;--surfoff:#f3f0ec;--bord:#d4d1ca;
  --tx:#28251d;--txm:#6e6b64;--txf:#9a9891;
  --prim:#01696f;--primh:#0c4e54;--primhi:#cedcd8;
  --ok:#437a22;--warn:#964219;--err:#a12c7b;
  --rsm:.375rem;--rmd:.5rem;--rlg:.75rem;--rxl:1rem;
  --shsm:0 1px 3px rgba(40,37,29,.08);--shmd:0 12px 32px rgba(40,37,29,.14);
  --tr:180ms cubic-bezier(.16,1,.3,1);--font:'Satoshi',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#131211;--surf:#1a1918;--surf2:#1e1d1b;--surfoff:#222120;--bord:#333230;
  --tx:#d0cfcd;--txm:#9e9d9a;--txf:#6e6c68;
  --prim:#4f98a3;--primh:#227f8b;--primhi:#1a2e30;
  --shmd:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--tx);font-size:clamp(14px,1.4vw,16px)}
button,input,select,textarea{font:inherit} button{cursor:pointer} a{color:inherit;text-decoration:none}

/* ── LAYOUT ── */
.app{display:grid;grid-template-columns:300px 1fr;height:100dvh;overflow:hidden}
.app > div{display:flex;flex-direction:column;overflow:hidden}
.sidebar{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--surf),var(--surf2));border-right:1px solid var(--bord);overflow:hidden}
.main{overflow-y:auto;background:var(--bg)}

/* ── SIDEBAR ── */
.sb-hdr{display:flex;align-items:center;gap:.65rem;padding:.85rem 1rem;border-bottom:1px solid var(--bord);flex-shrink:0}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--primhi);color:var(--prim);flex-shrink:0;cursor:pointer;transition:all var(--tr)}
.logo:hover{background:var(--prim);color:#fff}
.logo svg{width:18px;height:18px}
.sb-title{font-weight:700;font-size:.9rem}
.sb-search{padding:.5rem .75rem .5rem 1rem;border-bottom:1px solid var(--bord);flex-shrink:0}
.sb-search input{width:100%;padding:.5rem .7rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.8rem;outline:none;transition:border-color var(--tr)}
.sb-search input:focus{border-color:var(--prim)}
.sb-list{flex:1;overflow-y:auto;padding:.5rem 0}
.sb-month{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--txf);padding:.6rem 1rem .3rem;position:sticky;top:0;background:linear-gradient(180deg,var(--surf) 80%,transparent);z-index:1}
.sb-item{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;cursor:pointer;transition:background var(--tr);border-left:3px solid transparent}
.sb-item:hover{background:var(--surfoff)}
.sb-item.active{background:color-mix(in oklab,var(--prim) 8%,var(--surf));border-left-color:var(--prim)}
.sb-item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-item-info{flex:1;min-width:0}
.sb-item-name{font-size:.8rem;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item-meta{font-size:.65rem;color:var(--txm);margin-top:.05rem}
.sb-item-vol{font-size:.68rem;color:var(--txm);flex-shrink:0;text-align:right}
.sb-footer{flex-shrink:0;border-top:1px solid var(--bord);padding:.75rem 1rem;display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.sb-stat{font-size:.7rem;color:var(--txm)}
.sb-stat strong{display:block;font-size:.88rem;color:var(--tx);font-weight:700}

/* ── HEADER MAIN ── */
.main-hdr{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--bord);background:color-mix(in oklab,var(--surf) 92%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;flex-shrink:0}
.btn-icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--bord);background:var(--surf2);display:grid;place-items:center;cursor:pointer;color:var(--txm);transition:all var(--tr);padding:0}
.btn-icon:hover{background:var(--surfoff);color:var(--tx)}
.btn-icon svg{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.5rem .9rem;min-height:36px;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf2);color:var(--tx);font-size:.82rem;font-weight:500;cursor:pointer;transition:all var(--tr)}
.btn:hover{background:var(--surfoff)}
.btn-p{background:var(--prim);color:#fff;border-color:transparent}
.btn-p:hover{background:var(--primh)}
.btn-danger{background:#a12c7b;color:#fff;border-color:transparent}
.btn-danger:hover{background:#8a2268}

/* ── DÉTAIL SÉANCE ── */
.detail-wrap{padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;max-width:820px;margin:0 auto}
.detail-hdr-card{border-radius:var(--rxl);overflow:hidden;border:1px solid var(--bord);box-shadow:var(--shsm)}
.detail-hdr-bar{height:5px}
.detail-hdr-body{padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.detail-type-badge{font-size:.65rem;font-weight:800;padding:.3rem .75rem;border-radius:999px;white-space:nowrap}
.detail-seance-name{font-size:1.1rem;font-weight:700;flex:1;min-width:0}
.detail-prog{font-size:.75rem;color:var(--txm)}
.detail-date{font-size:.75rem;color:var(--txm);text-align:right}
.detail-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.detail-stat{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rlg);padding:.75rem;text-align:center;box-shadow:var(--shsm)}
.detail-stat-val{font-size:1.3rem;font-weight:700;color:var(--prim)}
.detail-stat-lbl{font-size:.63rem;color:var(--txm);text-transform:uppercase;letter-spacing:.06em;margin-top:.15rem}

/* ── EXERCICE CARD ── */
.exo-block{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--shsm)}
.exo-block-hdr{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-bottom:1px solid var(--bord)}
.exo-block-img{width:48px;height:48px;object-fit:contain;border-radius:.5rem;background:var(--surfoff);border:1px solid var(--bord);padding:3px;flex-shrink:0}
.exo-block-img-ph{width:48px;height:48px;border-radius:.5rem;background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center;flex-shrink:0}
.exo-block-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.exo-block-name{font-weight:700;font-size:.9rem;flex:1}
.exo-block-grp{font-size:.68rem;color:var(--txm)}
.exo-series-table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:360px}
.exo-series-wrap{overflow-x:auto}
.exo-series-table th{padding:.4rem .75rem;text-align:left;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txm);background:var(--surfoff);border-bottom:1px solid var(--bord)}
.exo-series-table td{padding:.4rem .75rem;border-bottom:1px solid var(--bord);vertical-align:middle}
.exo-series-table tr:last-child td{border-bottom:none}
.ressenti-badge{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .45rem;border-radius:999px;font-size:.7rem;font-weight:700}
.edit-inp{padding:.3rem .5rem;border-radius:var(--rsm);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.8rem;width:70px;text-align:center;outline:none;transition:border-color var(--tr)}
.edit-inp:focus{border-color:var(--prim)}
.edit-inp.wide{width:100%}
.edit-sel{padding:.3rem .45rem;border-radius:var(--rsm);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.8rem;outline:none;cursor:pointer}
.exo-note{padding:.6rem 1rem;font-size:.78rem;color:var(--txm);border-top:1px dashed var(--bord);font-style:italic}
.exo-note-edit{padding:.6rem 1rem;border-top:1px dashed var(--bord)}
.note-ta{width:100%;padding:.4rem .6rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.78rem;line-height:1.5;resize:vertical;outline:none;font:inherit;transition:border-color var(--tr)}
.note-ta:focus{border-color:var(--prim)}
.serie-del-btn{width:22px;height:22px;border-radius:.3rem;border:none;background:none;cursor:pointer;display:grid;place-items:center;color:var(--txf);transition:color var(--tr);padding:0;flex-shrink:0}
.serie-del-btn:hover{color:var(--err)}

/* ── NOTE GLOBALE + ACTIONS ── */
.global-note-block{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:1rem 1.25rem;box-shadow:var(--shsm)}
.detail-actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}

/* ── EMPTY STATE ── */
/* ── VUE TOGGLE ── */
.view-toggle{display:flex;gap:2px;background:var(--surfoff);border-radius:var(--rmd);padding:2px;border:1px solid var(--bord)}
.view-toggle button{padding:.4rem .75rem;border-radius:.4rem;border:none;background:none;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--txm);transition:all var(--tr)}
.view-toggle button.active{background:var(--surf);color:var(--prim);box-shadow:var(--shsm)}

/* ── CALENDRIER ── */
.cal-wrap{padding:1.5rem;max-width:920px;margin:0 auto}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.cal-month-label{font-size:1.2rem;font-weight:700;text-transform:capitalize}
.cal-nav{display:flex;gap:.4rem}
.cal-nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bord);background:var(--surf2);cursor:pointer;display:grid;place-items:center;color:var(--txm);transition:all var(--tr)}
.cal-nav button:hover{background:var(--surfoff);color:var(--tx)}
.cal-nav button svg{width:16px;height:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem}
.cal-dow{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txf);text-align:center;padding-bottom:.4rem}
.cal-cell{
  aspect-ratio:1;border-radius:var(--rlg);border:1px solid var(--bord);background:var(--surf);
  padding:.4rem;display:flex;flex-direction:column;gap:.2rem;cursor:default;transition:all var(--tr);
  position:relative;overflow:hidden;
}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.today{border-color:var(--prim);border-width:2px}
.cal-cell-num{font-size:.72rem;font-weight:700;color:var(--txm)}
.cal-cell.today .cal-cell-num{color:var(--prim)}
.cal-cell-dots{display:flex;flex-wrap:wrap;gap:2px;flex:1;align-content:flex-start}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;cursor:pointer}
.cal-cell-pop{position:absolute;top:100%;left:0;z-index:50;background:var(--surf);border:1px solid var(--bord);border-radius:var(--rlg);box-shadow:var(--shmd);padding:.5rem;min-width:200px;display:none;margin-top:4px}
.cal-cell:hover .cal-cell-pop{display:block}
.cal-pop-item{display:flex;align-items:center;gap:.4rem;padding:.3rem .4rem;border-radius:.4rem;cursor:pointer;font-size:.72rem;transition:background var(--tr)}
.cal-pop-item:hover{background:var(--surfoff)}
.cal-pop-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-legend{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--bord)}
.cal-legend-item{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--txm)}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60dvh;gap:1rem;color:var(--txf);text-align:center;padding:2rem}
.empty-state svg{width:56px;height:56px;opacity:.3}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--txm)}
.empty-state p{font-size:.82rem;max-width:320px;line-height:1.6}

/* ── MODALE CONFIRMATION ── */
/* ── AGENDA VIEW ── */
    /* ── AGENDA SPLIT ── */
    .agenda-split{display:grid;grid-template-columns:480px 1fr;height:calc(100dvh - 130px);overflow:hidden}
    .agenda-day.weekend{background:rgba(0,0,0,.025)!important}
    [data-theme="dark"] .agenda-day.weekend{background:rgba(255,255,255,.025)!important}
    .agenda-day.week-end-sep{border-bottom:2px solid var(--bord)!important}
    .agenda-day.holiday .agenda-day-num{color:var(--err)}
    .agenda-day.holiday .agenda-day-dow{color:var(--err)}
    .agenda-day-holiday-icon{font-size:.7rem;flex-shrink:0}
    .agenda-notes-row{display:flex;gap:.25rem;flex-wrap:wrap;align-items:center}
    .agenda-note-pill{display:inline-flex;align-items:center;gap:.25rem;padding:.1rem .4rem;border-radius:.3rem;font-size:.62rem;font-weight:600;color:#fff;cursor:pointer;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .agenda-note-pill:hover{opacity:.85}
    .agenda-note-del{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:.75rem;line-height:1;padding:0;flex-shrink:0}
    .agenda-note-del:hover{color:#fff}
    .agenda-add-note-btn{opacity:0;width:18px;height:18px;border-radius:50%;border:1px dashed var(--bord);background:none;cursor:pointer;display:grid;place-items:center;color:var(--txf);transition:all var(--tr);padding:0;flex-shrink:0;font-size:.7rem;line-height:1}
    .agenda-day:hover .agenda-add-note-btn{opacity:1}
    .agenda-add-note-btn:hover{border-color:var(--prim);color:var(--prim)}
    /* Annual weekends + separator */
    .annual-day-row.weekend{background:rgba(0,0,0,.03)!important}
    [data-theme="dark"] .annual-day-row.weekend{background:rgba(255,255,255,.03)!important}
    .annual-day-row.week-end-sep{border-bottom:2px solid var(--bord)!important}
    .annual-day-row.holiday .annual-day-num{color:var(--err)}
    /* Numéro de semaine */
    .wk-badge{font-size:.56rem;font-weight:800;color:var(--prim);opacity:.7;flex-shrink:0;min-width:18px;text-align:right;letter-spacing:-.02em}
    .wk-sep{width:100%;display:flex;align-items:center;gap:.35rem;padding:.15rem .45rem;background:color-mix(in oklab,var(--prim) 6%,var(--surf));border-top:1px solid color-mix(in oklab,var(--prim) 20%,var(--bord));flex-shrink:0;position:sticky;top:0}
    .wk-sep-lbl{font-size:.6rem;font-weight:800;color:var(--prim);white-space:nowrap}
    .wk-sep-line{flex:1;height:1px;background:color-mix(in oklab,var(--prim) 20%,var(--bord))}
    .agenda-wrap{overflow-y:auto;border-right:1px solid var(--bord);background:var(--surf);height:100%}
    .agenda-detail-panel{overflow-y:auto;background:var(--bg)}
    .agenda-detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:.75rem;color:var(--txf);text-align:center;padding:2rem}
    .agenda-detail-empty svg{width:40px;height:40px;opacity:.25}
    .agenda-day.selected{background:color-mix(in oklab,var(--prim) 12%,var(--surf))!important;border-left:3px solid var(--prim)}
    .agenda-month-block{display:flex;border-bottom:2px solid var(--bord)}
    .agenda-month-label{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-weight:800;font-size:.7rem;padding:.4rem .3rem;background:var(--am-color,var(--prim));color:#fff;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.08em;flex-shrink:0;width:26px}
    .agenda-days-col{flex:1;overflow:hidden}
    .agenda-day{display:flex;align-items:center;gap:.4rem;padding:.25rem .6rem;border-bottom:1px solid var(--bord);min-height:34px;transition:background var(--tr)}
    .agenda-day:last-child{border-bottom:none}
    .agenda-day.has-session{cursor:pointer}
    .agenda-day.has-session:hover{filter:brightness(.97)}
    .agenda-day.today{outline:2px solid var(--prim);outline-offset:-2px}
    .agenda-day-num{font-size:.75rem;font-weight:800;color:var(--txm);width:20px;text-align:right;flex-shrink:0}
    .agenda-day-dow{font-size:.62rem;font-weight:700;color:var(--txf);width:22px;flex-shrink:0}
    .agenda-ses-wrap{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;flex:1}
    .agenda-ses-pill{display:flex;align-items:center;gap:.2rem;padding:.1rem .35rem;border-radius:.3rem;cursor:pointer;transition:opacity var(--tr);font-size:.63rem;font-weight:600;color:#fff}
    .agenda-ses-pill:hover{opacity:.85}
    .agenda-mus-icon{width:20px;height:20px;object-fit:contain;flex-shrink:0}
    /* ── ANNUAL VIEW ── */
    .annual-outer{overflow:auto;padding:1rem;max-height:calc(100dvh - 130px)}
    .annual-nav{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1rem}
    .annual-year-label{font-size:1.2rem;font-weight:700;min-width:70px;text-align:center}
    .annual-nav-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--bord);background:var(--surf2);cursor:pointer;display:grid;place-items:center;color:var(--txm);transition:all var(--tr);padding:0}
    .annual-nav-btn:hover{background:var(--surfoff);color:var(--tx)}
    .annual-nav-btn svg{width:15px;height:15px}
    .annual-grid{display:grid;grid-template-columns:repeat(12,minmax(80px,1fr));gap:4px;min-width:860px}
    .annual-month-col{border-radius:var(--rmd);overflow:hidden;border:1px solid var(--bord)}
    .annual-month-hdr{font-weight:800;font-size:.63rem;text-align:center;padding:.45rem .2rem;text-transform:uppercase;letter-spacing:.04em;color:#fff}
    .annual-day-row{display:flex;align-items:center;gap:2px;padding:.15rem .3rem;border-bottom:1px solid var(--bord);min-height:22px;cursor:default;font-size:.58rem;transition:background var(--tr)}
    .annual-day-row:last-child{border-bottom:none}
    .annual-day-row.has-session{cursor:pointer}
    .annual-day-row.today{font-weight:800;outline:1px solid var(--prim);outline-offset:-1px}
    .annual-day-num{width:16px;text-align:right;font-weight:700;color:var(--txm);flex-shrink:0}
    .annual-day-dow{width:18px;font-weight:700;color:var(--txf);flex-shrink:0}
    .annual-mus-wrap{display:flex;gap:1px;flex-wrap:wrap;align-items:center;flex:1}
    .annual-mus-icon{width:13px;height:13px;object-fit:contain}
    /* ── SESSION POPUP ── */
    .ses-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:600;display:none;align-items:center;justify-content:center}
    .ses-popup{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);width:min(520px,94vw);max-height:82dvh;display:flex;flex-direction:column;box-shadow:var(--shmd);overflow:hidden}
    .ses-popup-bar{height:4px;flex-shrink:0}
    .ses-popup-row{display:flex;align-items:center;gap:.65rem;padding:.85rem 1.1rem;flex-shrink:0}
    .ses-popup-badge{font-size:.65rem;font-weight:800;padding:.25rem .65rem;border-radius:999px;white-space:nowrap}
    .ses-popup-body{overflow-y:auto;padding:.5rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.5rem}
    .ses-popup-exo{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--bord)}
    .ses-popup-exo:last-child{border-bottom:none}
    .ses-popup-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .ses-popup-mus-icon{width:26px;height:26px;object-fit:contain;flex-shrink:0}
    .ses-popup-exo-name{font-size:.8rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ses-popup-exo-info{font-size:.68rem;color:var(--txm);flex-shrink:0}
    .ses-popup-note{font-size:.78rem;color:var(--txm);font-style:italic;padding:.45rem .6rem;background:var(--surfoff);border-radius:var(--rmd)}
    .ses-popup-footer{padding:.75rem 1.1rem;border-top:1px solid var(--bord);display:flex;gap:.5rem;justify-content:flex-end;flex-shrink:0}
    .btn-sm{min-height:34px;padding:.4rem .75rem;font-size:.78rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:500;display:none;align-items:center;justify-content:center}
.modal{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:1.5rem;width:min(400px,92vw);box-shadow:var(--shmd)}
.modal-icon{width:48px;height:48px;border-radius:50%;background:rgba(161,44,123,.1);border:1px solid rgba(161,44,123,.25);display:grid;place-items:center;margin:0 auto .75rem;color:#a12c7b}
.modal-icon svg{width:22px;height:22px}
.modal-acts{display:flex;gap:.6rem;justify-content:center;margin-top:1rem}

@media(max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{max-height:240px;border-right:none;border-bottom:1px solid var(--bord)}
  .detail-stats-row{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-hdr">
      <div class="logo" id="homeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><polyline points="9 21 9 12 15 12 15 21"/></svg></div>
      <div>
        <div class="sb-title">Historique</div>
        <div style="font-size:.65rem;color:var(--txf)" id="sbCount">—</div>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json,.xlsx,.xls,.txt,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain" style="display:none">
    <div class="sb-search"><input id="searchInp" placeholder="🔎 Rechercher…" type="text"></div>
    <div class="sb-list" id="sbList"></div>
    <div class="sb-footer">
      <div class="sb-stat"><strong id="sfTotal">0</strong>Séances</div>
      <div class="sb-stat"><strong id="sfVol">0 kg</strong>Volume total</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div style="display:flex;flex-direction:column;overflow:hidden">
    <div class="main-hdr">
      <div class="view-toggle">
        <button id="viewListBtn" class="active">📋 Liste</button>
        <button id="viewAnnualBtn">📅 Annuel</button>
        <button id="view6mBtn">📅 6 Mois</button>
        <button id="view3mBtn">📅 3 Mois</button>
      </div>
      <div style="margin-left:auto;display:flex;gap:.3rem;align-items:center">
        <button class="btn-icon" id="importBtn" title="Importer des séances (JSON ou Excel)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="btn-icon" id="exportAllBtn" title="Exporter tout (JSON)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="btn-icon" id="resetBtn" title="Supprimer tout l'historique" style="color:var(--err)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
        <button class="btn-icon" id="themeBtn" title="Thème">
          <svg id="thDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="thLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
    <main class="main" id="mainArea" style="flex:1">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><polyline points="12 6 12 12 16 14"/></svg>
        <h3>Aucune séance sélectionnée</h3>
        <p>Sélectionnez une séance dans la liste pour voir ses détails, la modifier ou la supprimer.</p>
      </div>
    </main>
  </div>
</div>

<!-- Modale confirmation suppression -->
<div class="ov" id="delOv">
  <div class="modal">
    <div class="modal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></div>
    <div style="text-align:center">
      <div style="font-weight:700;font-size:.95rem;margin-bottom:.4rem">Supprimer cette séance ?</div>
      <div style="font-size:.8rem;color:var(--txm)" id="delDesc">Cette action est irréversible.</div>
    </div>
    <div class="modal-acts">
      <button class="btn" id="delCancel">Annuler</button>
      <button class="btn btn-danger" id="delConfirm">Supprimer</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="db.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
// CONSTANTES
// ══════════════════════════════════════════════════════════════
const HIST_KEY = 'gymos-historique-v1';
const EXO_KEY  = 'exercices-studio-autosave-v2';
const MC = {'Pectoraux':'#b90207','Abdominaux':'#8338bb','Bras':'#fa7b01','Avant-bras':'#f42d65','Cuisses (arrière)':'#974f1a','Cuisses (avant)':'#5a9d24','Cuisses (intérieur)':'#3fb5dc','Dos':'#0161be','Épaules':'#fbbd01','Fessiers':'#01969b','Mollets':'#a19e9f'};
const TC = {Push:'#fa7b01',Pull:'#0161be',Legs:'#5a9d24','Full Body':'#8338bb','Haut du corps':'#01969b','Bas du corps':'#974f1a',Cardio:'#b90207',Autre:'#9a9891'};
const RESSENTI = [
  {key:'bien',     emoji:'😊',label:'Bien',     bg:'rgba(67,122,34,.15)', color:'#437a22'},
  {key:'dur',      emoji:'😤',label:'Dur',      bg:'rgba(150,66,25,.15)', color:'#964219'},
  {key:'tres_dur', emoji:'😰',label:'Très dur', bg:'rgba(161,44,123,.15)',color:'#a12c7b'},
  {key:'super_dur',emoji:'💀',label:'Super dur',bg:'rgba(40,37,29,.12)',  color:'#28251d'},
];

// ══════════════════════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════════════════════
let _hist = [];
let _selId = null;
let _editMode = false;
let _exoLib = [];

// ══════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════
const esc = v => String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const grpc = g => MC[(g||'').split(',')[0].trim()] || '#9a9891';
const tc   = t => TC[t] || '#9a9891';
function hexRgb(hex){ return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }
function fmtDate(iso){ const d=new Date(iso+'T00:00'); return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function fmtDateShort(iso){ const d=new Date(iso+'T00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function fmtMonth(iso){ const d=new Date(iso+'T00:00'); return d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); }
function fmtDur(min){ if(!min)return '—'; if(min<60) return min+'min'; return Math.floor(min/60)+'h'+String(min%60).padStart(2,'0'); }
function getExoImg(nom){ const e=_exoLib.find(x=>x.exercice?.toLowerCase()===nom?.toLowerCase()); return e?.image||''; }

// ══════════════════════════════════════════════════════════════
// DONNÉES
// ══════════════════════════════════════════════════════════════
function loadHist(){ try{ _hist=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch{ _hist=[]; } }
function saveHist(){ localStorage.setItem(HIST_KEY,JSON.stringify(_hist)); GymDB.write('historique.json',_hist); GymDB.write('seances.json',_hist); }
function loadExoLib(){ try{ _exoLib=JSON.parse(localStorage.getItem(EXO_KEY)||'{}').rows||[]; }catch{ _exoLib=[]; } }

// ══════════════════════════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════════════════════════
function renderSidebar(q=''){
  const list = document.getElementById('sbList');
  list.innerHTML='';
  const filtered = q ? _hist.filter(h=>
    (h.seanceNom||'').toLowerCase().includes(q) ||
    (h.programmeNom||'').toLowerCase().includes(q) ||
    (h.date||'').includes(q)
  ) : _hist;

  if(!filtered.length){
    list.innerHTML='<div style="padding:1.5rem;text-align:center;color:var(--txf);font-size:.8rem">Aucune séance trouvée.</div>';
    return;
  }

  // Grouper par mois
  const byMonth = {};
  filtered.forEach(h=>{ const m=fmtMonth(h.date); if(!byMonth[m]) byMonth[m]=[]; byMonth[m].push(h); });

  Object.entries(byMonth).forEach(([month, items])=>{
    const mLabel=document.createElement('div'); mLabel.className='sb-month';
    mLabel.textContent=`${month.charAt(0).toUpperCase()+month.slice(1)} (${items.length})`;
    list.appendChild(mLabel);
    items.forEach(h=>{
      const hex=tc(h.seanceType);
      const nbSeries=h.exercices?.reduce((n,e)=>n+(e.series?.length||0),0)||0;
      const row=document.createElement('div'); row.className='sb-item'+(h.id===_selId?' active':'');
      row.innerHTML=`<span class="sb-item-dot" style="background:${hex}"></span>
        <div class="sb-item-info">
          <div class="sb-item-name">${esc(h.seanceNom||'Libre')}</div>
          <div class="sb-item-meta">${fmtDateShort(h.date)}${h.heure?' · '+h.heure:''} · ${fmtDur(h.dureeMin)} · ${nbSeries} séries</div>
        </div>
        <div class="sb-item-vol">${h.volumeTotal>0?h.volumeTotal+'kg':''}</div>`;
      row.addEventListener('click',()=>{ _selId=h.id; _editMode=false; switchView('list'); renderSidebar(q); renderDetail(); });
      list.appendChild(row);
    });
  });

  // Stats
  document.getElementById('sfTotal').textContent=_hist.length;
  const vol=_hist.reduce((s,h)=>s+(h.volumeTotal||0),0);
  document.getElementById('sfVol').textContent=vol>0?vol+'kg':'—';
  document.getElementById('sbCount').textContent=_hist.length+' séance'+(_hist.length!==1?'s':'');
}

// ══════════════════════════════════════════════════════════════
// DÉTAIL
// ══════════════════════════════════════════════════════════════
function renderDetail(){
  const main=document.getElementById('mainArea');
  const h=_hist.find(x=>x.id===_selId);
  if(!h){ main.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><polyline points="12 6 12 12 16 14"/></svg><h3>Aucune séance sélectionnée</h3><p>Cliquez sur une séance dans la liste pour afficher son détail.</p></div>'; return; }
  const hex=tc(h.seanceType);
  const [r,g,b]=hexRgb(hex);
  const totalSeries=h.exercices?.reduce((n,e)=>n+(e.series?.length||0),0)||0;

  main.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='detail-wrap';

  // Header card
  const hdrCard=document.createElement('div'); hdrCard.className='detail-hdr-card';
  const bar=document.createElement('div'); bar.className='detail-hdr-bar'; bar.style.background=hex;
  const body=document.createElement('div'); body.className='detail-hdr-body';
  body.style.background=`rgba(${r},${g},${b},.05)`;
  const badge=document.createElement('span'); badge.className='detail-type-badge';
  badge.style.cssText=`background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.35)`;
  badge.textContent=h.seanceType||'Libre';
  const titleBlock=document.createElement('div'); titleBlock.style.flex='1;min-width:0';
  titleBlock.innerHTML=`<div class="detail-seance-name" style="color:${hex}">${esc(h.seanceNom||'Séance libre')}</div><div class="detail-prog">${esc(h.programmeNom||'')}</div>`;
  const dateBlock=document.createElement('div'); dateBlock.className='detail-date';
  if(_editMode){
    dateBlock.style.cssText='display:flex;flex-direction:column;gap:.4rem;min-width:200px';
    dateBlock.innerHTML=`
      <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
        <label style="font-size:.68rem;font-weight:700;color:var(--txm);width:36px;flex-shrink:0">Date</label>
        <input type="date" id="editDate" value="${h.date}" style="flex:1;padding:.3rem .5rem;border-radius:var(--rsm);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.8rem;outline:none">
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
        <label style="font-size:.68rem;font-weight:700;color:var(--txm);width:36px;flex-shrink:0">Début</label>
        <input type="time" id="editHeureD" value="${h.heure||''}" style="flex:1;padding:.3rem .5rem;border-radius:var(--rsm);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.8rem;outline:none">
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
        <label style="font-size:.68rem;font-weight:700;color:var(--txm);width:36px;flex-shrink:0">Fin</label>
        <input type="time" id="editHeureF" value="${h.heureF||computeEndTime(h.heure,h.dureeMin)||''}" style="flex:1;padding:.3rem .5rem;border-radius:var(--rsm);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.8rem;outline:none">
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
        <label style="font-size:.68rem;font-weight:700;color:var(--txm);width:36px;flex-shrink:0">Durée</label>
        <input type="number" id="editDuree" value="${h.dureeMin||0}" min="0" style="flex:1;padding:.3rem .5rem;border-radius:var(--rsm);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.8rem;outline:none;width:60px">
        <span style="font-size:.72rem;color:var(--txm)">min</span>
      </div>`;
    // Auto-compute durée depuis début/fin
    setTimeout(()=>{
      const hD=document.getElementById('editHeureD');
      const hF=document.getElementById('editHeureF');
      const dD=document.getElementById('editDuree');
      function syncDur(){
        const d=timeDiff(hD?.value,hF?.value);
        if(d!==null&&dD) dD.value=d;
      }
      function syncFin(){
        if(!hD?.value||!dD?.value) return;
        const [h2,m2]=hD.value.split(':').map(Number);
        const tot=h2*60+m2+parseInt(dD.value||0);
        if(hF) hF.value=`${String(Math.floor(tot/60)%24).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;
      }
      hD?.addEventListener('change',syncDur);
      hF?.addEventListener('change',syncDur);
      dD?.addEventListener('input',syncFin);
    },0);
  } else {
    dateBlock.innerHTML=`<div style="font-weight:600;color:var(--tx)">${fmtDate(h.date)}</div>
      <div>${h.heure||''}${h.heureF?' → '+h.heureF:''}</div>`;
  }
  body.append(badge,titleBlock,dateBlock);
  hdrCard.append(bar,body); wrap.appendChild(hdrCard);

  // Stats
  const statsRow=document.createElement('div'); statsRow.className='detail-stats-row';
  [{val:fmtDur(h.dureeMin),lbl:'Durée'},{val:totalSeries,lbl:'Séries réalisées'},{val:h.volumeTotal>0?h.volumeTotal+' kg':'—',lbl:'Volume total'}].forEach(({val,lbl})=>{
    const c=document.createElement('div'); c.className='detail-stat';
    c.innerHTML=`<div class="detail-stat-val">${val}</div><div class="detail-stat-lbl">${lbl}</div>`;
    statsRow.appendChild(c);
  });
  wrap.appendChild(statsRow);

  // Actions (mode lecture / édition)
  const actions=document.createElement('div'); actions.className='detail-actions';
  if(_editMode){
    const saveBtn=document.createElement('button'); saveBtn.className='btn btn-p';
    saveBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg> Enregistrer`;
    saveBtn.addEventListener('click',()=>{ collectEdits(h); saveHist(); _editMode=false; renderDetail(); renderSidebar(document.getElementById('searchInp').value.trim()); });
    const cancelBtn=document.createElement('button'); cancelBtn.className='btn';
    cancelBtn.textContent='Annuler'; cancelBtn.addEventListener('click',()=>{ _editMode=false; loadHist(); renderDetail(); });
    actions.append(cancelBtn,saveBtn);
  } else {
    const editBtn=document.createElement('button'); editBtn.className='btn';
    editBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> Modifier`;
    editBtn.addEventListener('click',()=>{ _editMode=true; renderDetail(); });

    const dupBtn=document.createElement('button'); dupBtn.className='btn';
    dupBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Dupliquer`;
    dupBtn.addEventListener('click',()=>duplicateSession(h));

    const expBtn=document.createElement('button'); expBtn.className='btn';
    expBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Exporter`;
    expBtn.addEventListener('click',()=>exportSession(h));

    const delBtn=document.createElement('button'); delBtn.className='btn btn-danger';
    delBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> Supprimer`;
    delBtn.addEventListener('click',()=>openDelModal(h));
    actions.append(dupBtn,expBtn,editBtn,delBtn);
  }
  wrap.appendChild(actions);

  // Exercices
  (h.exercices||[]).forEach((exo,ei)=>{
    const eHex=grpc(exo.groupe);
    const [er,eg,eb]=hexRgb(eHex);
    const imgSrc=getExoImg(exo.nom)||'';
    const block=document.createElement('div'); block.className='exo-block'; block.dataset.ei=ei;

    // Header
    const ehdr=document.createElement('div'); ehdr.className='exo-block-hdr';
    ehdr.style.background=`rgba(${er},${eg},${eb},.05)`;
    if(imgSrc){
      const img=document.createElement('img'); img.className='exo-block-img';
      img.src='./img/'+imgSrc; img.alt=exo.nom; img.onerror=()=>img.replaceWith(mkPh(eHex));
      ehdr.appendChild(img);
    } else { ehdr.appendChild(mkPh(eHex)); }
    const edot=document.createElement('span'); edot.className='exo-block-dot'; edot.style.background=eHex;
    const einfo=document.createElement('div'); einfo.style.flex='1;min-width:0';
    einfo.innerHTML=`<div class="exo-block-name">${esc(exo.nom)}</div><div class="exo-block-grp">${esc(exo.groupe||'')}</div>`;
    ehdr.append(edot,einfo);

    // Bouton ajouter série (mode édition)
    if(_editMode){
      const addS=document.createElement('button'); addS.className='btn'; addS.style.cssText='font-size:.72rem;padding:.3rem .6rem;min-height:28px';
      addS.textContent='+ Série';
      addS.addEventListener('click',()=>{
        exo.series=exo.series||[];
        const last=exo.series[exo.series.length-1]||{};
        exo.series.push({reps:last.reps||'',poids:last.poids||'',duree:'',distance:'',ressenti:''});
        renderDetail();
      });
      const delExoBtn=document.createElement('button'); delExoBtn.className='btn'; delExoBtn.style.cssText='font-size:.72rem;padding:.3rem .55rem;min-height:28px;color:var(--err);border-color:var(--err)44';
      delExoBtn.title='Supprimer cet exercice de la séance';
      delExoBtn.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;
      delExoBtn.addEventListener('click',()=>{
        h.exercices.splice(ei,1);
        renderDetail();
      });
      ehdr.append(addS,delExoBtn);
    }
    block.appendChild(ehdr);

    // Séries
    if(!(exo.series||[]).length && _editMode){
      const empty=document.createElement('div');
      empty.style.cssText='padding:.65rem 1rem;font-size:.75rem;color:var(--txf);font-style:italic';
      empty.textContent='Aucune série. Cliquez sur "+ Série" pour en ajouter.';

function timeDiff(debut, fin){
  if(!debut||!fin) return null;
  const [dh,dm]=debut.split(':').map(Number);
  const [fh,fm]=fin.split(':').map(Number);
  let diff=(fh*60+fm)-(dh*60+dm);
  if(diff<0) diff+=24*60; // session nocturne
  return diff;
}
// Calcule l'heure de fin à partir de l'heure de début et de la durée
function computeEndTime(heure, dureeMin){
  if(!heure||!dureeMin) return '';
  const [h,m]=heure.split(':').map(Number);
  const tot=h*60+m+parseInt(dureeMin||0);
  return `${String(Math.floor(tot/60)%24).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;
}

// Collect edits (incluant date/heure/durée)
function collectEdits(h){
  const date=document.getElementById('editDate');
  const heureD=document.getElementById('editHeureD');
  const heureF=document.getElementById('editHeureF');
  const duree=document.getElementById('editDuree');
  if(date)   h.date=date.value;
  if(heureD) h.heure=heureD.value;
  if(heureF) h.heureF=heureF.value;
  if(duree)  h.dureeMin=parseInt(duree.value)||0;
  // Si début + fin renseignés → recalculer durée
  if(heureD?.value&&heureF?.value){
    const d=timeDiff(heureD.value,heureF.value);
    if(d!==null) h.dureeMin=d;
  }
  // Recalculer volume
  h.volumeTotal=(h.exercices||[]).reduce((tot,e)=>tot+(e.series||[]).reduce((v,s)=>{
    const p=parseFloat(s.poids)||0, r=parseInt(s.reps)||0; return v+p*r;
  },0),0);
}

function parseWorkoutFile(text){
  const lines=text.split(/\r\n|\n|\r/);
  let currentExercice='',currentDistance='',expectTarget=false;
  const out=[];
  for(let i=0;i<lines.length;i++){
    const cols=lines[i].split('\t');
    while(cols.length<11) cols.push('');
    const c0=(cols[0]||'').trim(),c1=(cols[1]||'').trim(),c2=(cols[2]||'').trim();
    const c4=(cols[4]||'').trim(),c5=(cols[5]||'').trim();
    const c6=(cols[6]||'').trim(),c7=(cols[7]||'').trim(),c8=(cols[8]||'').trim();
    // Nouveau bloc exercice (col0 non vide)
    if(c0!==''){currentExercice=c1;currentDistance='';expectTarget=false;continue;}
    // En-tête cibles
    if(c4==='Serie'&&c5==='Rep'){expectTarget=true;continue;}
    // Ligne après en-tête cibles = distance cible
    if(expectTarget){currentDistance=c8||'';expectTarget=false;continue;}
    // En-tête tableau des séries
    if(c1==='N°'&&c2==='Date') continue;
    // Ligne de série réalisée (N° 1-6, avec date)
    if(/^[1-6]$/.test(c1)&&c2){
      out.push({Date:c2,Exercice:currentExercice,Rep:c5,Poid:c6,Duree:c7,Distance:currentDistance});
    }
  }
  return out;
}

function importTxtFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const rows=parseWorkoutFile(e.target.result);
      if(!rows.length){showToast('Aucune série exploitable dans ce fichier.',true);return;}
      openTxtPreview(rows,file.name);
    }catch(err){showToast('Erreur lecture TXT : '+err.message,true);}
  };
  reader.onerror=()=>showToast('Impossible de lire le fichier.',true);
  reader.readAsText(file,'UTF-8');
}

// ── Convertir les lignes plates en sessions (même logique que Format 2) ──
function txtRowsToSessions(rows){
  const sessions={};
  rows.forEach(r=>{
    const date=(r.Date||'').trim(); const nom=(r.Exercice||'').trim();
    if(!date||!nom) return;
    // Convertir DD/MM/YYYY ou YYYY-MM-DD
    let iso=date;
    const m=date.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) iso=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const reps=(r.Rep||'').trim();
    const poids=(r.Poid||'').trim();
    const duree=(r.Duree||'').trim();
    const dist=(r.Distance||'').trim();
    const {groupe,image}=exoLibLookup(nom);
    const seanceName='Séance du '+iso.split('-').reverse().join('/');
    if(!sessions[iso]) sessions[iso]={date:iso,seanceNom:seanceName,seanceType:'Autre',exercices:[],volumeTotal:0,heure:'12:00',heureF:'14:00',dureeMin:120,programmeNom:'Import TXT'};
    const exos=sessions[iso].exercices;
    if(!exos.length||exos[exos.length-1].nom!==nom) exos.push({nom,groupe,image,series:[],note:''});
    exos[exos.length-1].series.push({reps,poids,duree,distance:dist,ressenti:'dur'});
    sessions[iso].volumeTotal=Math.round((sessions[iso].volumeTotal||0)+(parseFloat(poids)||0)*(parseFloat(reps)||0));
  });
  return Object.values(sessions).sort((a,b)=>a.date.localeCompare(b.date));
}

function uid(){ return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }

function downloadJSON(data, filename){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}

function exportSession(h){
  downloadJSON(h, `seance-${h.date}-${(h.seanceNom||'libre').replace(/[^a-z0-9]/gi,'_')}.json`);
}

function exportAll(){
  downloadJSON(_hist, `historique-${new Date().toISOString().split('T')[0]}.json`);
}

function duplicateSession(h){
  const today=new Date();
  const copy=JSON.parse(JSON.stringify(h)); // deep clone
  copy.id=uid();
  copy.date=today.toISOString().split('T')[0];
  copy.heure=today.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  copy.heureF='';
  // Réinitialiser les séries (garder les infos de référence mais retirer les valeurs réalisées)
  (copy.exercices||[]).forEach(e=>{
    e.series=(e.series||[]).map(s=>({reps:s.reps,poids:s.poids,duree:'',distance:'',ressenti:''}));
  });
  _hist.unshift(copy);
  _selId=copy.id; _editMode=false;
  saveHist();
  renderSidebar(document.getElementById('searchInp').value.trim());
  renderDetail();
  showToast(`Séance dupliquée — ${fmtDateShort(copy.date)}`);
}

function importSessions(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      let data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) data=[data]; // support import d'une seule séance
      let added=0;
      data.forEach(s=>{
        if(!s||typeof s!=='object'||!s.date) return;
        // Éviter les doublons par ID
        if(s.id&&_hist.find(h=>h.id===s.id)) return;
        if(!s.id) s.id=uid();
        _hist.push(s); added++;
      });
      // Re-trier par date décroissante
      _hist.sort((a,b)=>b.date.localeCompare(a.date)||((b.heure||'').localeCompare(a.heure||'')));
      saveHist();
      renderSidebar(document.getElementById('searchInp').value.trim());
      showToast(`${added} séance${added!==1?'s':''} importée${added!==1?'s':''}`);
    }catch{
      showToast('Erreur : fichier JSON invalide', true);
    }
  };
  reader.readAsText(file);
}

// Helper : trouver le groupe musculaire d'un exercice dans la bibliothèque
function exoLibLookup(nom){
  if(!nom) return {groupe:'',image:''};
  const n=nom.toLowerCase().trim();
  const found=_exoLib.find(e=>e.exercice&&e.exercice.toLowerCase().trim()===n);
  if(found) return {groupe:found.groupe_musculaire||'',image:found.image||''};
  // Recherche partielle si pas de correspondance exacte
  const partial=_exoLib.find(e=>e.exercice&&(e.exercice.toLowerCase().includes(n)||n.includes(e.exercice.toLowerCase())));
  if(partial) return {groupe:partial.groupe_musculaire||'',image:partial.image||''};
  return {groupe:'',image:''};
}

function parseExcelFormat1(rows){
  // Format 1: Date | Exercice | serie | Rep | Poid | Duree | Distance
  const sessions={};
  rows.forEach(row=>{
    const date=excelDateStr(row[0]); const nom=cleanStr(row[1]);
    if(!date||!nom) return;
    const nb=parseInt(row[2])||1;
    const reps=row[3]!=null&&row[3]!==''?String(row[3]):'';
    const poids=row[4]!=null&&row[4]!==''?String(row[4]):'';
    const duree=row[5]!=null&&row[5]!==''?String(row[5]):'';
    const dist=row[6]!=null&&row[6]!==''?String(row[6]):'';
    const vol=(parseFloat(poids)||0)*(parseFloat(reps)||0)*nb;
    const {groupe,image}=exoLibLookup(nom);
    if(!sessions[date]) sessions[date]={date,seanceNom:'Séance du '+date.split('-').reverse().join('/'),seanceType:'Autre',exercices:[],volumeTotal:0,heure:'12:00',heureF:'14:00',dureeMin:120,programmeNom:'Import Excel'};
    const series=Array.from({length:Math.max(nb,1)},()=>({reps,poids,duree,distance:dist,ressenti:'dur'}));
    sessions[date].exercices.push({nom,groupe,image,series,note:''});
    sessions[date].volumeTotal=Math.round((sessions[date].volumeTotal||0)+vol);
  });
  return Object.values(sessions);
}

function parseExcelFormat2(rows){
  // Format 2: Date | Exercice | Rep | Poid | Duree | Distance (1 row per series)
  const sessions={};
  rows.forEach(row=>{
    const date=excelDateStr(row[0]); const nom=cleanStr(row[1]);
    if(!date||!nom) return;
    const reps=row[2]!=null&&row[2]!==''?String(row[2]):'';
    const poids=row[3]!=null&&row[3]!==''?String(row[3]):'';
    const duree=row[4]!=null&&row[4]!==''?String(row[4]):'';
    const dist=row[5]!=null&&row[5]!==''?String(row[5]):'';
    const {groupe,image}=exoLibLookup(nom);
    if(!sessions[date]) sessions[date]={date,seanceNom:'Séance du '+date.split('-').reverse().join('/'),seanceType:'Autre',exercices:[],volumeTotal:0,heure:'12:00',heureF:'14:00',dureeMin:120,programmeNom:'Import Excel'};
    const exos=sessions[date].exercices;
    if(!exos.length||exos[exos.length-1].nom!==nom) exos.push({nom,groupe,image,series:[],note:''});
    exos[exos.length-1].series.push({reps,poids,duree,distance:dist,ressenti:'dur'});
    sessions[date].volumeTotal=Math.round((sessions[date].volumeTotal||0)+(parseFloat(poids)||0)*(parseFloat(reps)||0));
  });
  return Object.values(sessions);
}

function excelDateStr(v){
  if(v==null||v==='') return null;
  // Nombre de série Excel → conversion UTC pure (serial 25569 = 1er jan 1970)
  // Formule fiable quelle que soit la timezone : (serial - 25569) jours depuis epoch Unix
  if(typeof v==='number'){
    const utcMs=Math.round(v-25569)*86400*1000; // arrondi pour éviter les demi-jours
    const d=new Date(utcMs);
    return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  // Objet Date (ne devrait plus arriver sans cellDates:true, mais au cas où)
  if(v instanceof Date){
    // Ajouter 12h pour éviter les erreurs de frontière de minuit
    const d=new Date(v.getTime()+12*3600*1000);
    return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  // Chaîne YYYY-MM-DD
  if(typeof v==='string'){
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
    // Chaîne DD/MM/YYYY (format français)
    const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    return v.trim().slice(0,10);
  }
  return null;
}
function cleanStr(v){return v!=null&&v!=='nan'?String(v).trim():'';}
function dateFmt(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function importExcelFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      if(raw.length<2){showToast('Fichier vide ou invalide.',true);return;}
      // Détecter le format via les en-têtes
      const headers=raw[0].map(h=>String(h||'').toLowerCase().trim());
      const hasSerieCol=headers.some(h=>h==='serie'||h==='séries'||h==='nb série');
      const dataRows=raw.slice(1).filter(r=>r[0]!=null);
      const sessions=hasSerieCol?parseExcelFormat1(dataRows):parseExcelFormat2(dataRows);
      openImportPreview(sessions,file.name,hasSerieCol?'Format 1 (séries agrégées)':'Format 2 (1 ligne/série)');
    }catch(err){showToast('Erreur lecture Excel : '+err.message,true);}
  };
  reader.readAsArrayBuffer(file);
}

function showToast(msg, isErr=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.cssText=`position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);

    border-radius:999px;font-size:.78rem;font-weight:700;z-index:999;
    box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:1;transition:opacity .5s`;
  clearTimeout(t._to);
  t._to=setTimeout(()=>t.style.opacity='0',2500);
}

// VUE CALENDRIER
// ══════════════════════════════════════════════════════════════
let _currentView = 'list'; // 'list' | 'calendar'
let _calYear, _calMonth; // 0-indexed month

function initCalDate(){
  const now = new Date();
  _calYear = now.getFullYear(); _calMonth = now.getMonth();
}

function renderCalendar(){
  const main = document.getElementById('mainArea');
  main.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='cal-wrap';

  // Header navigation
  const hdr = document.createElement('div'); hdr.className='cal-hdr';
  const monthLabel = new Date(_calYear,_calMonth,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const label = document.createElement('div'); label.className='cal-month-label'; label.textContent=monthLabel;
  const nav = document.createElement('div'); nav.className='cal-nav';
  const prevBtn=document.createElement('button'); prevBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>';
  prevBtn.addEventListener('click',()=>{ _calMonth--; if(_calMonth<0){_calMonth=11;_calYear--;} renderCalendar(); });
  const todayBtn=document.createElement('button'); todayBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/></svg>';
  todayBtn.title='Aujourd\'hui'; todayBtn.addEventListener('click',()=>{ initCalDate(); renderCalendar(); });
  const nextBtn=document.createElement('button'); nextBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>';
  nextBtn.addEventListener('click',()=>{ _calMonth++; if(_calMonth>11){_calMonth=0;_calYear++;} renderCalendar(); });
  nav.append(prevBtn,todayBtn,nextBtn);
  hdr.append(label,nav); wrap.appendChild(hdr);

  // Grille jours de la semaine
  const grid = document.createElement('div'); grid.className='cal-grid';
  ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(d=>{
    const dow=document.createElement('div'); dow.className='cal-dow'; dow.textContent=d; grid.appendChild(dow);
  });

  const firstDay = new Date(_calYear,_calMonth,1);
  const startOffset = (firstDay.getDay()+6)%7; // Lundi=0
  const daysInMonth = new Date(_calYear,_calMonth+1,0).getDate();
  const todayStr = new Date().toISOString().split('T')[0];

  // Map date → séances
  const byDate = {};
  _hist.forEach(h=>{ if(!byDate[h.date]) byDate[h.date]=[]; byDate[h.date].push(h); });

  for(let i=0;i<startOffset;i++){ const c=document.createElement('div'); c.className='cal-cell empty'; grid.appendChild(c); }

  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cell=document.createElement('div'); cell.className='cal-cell'+(dateStr===todayStr?' today':'');
    const num=document.createElement('div'); num.className='cal-cell-num'; num.textContent=day;
    cell.appendChild(num);

    const seances = byDate[dateStr]||[];
    if(seances.length){
      const dotsRow=document.createElement('div'); dotsRow.className='cal-cell-dots';
      seances.forEach(h=>{
        const dot=document.createElement('span'); dot.className='cal-dot'; dot.style.background=tc(h.seanceType);
        dotsRow.appendChild(dot);
      });
      cell.appendChild(dotsRow);

      // Popover au survol
      const pop=document.createElement('div'); pop.className='cal-cell-pop';
      seances.forEach(h=>{
        const item=document.createElement('div'); item.className='cal-pop-item';
        const pdot=document.createElement('span'); pdot.className='cal-pop-dot'; pdot.style.background=tc(h.seanceType);
        const txt=document.createElement('span'); txt.textContent=`${h.seanceNom||'Séance'} · ${fmtDur(h.dureeMin)}`;
        item.append(pdot,txt);
        item.addEventListener('mousedown', ev=>{ ev.preventDefault(); openSessionPopup(h.id); });
        pop.appendChild(item);
      });
      cell.appendChild(pop);
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  // Légende
  const legend=document.createElement('div'); legend.className='cal-legend';
  Object.entries(TC).forEach(([type,hex])=>{
    if(!_hist.some(h=>h.seanceType===type)) return;
    const item=document.createElement('div'); item.className='cal-legend-item';
    item.innerHTML=`<span class="cal-dot" style="background:${hex}"></span>${esc(type)}`;
    legend.appendChild(item);
  });
  if(legend.children.length) wrap.appendChild(legend);

  main.appendChild(wrap);
}

// ── Numéro de semaine ISO 8601 ──────────────────────────────────────────────
function getISOWeek(dateStr){
  const d=new Date(dateStr+'T00:00');
  const utc=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  utc.setUTCDate(utc.getUTCDate()+4-(utc.getUTCDay()||7));
  const y1=new Date(Date.UTC(utc.getUTCFullYear(),0,1));
  return Math.ceil((((utc-y1)/86400000)+1)/7);
}
function wkBadge(dateStr){
  const span=document.createElement('span'); span.className='wk-badge';
  span.textContent='S'+getISOWeek(dateStr); span.title='Semaine '+getISOWeek(dateStr);
  return span;
}

// ══════════════════════════════════════════════════════════════
// JOURS FÉRIÉS FRANCE
// ══════════════════════════════════════════════════════════════
function easterDate(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,day);
}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
// Formatage local (pas UTC) pour éviter le décalage de fuseau horaire
function dateFmt(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getFrenchHolidays(year){
  const e=easterDate(year);
  return {
    [dateFmt(new Date(year,0,1))]:   {e:'🎆', n:"Jour de l'An"},
    [dateFmt(addDays(e,1))]:         {e:'🐣', n:'Lundi de Pâques'},
    [dateFmt(new Date(year,4,1))]:   {e:'🌹', n:'Fête du Travail'},
    [dateFmt(new Date(year,4,8))]:   {e:'✌️', n:'Victoire 1945'},
    [dateFmt(addDays(e,39))]:        {e:'✝️', n:'Ascension'},
    [dateFmt(addDays(e,50))]:        {e:'🕊️', n:'Lundi de Pentecôte'},
    [dateFmt(new Date(year,6,14))]:  {e:'🇫🇷', n:'Fête Nationale'},
    [dateFmt(new Date(year,7,15))]:  {e:'🌟', n:'Assomption'},
    [dateFmt(new Date(year,10,1))]:  {e:'🕯️', n:'Toussaint'},
    [dateFmt(new Date(year,10,11))]: {e:'☮️', n:'Armistice'},
    [dateFmt(new Date(year,11,25))]: {e:'🎄', n:'Noël'},
  };
}
// Cache par année
const _holidayCache={};
function getHoliday(dateStr){
  const y=parseInt(dateStr.slice(0,4));
  if(!_holidayCache[y]) _holidayCache[y]=getFrenchHolidays(y);
  return _holidayCache[y][dateStr]||null; // {e:'🇫🇷', n:'Fête Nationale'} ou null
}

// NOTES AGENDA
// ══════════════════════════════════════════════════════════════
const NOTES_KEY='gymos-agenda-notes-v1';
let _agendaNotes={};
const NOTE_COLORS=['#01696f','#0161be','#fa7b01','#5a9d24','#a12c7b','#974f1a','#374151','#dc2626'];

function loadNotes(){try{_agendaNotes=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}')}catch{_agendaNotes={}}}
function saveNotes(){localStorage.setItem(NOTES_KEY,JSON.stringify(_agendaNotes));}

let _noteTarget=''; // date courante pour la modale
let _noteEditId=null;
let _noteColor=NOTE_COLORS[0];
let _onNoteClose=null;

function openNoteModal(dateStr, editId=null, onClose=null){
  _noteTarget=dateStr; _noteEditId=editId; _onNoteClose=onClose;
  const existing=editId?(_agendaNotes[dateStr]||[]).find(n=>n.id===editId):null;
  _noteColor=existing?.color||NOTE_COLORS[0];
  const ov=document.getElementById('noteOv');
  document.getElementById('noteText').value=existing?.text||'';
  document.getElementById('noteDelBtn').style.display=editId?'':'none';
  renderNoteColorGrid();
  ov.style.display='flex';
  setTimeout(()=>document.getElementById('noteText').focus(),60);
}
function closeNoteModal(){document.getElementById('noteOv').style.display='none';}
function renderNoteColorGrid(){
  const grid=document.getElementById('noteColorGrid'); grid.innerHTML='';
  NOTE_COLORS.forEach(c=>{
    const btn=document.createElement('button');
    btn.style.cssText=`width:24px;height:24px;border-radius:50%;background:${c};border:3px solid ${c===_noteColor?'var(--tx)':'transparent'};cursor:pointer;transition:all .15s`;
    btn.addEventListener('click',()=>{_noteColor=c;renderNoteColorGrid();});
    grid.appendChild(btn);
  });
}
function saveNote(){
  const text=document.getElementById('noteText').value.trim(); if(!text) return;
  if(!_agendaNotes[_noteTarget]) _agendaNotes[_noteTarget]=[];
  if(_noteEditId){
    const idx=_agendaNotes[_noteTarget].findIndex(n=>n.id===_noteEditId);
    if(idx>=0) _agendaNotes[_noteTarget][idx]={id:_noteEditId,text,color:_noteColor};
  } else {
    _agendaNotes[_noteTarget].push({id:uid(),text,color:_noteColor});
  }
  saveNotes(); closeNoteModal(); if(_onNoteClose) _onNoteClose();
}
function deleteNote(){
  if(!_noteEditId) return;
  _agendaNotes[_noteTarget]=(_agendaNotes[_noteTarget]||[]).filter(n=>n.id!==_noteEditId);
  saveNotes(); closeNoteModal(); if(_onNoteClose) _onNoteClose();
}

// FICHE INFO EXERCICE (volet agenda)
// ══════════════════════════════════════════════════════════════
function openAgendaExoInfo(nom){
  const exo=_exoLib.find(e=>e.exercice?.toLowerCase()===nom?.toLowerCase())||{exercice:nom};
  const hex=MC[(exo.groupe_musculaire||'').split(',')[0].trim()]||'#01696f';
  const [r,g,b]=hexRgb(hex);
  const ov=document.getElementById('agendaExoOv');
  document.getElementById('aeBar').style.background=hex;
  document.getElementById('aeHdr').style.background=`rgba(${r},${g},${b},.07)`;
  const badge=document.getElementById('aeBadge');
  badge.textContent=exo.groupe_musculaire||'—';
  badge.style.cssText=`font-size:.65rem;font-weight:800;padding:.25rem .65rem;border-radius:999px;white-space:nowrap;background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.35)`;
  document.getElementById('aeName').textContent=exo.exercice||'—';
  document.getElementById('aeName').style.color=hex;
  document.getElementById('aeSub').textContent=[exo.muscle,exo.subdivision&&exo.subdivision!=='—'?exo.subdivision:''].filter(Boolean).join(' · ');
  const img=document.getElementById('aeImg'); const ph=document.getElementById('aePh');
  if(exo.image){img.src='./img/'+exo.image;img.style.display='block';ph.style.display='none';img.onerror=()=>{img.style.display='none';ph.style.display='flex';};}
  else{img.style.display='none';ph.style.display='flex';}
  const tags=document.getElementById('aeTags');tags.innerHTML='';
  [exo.equipement,exo.type_exercice].filter(Boolean).forEach(t=>{const s=document.createElement('span');s.style.cssText='display:inline-flex;padding:.2rem .5rem;border-radius:999px;font-size:.65rem;font-weight:600;background:var(--surfoff);color:var(--txm);border:1px solid var(--bord)';s.textContent=t;tags.appendChild(s);});
  const secs=document.getElementById('aeSecs');secs.innerHTML='';
  [{lbl:'Muscles secondaires',val:exo.muscle_secondaire},{lbl:'Descriptif',val:exo.descriptif},{lbl:'Exécution',val:exo.execution}].forEach(({lbl,val})=>{
    if(!val)return;
    const d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;gap:.3rem';
    const t=document.createElement('div');t.style.cssText=`font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:${hex};padding-bottom:.2rem;border-bottom:1px solid rgba(${r},${g},${b},.2)`;t.textContent=lbl;
    const tx=document.createElement('div');tx.style.cssText='font-size:.8rem;line-height:1.55;color:var(--tx);white-space:pre-wrap';tx.textContent=val;
    d.append(t,tx);secs.appendChild(d);
  });
  if(!secs.children.length)secs.innerHTML='<div style="color:var(--txf);font-size:.8rem;font-style:italic">Aucune information renseignée.</div>';
  ov.style.display='flex';
}

document.getElementById('agendaExoOv').addEventListener('click',e=>{if(e.target===document.getElementById('agendaExoOv'))document.getElementById('agendaExoOv').style.display='none';});
document.getElementById('aeClose').addEventListener('click',()=>document.getElementById('agendaExoOv').style.display='none');

// Wiring notes
document.getElementById('noteOv').addEventListener('click',e=>{if(e.target===document.getElementById('noteOv'))closeNoteModal();});
document.getElementById('noteCancel').addEventListener('click',closeNoteModal);
document.getElementById('noteSave').addEventListener('click',saveNote);
document.getElementById('noteDelBtn').addEventListener('click',deleteNote);
document.getElementById('noteText').addEventListener('keydown',e=>{if(e.key==='Enter')saveNote();if(e.key==='Escape')closeNoteModal();});

// VUE AGENDA (réécriture avec toutes les nouvelles features)
// ══════════════════════════════════════════════════════════════
let _agendaMonths = 6; // nombre de mois à afficher

function renderAgenda(){
  const main=document.getElementById('mainArea'); main.innerHTML='';
  const byDate=buildSessionsByDate();
  const todayStr=new Date().toISOString().split('T')[0];

  // Split container
  const split=document.createElement('div'); split.className='agenda-split';
  const wrap=document.createElement('div'); wrap.className='agenda-wrap';
  const detailPanel=document.createElement('div'); detailPanel.className='agenda-detail-panel';

  // Empty state du volet droit
  function showDetailEmpty(){
    detailPanel.innerHTML=`<div class="agenda-detail-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="8"/><line x1="12" y1="12" x2="12" y2="16"/></svg>
      <p style="font-size:.82rem;max-width:200px;line-height:1.5">Cliquez sur une séance pour voir son détail</p>
    </div>`;
  }

  // Remplir le volet droit avec les détails d'une séance
  let _activeAgendaId=null;
  function showAgendaDetail(hId){
    const h=_hist.find(x=>x.id===hId); if(!h) return;
    _activeAgendaId=hId;
    // Marquer la ligne sélectionnée
    wrap.querySelectorAll('.agenda-day').forEach(el=>el.classList.remove('selected'));
    wrap.querySelectorAll(`.agenda-day[data-hid="${hId}"]`).forEach(el=>el.classList.add('selected'));

    const hex=TC[h.seanceType]||'#9a9891';
    const [r,g,b]=hexRgb(hex);
    const nbS=(h.exercices||[]).reduce((n,e)=>n+(e.series?.length||0),0);
    detailPanel.innerHTML='';
    const inner=document.createElement('div'); inner.style.cssText='padding:.75rem 1rem;display:flex;flex-direction:column;gap:.65rem;max-width:600px;margin:0 auto';

    // Header
    const hdrCard=document.createElement('div');
    hdrCard.style.cssText=`background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--shsm);border-left:4px solid ${hex}`;
    const hdrTop=document.createElement('div');
    hdrTop.style.cssText=`padding:.85rem 1.1rem;background:rgba(${r},${g},${b},.06);display:flex;align-items:center;gap:.65rem;flex-wrap:wrap`;
    const badge=document.createElement('span');
    badge.style.cssText=`font-size:.65rem;font-weight:800;padding:.25rem .65rem;border-radius:999px;white-space:nowrap;background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.35)`;
    badge.textContent=h.seanceType||'Libre';
    const nameDiv=document.createElement('div'); nameDiv.style.flex='1;min-width:0';
    nameDiv.innerHTML=`<div style="font-weight:700;font-size:.95rem;color:${hex};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.seanceNom||'Séance libre')}</div>
      <div style="font-size:.7rem;color:var(--txm);margin-top:.1rem">${esc(h.programmeNom||'')}${h.heure?' · '+h.heure:''}${h.heureF?' → '+h.heureF:''}</div>`;
    const dateDiv=document.createElement('div');
    dateDiv.style.cssText='font-size:.72rem;color:var(--txm);text-align:right;flex-shrink:0';
    dateDiv.innerHTML=`<div style="font-weight:600;color:var(--tx)">${fmtDate(h.date)}</div>`;
    hdrTop.append(badge,nameDiv,dateDiv);
    hdrCard.appendChild(hdrTop);
    // Mini stats
    const stats=document.createElement('div');
    stats.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--bord)';
    [{v:fmtDur(h.dureeMin),l:'Durée'},{v:nbS,l:'Séries'},{v:h.volumeTotal>0?h.volumeTotal+'kg':'—',l:'Volume'}].forEach(({v,l})=>{
      const s=document.createElement('div'); s.style.cssText='padding:.6rem;text-align:center;border-right:1px solid var(--bord)';
      s.innerHTML=`<div style="font-size:1rem;font-weight:700;color:var(--prim)">${v}</div><div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;color:var(--txm);margin-top:.1rem">${l}</div>`;
      stats.appendChild(s);
    });
    stats.lastChild.style.borderRight='none';
    hdrCard.appendChild(stats);
    inner.appendChild(hdrCard);

    // Exercices
    if((h.exercices||[]).length){
      const exoCard=document.createElement('div');
      exoCard.style.cssText='background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--shsm)';
      const exoTitle=document.createElement('div');
      exoTitle.style.cssText='padding:.6rem 1rem;background:var(--surfoff);border-bottom:1px solid var(--bord);font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--txf)';
      exoTitle.textContent='Exercices';
      exoCard.appendChild(exoTitle);
      (h.exercices||[]).forEach(e=>{
        const ehex=grpc(e.groupe);
        const muscles=getSessionMuscles({exercices:[e]});
        const nbEs=(e.series||[]).length;
        const maxP=Math.max(0,...(e.series||[]).map(s=>parseFloat(s.poids)||0));
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;border-bottom:1px solid var(--bord)';
        const musImgs=muscles.slice(0,2).map(m=>{
          const src=MUSCLE_IMG[m]; if(!src) return '';
          return `<img src="${src}" alt="${esc(m)}" style="width:28px;height:28px;object-fit:contain" onerror="this.remove()">`;
        }).join('');
        const exoImgSrc=getExoImg(e.nom);
        const exoImgEl=document.createElement('div'); exoImgEl.style.cssText='flex-shrink:0';
        if(exoImgSrc){
          const exoImg=document.createElement('img');
          exoImg.src='./img/'+exoImgSrc; exoImg.alt=e.nom;
          exoImg.style.cssText='width:44px;height:44px;object-fit:contain;border-radius:.45rem;background:var(--surfoff);border:1px solid var(--bord);padding:2px;cursor:zoom-in;transition:opacity .15s';
          exoImg.onerror=()=>exoImg.style.display='none';
          exoImg.addEventListener('click',ev=>{ev.stopPropagation();openAgendaExoInfo(e.nom);});
          exoImg.addEventListener('mouseenter',()=>exoImg.style.opacity='.75');
          exoImg.addEventListener('mouseleave',()=>exoImg.style.opacity='1');
          exoImgEl.appendChild(exoImg);
        }
        row.innerHTML=`<span style="width:8px;height:8px;border-radius:50%;background:${ehex};flex-shrink:0"></span>
          <div style="display:flex;gap:3px;flex-shrink:0">${musImgs}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.nom)}</div>
            <div style="font-size:.65rem;color:var(--txm)">${esc(e.groupe||'')}</div>
          </div>
          <div style="font-size:.7rem;color:var(--txm);text-align:right;flex-shrink:0">
            ${nbEs} sér.${maxP>0?' · '+maxP+'kg':''}
          </div>`;
        row.insertBefore(exoImgEl, row.children[1]);
        exoCard.appendChild(row);
      });
      exoCard.lastChild.style.borderBottom='none';
      inner.appendChild(exoCard);
    }

    // Note
    if(h.noteGlobale){
      const noteEl=document.createElement('div');
      noteEl.style.cssText='background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:.85rem 1rem;font-size:.8rem;color:var(--txm);font-style:italic;line-height:1.6;box-shadow:var(--shsm)';
      noteEl.textContent=h.noteGlobale;
      inner.appendChild(noteEl);
    }

    // Bouton voir détail complet
    const actRow=document.createElement('div'); actRow.style.cssText='display:flex;justify-content:flex-end;gap:.5rem';
    const fullBtn=document.createElement('button'); fullBtn.className='btn btn-p';
    fullBtn.style.fontSize='.78rem';
    fullBtn.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> Voir et modifier`;
    fullBtn.addEventListener('click',()=>{ _selId=h.id; _editMode=false; switchView('list'); renderSidebar(); renderDetail(); });
    actRow.appendChild(fullBtn);
    inner.appendChild(actRow);

    detailPanel.appendChild(inner);
  }

  showDetailEmpty();

  // Construire l'agenda
  const allDates=_hist.map(h=>h.date).sort();
  const earliest=allDates[0]||todayStr;
  const firstD=new Date(earliest+'T00:00');
  const lastD=new Date();
  let cur=new Date(firstD.getFullYear(), firstD.getMonth(), 1);
  const endMonth=new Date(lastD.getFullYear(), lastD.getMonth(), 1);

  while(cur<=endMonth){
    const yr=cur.getFullYear(), mo=cur.getMonth();
    const mColor=AGENDA_COLORS[mo];
    const daysInMonth=new Date(yr,mo+1,0).getDate();
    const block=document.createElement('div'); block.className='agenda-month-block';
    const mlabel=document.createElement('div'); mlabel.className='agenda-month-label';
    mlabel.style.setProperty('--am-color',mColor);
    mlabel.textContent=MONTH_NAMES_FR[mo].toUpperCase()+' '+yr;
    const daysCol=document.createElement('div'); daysCol.className='agenda-days-col';

    for(let day=1;day<=daysInMonth;day++){
      const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const d=new Date(dateStr+'T00:00');
      const dowStr=DOW_FR2[d.getDay()];
      const sessions=byDate[dateStr]||[];
      const isToday=dateStr===todayStr;
      const dow=d.getDay();
      const isWeekend=(dow===0||dow===6);
      const holiday=getHoliday(dateStr);
      const dayNotes=(_agendaNotes[dateStr]||[]);

      // Séparateur semaine avant chaque lundi
      if(dow===1){
        const sep=document.createElement('div'); sep.className='wk-sep';
        const wkN=getISOWeek(dateStr);
        sep.innerHTML=`<span class="wk-sep-lbl">Semaine ${wkN}</span><span class="wk-sep-line"></span>`;
        daysCol.appendChild(sep);
      }
      const dayRow=document.createElement('div');
      dayRow.className='agenda-day'+(sessions.length?' has-session':'')+(isToday?' today':'')+(isWeekend?' weekend':'')+(dow===0?' week-end-sep':'')+(holiday?' holiday':'');
      if(sessions.length){
        const firstHex=TC[sessions[0].seanceType]||'#9a9891';
        const [r,g,b]=hexRgb(firstHex);
        dayRow.style.background=`rgba(${r},${g},${b},.07)`;
      }
      const numEl=document.createElement('span'); numEl.className='agenda-day-num'; numEl.textContent=day;
      const dowEl=document.createElement('span'); dowEl.className='agenda-day-dow'; dowEl.textContent=DOW_FR2[dow];
      const hlEl=document.createElement('span'); hlEl.className='agenda-day-holiday-icon';
      if(holiday){ hlEl.textContent=holiday.e; hlEl.title=holiday.n; }
      const sesWrap=document.createElement('div'); sesWrap.className='agenda-ses-wrap';
      sessions.forEach(h=>{
        const shex=TC[h.seanceType]||'#9a9891';
        const muscles=getSessionMuscles(h);
        const pill=document.createElement('div'); pill.className='agenda-ses-pill';
        pill.style.background=shex; pill.title=h.seanceNom||'Séance';
        muscles.slice(0,3).forEach(m=>{
          const src=MUSCLE_IMG[m]; if(!src) return;
          const img=document.createElement('img'); img.className='agenda-mus-icon';
          img.src=src; img.alt=m; img.onerror=()=>img.remove();
          pill.appendChild(img);
        });
        const nameSpan=document.createElement('span'); nameSpan.textContent=(h.seanceNom||'').slice(0,14);
        pill.appendChild(nameSpan);
        pill.addEventListener('click',e=>{ e.stopPropagation(); showAgendaDetail(h.id); });
        sesWrap.appendChild(pill);
      });
      dayNotes.forEach(note=>{
        const np=document.createElement('span'); np.className='agenda-note-pill'; np.style.background=note.color;
        np.title=note.text; const tx=document.createElement('span'); tx.textContent=note.text; tx.style.cssText='overflow:hidden;text-overflow:ellipsis;max-width:100px';
        const dx=document.createElement('button'); dx.className='agenda-note-del'; dx.textContent='×';
        dx.addEventListener('click',ev=>{ev.stopPropagation();openNoteModal(dateStr,note.id,()=>renderAgenda());});
        np.append(tx,dx); sesWrap.appendChild(np);
      });
      const addNoteBtn=document.createElement('button'); addNoteBtn.className='agenda-add-note-btn'; addNoteBtn.textContent='+'; addNoteBtn.title='Ajouter une note';
      addNoteBtn.addEventListener('click',ev=>{ev.stopPropagation();openNoteModal(dateStr,null,()=>renderAgenda());});
      dayRow.append(numEl,dowEl,hlEl,sesWrap,addNoteBtn);
      if(sessions.length) dayRow.addEventListener('click',()=>showAgendaDetail(sessions[0].id));
      daysCol.appendChild(dayRow);
    }
    block.append(mlabel,daysCol); wrap.appendChild(block);
    cur=new Date(yr,mo+1,1);
  }

  if(!_hist.length) wrap.innerHTML='<div style="padding:2rem;text-align:center;color:var(--txf)">Aucune séance enregistrée.</div>';

  split.append(wrap,detailPanel);
  main.appendChild(split);
  setTimeout(()=>wrap.scrollTop=wrap.scrollHeight,50);
}
