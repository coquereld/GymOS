<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GymOS Mobile</title>
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
::-webkit-scrollbar{display:none}

.m-app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.m-hdr{flex-shrink:0;display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;padding-top:calc(.7rem + env(safe-area-inset-top));border-bottom:1px solid var(--bord);background:var(--surf)}
.m-hdr-title{flex:1;min-width:0;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-theme-btn{flex-shrink:0;width:36px;height:36px;border-radius:999px;border:1px solid var(--bord);background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:1rem}

.m-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.9rem .8rem;padding-bottom:calc(74px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.9rem}
.m-main > *{flex-shrink:0}

.m-tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--surf2);border-top:1px solid var(--bord);z-index:90}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12rem;font-size:.5rem;font-weight:700;color:var(--txf);text-decoration:none;border:none;background:none}
.m-tab .m-tab-ic{font-size:1.05rem;line-height:1}
.m-tab.active{color:var(--prim)}

.m-welcome-title{font-size:1.2rem;font-weight:800}
.m-welcome-sub{font-size:.85rem;color:var(--txm);margin-top:.15rem}

.m-resume-card{background:linear-gradient(135deg,var(--prim),var(--primh));color:#fff;border-radius:1rem;padding:1rem 1.1rem;display:flex;align-items:center;gap:.8rem;text-decoration:none}
.m-resume-icon{width:42px;height:42px;border-radius:.7rem;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.m-resume-info{flex:1;min-width:0}
.m-resume-title{font-weight:800;font-size:.92rem}
.m-resume-sub{font-size:.75rem;opacity:.9;margin-top:.1rem}
.m-resume-arrow{font-size:1.3rem;flex-shrink:0}

.m-tile{display:flex;align-items:center;gap:.85rem;background:var(--surf);border:1px solid var(--bord);border-radius:1rem;padding:1.1rem;text-decoration:none;color:var(--tx)}
.m-tile-icon{width:52px;height:52px;border-radius:.85rem;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.m-tile-info{flex:1;min-width:0}
.m-tile-name{font-weight:800;font-size:1rem}
.m-tile-sub{font-size:.78rem;color:var(--txf);margin-top:.1rem}
.m-tile-arrow{font-size:1.3rem;color:var(--txf);flex-shrink:0}

.m-stats-row{display:flex;gap:.6rem}
.m-stat-card{flex:1;background:var(--surf);border:1px solid var(--bord);border-radius:.85rem;padding:.8rem .5rem;text-align:center}
.m-stat-val{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.m-stat-lbl{font-size:.68rem;color:var(--txf);margin-top:.15rem}

.m-pc-link{text-align:center;font-size:.78rem;color:var(--txf);text-decoration:underline;padding:.5rem 0}
</style>
</head>
<body>
<div class="m-app">
  <div class="m-hdr">
    <div class="m-hdr-title">GymOS</div>
    <button class="m-theme-btn" id="themeBtn">🌓</button>
  </div>
  <div class="m-main" id="mainArea"></div>
  <nav class="m-tabbar">
    <button class="m-tab active" id="tabAccueil"><span class="m-tab-ic">🏠</span>Accueil</button>
    <a class="m-tab" href="./Seance-mobile.html"><span class="m-tab-ic">🏋</span>Séance</a>
    <a class="m-tab" href="./Programme-mobile.html"><span class="m-tab-ic">🗓</span>Programme</a>
    <a class="m-tab" href="./Historique-mobile.html"><span class="m-tab-ic">📅</span>Historique</a>
    <a class="m-tab" href="./Corps-mobile.html"><span class="m-tab-ic">🫀</span>Corps</a>
    <a class="m-tab" href="./Exercices-mobile.html"><span class="m-tab-ic">📋</span>Exercices</a>
    <a class="m-tab" href="./index.html"><span class="m-tab-ic">🖥</span>Version PC</a>
  </nav>
</div>

<script src="db.js"></script>
<script src="gymos-utils.js"></script>
<script>
const HIST_KEY = 'gymos-historique-v1';
const CUR_KEY  = 'gymos-session-en-cours-v1';

let _historique = [];
function loadHist(){ try{ _historique=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch{ _historique=[]; } }

function fmtDuration(min){ const h=Math.floor(min/60), m=min%60; return h>0?`${h}h${String(m).padStart(2,'0')}`:`${m}min`; }

function getCurrentSessionSummary(){
  try {
    const raw = localStorage.getItem(CUR_KEY);
    if (!raw) return null;
    const S = JSON.parse(raw);
    if (S.phase !== 'session' && S.phase !== 'summary') return null;
    return S;
  } catch { return null; }
}

function render(){
  const main = document.getElementById('mainArea');
  main.innerHTML = '';

  const welcome = document.createElement('div');
  welcome.innerHTML = `<div class="m-welcome-title">Bonjour 👋</div><div class="m-welcome-sub">Que voulez-vous faire ?</div>`;
  main.appendChild(welcome);

  const cur = getCurrentSessionSummary();
  if (cur) {
    const doneSeries = (cur.exercices||[]).reduce((n,e)=>n+(e.series||[]).filter(s=>s.done).length,0);
    const totalSeries = (cur.exercices||[]).reduce((n,e)=>n+(e.series||[]).length,0);
    const dureeTxt = cur.chronoStart ? ` · ${fmtDuration(Math.round((Date.now()-cur.chronoStart)/60000))}` : '';
    const a = document.createElement('a'); a.className='m-resume-card'; a.href='./Seance-mobile.html';
    a.innerHTML = `<div class="m-resume-icon">⏱</div>
      <div class="m-resume-info">
        <div class="m-resume-title">${cur.phase==='summary'?'Séance terminée — à sauvegarder':'Séance en cours'}</div>
        <div class="m-resume-sub">${doneSeries}/${totalSeries} série(s)${dureeTxt}</div>
      </div>
      <div class="m-resume-arrow">→</div>`;
    main.appendChild(a);
  }

  const tileSeance = document.createElement('a'); tileSeance.className='m-tile'; tileSeance.href='./Seance-mobile.html';
  tileSeance.innerHTML = `<div class="m-tile-icon" style="background:#b9020722;color:#b90207">🏋</div>
    <div class="m-tile-info"><div class="m-tile-name">Séance</div><div class="m-tile-sub">Démarrer ou continuer une séance</div></div>
    <div class="m-tile-arrow">›</div>`;
  main.appendChild(tileSeance);

  const tileProg = document.createElement('a'); tileProg.className='m-tile'; tileProg.href='./Programme-mobile.html';
  tileProg.innerHTML = `<div class="m-tile-icon" style="background:#8338bb22;color:#8338bb">🗓</div>
    <div class="m-tile-info"><div class="m-tile-name">Programme</div><div class="m-tile-sub">Gérer vos programmes et séances types</div></div>
    <div class="m-tile-arrow">›</div>`;
  main.appendChild(tileProg);

  const tileHist = document.createElement('a'); tileHist.className='m-tile'; tileHist.href='./Historique-mobile.html';
  tileHist.innerHTML = `<div class="m-tile-icon" style="background:#5a9d2422;color:#5a9d24">📅</div>
    <div class="m-tile-info"><div class="m-tile-name">Historique</div><div class="m-tile-sub">Consulter les séances passées</div></div>
    <div class="m-tile-arrow">›</div>`;
  main.appendChild(tileHist);

  const tileCorps = document.createElement('a'); tileCorps.className='m-tile'; tileCorps.href='./Corps-mobile.html';
  tileCorps.innerHTML = `<div class="m-tile-icon" style="background:#01696f22;color:#01696f">🫀</div>
    <div class="m-tile-info"><div class="m-tile-name">Corps</div><div class="m-tile-sub">Catalogue anatomique des muscles</div></div>
    <div class="m-tile-arrow">›</div>`;
  main.appendChild(tileCorps);

  const tileExo = document.createElement('a'); tileExo.className='m-tile'; tileExo.href='./Exercices-mobile.html';
  tileExo.innerHTML = `<div class="m-tile-icon" style="background:#fa7b0122;color:#fa7b01">📋</div>
    <div class="m-tile-info"><div class="m-tile-name">Exercices</div><div class="m-tile-sub">Galerie, filtres et références</div></div>
    <div class="m-tile-arrow">›</div>`;
  main.appendChild(tileExo);

  const statsRow = document.createElement('div'); statsRow.className='m-stats-row';
  const nbSeances = _historique.length;
  const now = new Date(); const monthKey = now.toISOString().slice(0,7);
  const nbMois = _historique.filter(h=>(h.date||'').startsWith(monthKey)).length;
  [{val:nbSeances,lbl:'Séances au total'},{val:nbMois,lbl:'Ce mois-ci'}].forEach(({val,lbl})=>{
    const c=document.createElement('div'); c.className='m-stat-card';
    c.innerHTML=`<div class="m-stat-val">${val}</div><div class="m-stat-lbl">${lbl}</div>`;
    statsRow.appendChild(c);
  });
  main.appendChild(statsRow);

  const pcLink = document.createElement('a'); pcLink.className='m-pc-link'; pcLink.href='./index.html';
  pcLink.textContent = 'Ouvrir la version PC';
  main.appendChild(pcLink);
}

document.getElementById('themeBtn').addEventListener('click', ()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

(async function init(){
  applyTheme(localStorage.getItem('muscle-xml-theme')||'light');
  loadHist();
  const dbState = await GymDB.init();
  if (dbState === 'connected') {
    try { const h=await GymDB.read('historique.json'); if(Array.isArray(h)){ _historique=h; localStorage.setItem(HIST_KEY,JSON.stringify(h)); } } catch{}
  }
  render();
})();
</script>
</body>
</html>
