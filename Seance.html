<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymOS — Séance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    :root,[data-theme="light"]{
      --bg:#f7f6f2;--surf:#f9f8f5;--surf2:#fbfbf9;--surfoff:#f3f0ec;--bord:#d4d1ca;
      --tx:#28251d;--txm:#6e6b64;--txf:#9a9891;
      --prim:#01696f;--primh:#0c4e54;--primhi:#cedcd8;
      --ok:#437a22;--warn:#964219;--err:#a12c7b;
      --rsm:.375rem;--rmd:.5rem;--rlg:.75rem;--rxl:1rem;
      --shsm:0 1px 3px rgba(40,37,29,.08);--shmd:0 12px 32px rgba(40,37,29,.14);
      --tr:180ms cubic-bezier(.16,1,.3,1);--font:'Satoshi',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --bg:#131211;--surf:#1a1918;--surf2:#1e1d1b;--surfoff:#222120;--bord:#333230;
      --tx:#d0cfcd;--txm:#9e9d9a;--txf:#6e6c68;
      --prim:#4f98a3;--primh:#227f8b;--primhi:#1a2e30;
      --shsm:0 1px 3px rgba(0,0,0,.3);--shmd:0 12px 32px rgba(0,0,0,.5);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--tx);font-size:clamp(15px,1.5vw,17px)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer} a{color:inherit;text-decoration:none}

    /* ── LAYOUT ── */
    .app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;height:100dvh;overflow:hidden}
    .sidebar{grid-row:1/-1;background:linear-gradient(180deg,var(--surf),var(--surf2));border-right:1px solid var(--bord);display:flex;flex-direction:column;overflow:hidden}
    .hdr{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--bord);background:color-mix(in oklab,var(--surf) 92%,transparent);backdrop-filter:blur(10px)}
    .main{overflow-y:auto;padding:1.5rem}

    /* ── SIDEBAR ── */
    .brand{display:flex;align-items:center;gap:.75rem;padding:1rem;border-bottom:1px solid var(--bord);flex-shrink:0}
    .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--primhi);color:var(--prim);flex-shrink:0;cursor:pointer}
    .logo svg{width:20px;height:20px}
    .sb-inner{flex:1;overflow-y:auto;padding:.75rem}
    .sb-footer{padding:.75rem;border-top:1px solid var(--bord);flex-shrink:0}

    /* Chrono sidebar */
    .sb-chrono{
      background:color-mix(in oklab,var(--prim) 8%,var(--surf));
      border:1px solid color-mix(in oklab,var(--prim) 25%,var(--bord));
      border-radius:var(--rxl);padding:.75rem 1rem;margin-bottom:.75rem;
      display:flex;align-items:center;gap:.75rem;
    }
    .sb-chrono-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--prim);color:#fff;flex-shrink:0}
    .sb-chrono-icon svg{width:16px;height:16px}
    .sb-chrono-time{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--prim)}
    .sb-chrono-label{font-size:.65rem;color:var(--txm);text-transform:uppercase;letter-spacing:.06em}

    /* Progress liste exercices sidebar */
    .sb-exo-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--txf);margin-bottom:.4rem;padding:0 .25rem}
    .sb-exo-item{
      display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;
      border-radius:var(--rmd);cursor:pointer;transition:all var(--tr);
      font-size:.8rem;
    }
    .sb-exo-item:hover{background:var(--surfoff)}
    .sb-exo-item.done{opacity:.5}
    .sb-exo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .sb-exo-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
    .sb-exo-prog{font-size:.7rem;color:var(--txm);flex-shrink:0;font-weight:600}

    /* ── HEADER ── */
    .hdr-title{font-size:1.1rem;font-weight:700;flex:1}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:40px;padding:.6rem .9rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf2);color:var(--tx);transition:all var(--tr);font-size:.875rem;font-weight:500}
    .btn:hover:not(:disabled){background:var(--surfoff)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-p{background:var(--prim);color:#fff;border-color:transparent}
    .btn-p:hover:not(:disabled){background:var(--primh)}
    .btn-sm{min-height:34px;padding:.4rem .75rem;font-size:.8rem}
    .btn-icon{width:40px;height:40px;padding:0;flex-shrink:0}
    .btn-icon svg{width:18px;height:18px}
    .btn-danger{background:#a12c7b;color:#fff;border-color:transparent}
    .btn-danger:hover:not(:disabled){background:#8a2268}
    [data-theme="dark"] .btn-danger{background:#e060b8;color:#1a0a15}

    /* ── PHASE CHOIX ── */
    .choice-wrap{max-width:680px;margin:0 auto;display:grid;gap:1.5rem}
    .choice-title{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;letter-spacing:-.03em}
    .choice-sub{color:var(--txm);margin-top:.25rem}
    .choice-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:1.25rem;box-shadow:var(--shsm)}
    .choice-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--txf);margin-bottom:.75rem}
    .prog-select{padding:.65rem .85rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);width:100%;font-size:.9rem;outline:none;transition:border-color var(--tr);min-height:42px}
    .prog-select:focus{border-color:var(--prim)}
    .seance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.65rem;margin-top:.75rem}
    .seance-pick-card{
      border:2px solid var(--bord);border-radius:var(--rlg);padding:.75rem;
      cursor:pointer;transition:all var(--tr);background:var(--surf2);
      display:flex;flex-direction:column;gap:.35rem;
    }
    .seance-pick-card:hover{border-color:var(--sc-color,var(--prim));transform:translateY(-1px)}
    .seance-pick-card.active{border-color:var(--sc-color,var(--prim));background:color-mix(in oklab,var(--sc-color,var(--prim)) 7%,var(--surf))}
    .spc-type{font-size:.6rem;font-weight:700;padding:.15rem .45rem;border-radius:999px;white-space:nowrap;display:inline-block;margin-bottom:.1rem}
    .spc-name{font-size:.85rem;font-weight:700;color:var(--tx)}
    .spc-info{font-size:.7rem;color:var(--txm)}
    .libre-btn{
      display:flex;align-items:center;gap:.6rem;padding:.85rem 1rem;
      border:1px dashed var(--bord);border-radius:var(--rlg);
      background:transparent;color:var(--txm);cursor:pointer;width:100%;
      transition:all var(--tr);font-size:.85rem;font-weight:600;margin-top:.5rem;
    }
    .libre-btn:hover{border-color:var(--prim);color:var(--prim);background:var(--primhi)}
    .libre-btn svg{width:16px;height:16px}

    /* ── PHASE SESSION ── */
    .session-wrap{display:grid;gap:1rem;max-width:760px;margin:0 auto}
    .session-hdr{
      background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);
      padding:.85rem 1.25rem;display:flex;align-items:center;gap:.75rem;
      box-shadow:var(--shsm);
    }
    .sh-type-badge{font-size:.65rem;font-weight:800;padding:.25rem .65rem;border-radius:999px;white-space:nowrap}
    .sh-name{font-size:1rem;font-weight:700;flex:1}
    .sh-meta{font-size:.75rem;color:var(--txm)}

    /* Carte exercice */
    .exo-card{
      background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);
      overflow:hidden;box-shadow:var(--shsm);
      border-left:4px solid var(--ec-color,var(--bord));
    }
    .exo-card-hdr{
      display:flex;align-items:center;gap:.65rem;
      padding:.75rem 1rem;
      background:color-mix(in oklab,var(--ec-color,var(--prim)) 5%,var(--surf));
      border-bottom:1px solid var(--bord);
    }
    .exo-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .exo-card-name{font-weight:700;font-size:.9rem;flex:1}
    .exo-ref-badge{font-size:.65rem;color:var(--txm);background:var(--surfoff);padding:.2rem .5rem;border-radius:999px;white-space:nowrap;border:1px solid var(--bord)}
    .exo-card-done-badge{font-size:.62rem;font-weight:700;padding:.15rem .45rem;border-radius:999px;background:rgba(67,122,34,.12);color:var(--ok);border:1px solid rgba(67,122,34,.25)}
    [data-theme="dark"] .exo-card-done-badge{background:rgba(106,191,58,.15);color:#6abf3a}

    /* Table séries */
    .series-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:480px}
    .series-table th{padding:.45rem .65rem;text-align:left;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txm);background:var(--surfoff);border-bottom:1px solid var(--bord)}
    .series-table td{padding:.4rem .65rem;border-bottom:1px solid var(--bord);vertical-align:middle}
    .series-table tr:last-child td{border-bottom:none}
    .series-table tr.done-row td{background:color-mix(in oklab,var(--ok) 4%,var(--surf))}
    .series-table-wrap{overflow-x:auto}

    /* Image exercice dans header carte */
    .exo-card-img{width:56px;height:56px;object-fit:contain;border-radius:.5rem;background:var(--surfoff);border:1px solid var(--bord);padding:3px;flex-shrink:0}
    .exo-card-img-ph{width:56px;height:56px;border-radius:.5rem;background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center;flex-shrink:0}
    .exo-card-img-ph svg{width:22px;height:22px}

    /* Ressenti */
    .ressenti-sel{
      padding:.3rem .5rem;border-radius:var(--rmd);
      border:1px solid var(--bord);background:var(--surf);
      color:var(--tx);font-size:.78rem;cursor:pointer;
      outline:none;font-family:inherit;min-width:120px;
      transition:border-color var(--tr);
    }
    .ressenti-sel:focus{border-color:var(--prim)}
    .ressenti-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .55rem;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
    .serie-num{width:28px;font-weight:700;color:var(--txf);text-align:center}
    .serie-input{
      width:70px;padding:.35rem .5rem;border-radius:var(--rsm);
      border:1px solid var(--bord);background:var(--surf);color:var(--tx);
      font-size:.82rem;text-align:center;outline:none;
      transition:border-color var(--tr);font-weight:600;
    }
    .serie-input:focus{border-color:var(--prim)}
    .serie-input.done{background:var(--surfoff);color:var(--txm);border-color:transparent}
    .serie-ref{font-size:.7rem;color:var(--txf);text-align:center}
    .check-btn{
      width:32px;height:32px;border-radius:50%;border:2px solid var(--bord);
      background:transparent;cursor:pointer;display:grid;place-items:center;
      transition:all var(--tr);color:var(--txf);flex-shrink:0;
    }
    .check-btn:hover{border-color:var(--ok);color:var(--ok)}
    .check-btn.checked{border-color:var(--ok);background:var(--ok);color:#fff}
    .check-btn svg{width:14px;height:14px}

    /* Footer carte exercice */
    .exo-card-footer{padding:.65rem 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--surf2)}
    .add-serie-btn{display:flex;align-items:center;gap:.35rem;padding:.35rem .75rem;border-radius:var(--rmd);border:1px dashed var(--bord);background:transparent;color:var(--txm);font-size:.78rem;font-weight:600;cursor:pointer;transition:all var(--tr)}
    .add-serie-btn:hover{border-color:var(--prim);color:var(--prim)}
    .add-serie-btn svg{width:13px;height:13px}
    .note-field{
      flex:1;min-width:120px;padding:.35rem .6rem;border-radius:var(--rmd);
      border:1px solid var(--bord);background:var(--surf);color:var(--tx);
      font-size:.75rem;outline:none;transition:border-color var(--tr);
    }
    .note-field:focus{border-color:var(--prim)}

    /* ── PHASE RÉSUMÉ ── */
    .summary-wrap{max-width:680px;margin:0 auto;display:grid;gap:1.25rem}
    .summary-hdr{text-align:center;padding:1rem}
    .summary-icon{width:64px;height:64px;border-radius:50%;background:rgba(67,122,34,.12);border:2px solid rgba(67,122,34,.3);display:grid;place-items:center;margin:0 auto 1rem;color:var(--ok)}
    .summary-icon svg{width:32px;height:32px}
    .summary-title{font-size:1.5rem;font-weight:700}
    .summary-sub{color:var(--txm);font-size:.85rem;margin-top:.3rem}
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
    .stat-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rlg);padding:.85rem;text-align:center;box-shadow:var(--shsm)}
    .stat-value{font-size:1.4rem;font-weight:700;color:var(--prim)}
    .stat-label{font-size:.65rem;color:var(--txm);text-transform:uppercase;letter-spacing:.06em;margin-top:.2rem}
    .exo-recap{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--shsm)}
    .exo-recap-row{display:flex;align-items:center;gap:.75rem;padding:.65rem 1rem;border-bottom:1px solid var(--bord)}
    .exo-recap-row:last-child{border-bottom:none}
    .exo-recap-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .exo-recap-name{flex:1;font-size:.85rem;font-weight:600}
    .exo-recap-info{font-size:.75rem;color:var(--txm);text-align:right}
    .pr-badge{font-size:.6rem;font-weight:700;padding:.1rem .35rem;border-radius:999px;background:rgba(250,123,1,.15);color:#fa7b01;border:1px solid rgba(250,123,1,.3);margin-left:.35rem}
    .note-area{width:100%;padding:.65rem .85rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);font-size:.85rem;line-height:1.55;resize:vertical;min-height:80px;outline:none;transition:border-color var(--tr)}
    .note-area:focus{border-color:var(--prim)}
    .summary-actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;padding:.5rem 0}

    /* ── Picker exercice (même style que Programme) ── */
    .exo-pick{position:relative;user-select:none}
    .exo-pick-trigger{display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);cursor:pointer;transition:border-color var(--tr);min-height:44px;min-width:0;overflow:hidden}
    .exo-pick.open .exo-pick-trigger{border-color:var(--prim)}
    .exo-pick-search{flex:1;border:none;outline:none;background:transparent;color:var(--tx);font-size:.88rem;font-family:inherit;min-width:0}
    .exo-pick-arrow{width:16px;height:16px;flex-shrink:0;color:var(--txf);transition:transform var(--tr)}
    .exo-pick.open .exo-pick-arrow{transform:rotate(180deg)}
    .exo-pick-prev{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
    .epp-img{width:32px;height:32px;border-radius:.35rem;object-fit:contain;background:var(--surfoff);border:1px solid var(--bord);padding:2px;flex-shrink:0}
    .epp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .exo-pick-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:400;background:var(--surf);border:1px solid var(--bord);border-radius:var(--rlg);box-shadow:var(--shmd);max-height:260px;overflow-y:auto;display:none}
    .exo-pick.open .exo-pick-list{display:block}
    .epi{display:flex;align-items:center;gap:.6rem;padding:.5rem .75rem;cursor:pointer;transition:background var(--tr);border-bottom:1px solid var(--bord)}
    .epi:last-child{border-bottom:none}
    .epi:hover,.epi.active{background:color-mix(in oklab,var(--prim) 6%,var(--surf))}
    .epi-img{width:36px;height:36px;border-radius:.4rem;object-fit:contain;background:var(--surfoff);border:1px solid var(--bord);flex-shrink:0;padding:2px}
    .epi-ph{width:36px;height:36px;border-radius:.4rem;background:var(--surfoff);border:1px solid var(--bord);display:grid;place-items:center;flex-shrink:0}
    .epi-ph svg{width:16px;height:16px}
    .epi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .epi-info{flex:1;min-width:0}
    .epi-name{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
    .epi-grp{font-size:.68rem;color:var(--txm)}
    .epi-empty{padding:.75rem;text-align:center;color:var(--txf);font-size:.8rem}
    /* Bouton groupe affiché */
    .exo-grp-badge{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:999px;font-size:.72rem;font-weight:700;margin-top:.3rem}
    /* Boutons déplacement sur carte */
    .exo-move-btn{width:26px;height:26px;border-radius:.4rem;border:1px solid var(--bord);background:var(--surfoff);cursor:pointer;display:grid;place-items:center;color:var(--txm);transition:all var(--tr);padding:0;flex-shrink:0}
    .exo-move-btn:hover{background:var(--surf);color:var(--tx);border-color:var(--prim)}
    .exo-move-btn:disabled{opacity:.3;cursor:not-allowed}
    .exo-move-btn svg{width:13px;height:13px}
    .del-serie-btn{width:24px;height:24px;border-radius:.35rem;border:none;background:none;cursor:pointer;display:grid;place-items:center;color:var(--txf);transition:color var(--tr);padding:0;flex-shrink:0}
    .del-serie-btn:hover{color:var(--err)}
    .del-serie-btn svg{width:12px;height:12px}
    /* Historique séances */
    .hist-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--shsm)}
    .hist-row{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--bord);transition:background var(--tr)}
    .hist-row:last-child{border-bottom:none}
    .hist-row:hover{background:var(--surfoff)}
    .hist-date{font-size:.7rem;color:var(--txm);min-width:76px;flex-shrink:0}
    .hist-name{flex:1;min-width:0}
    .hist-seance{font-size:.82rem;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hist-prog{font-size:.68rem;color:var(--txm)}
    .hist-stats{display:flex;gap:.35rem;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
    .hist-stat{font-size:.65rem;padding:.15rem .4rem;border-radius:999px;background:var(--surfoff);color:var(--txm);border:1px solid var(--bord)}
    /* Image exercice cliquable */
    .exo-card-img,.exo-card-img-ph{cursor:zoom-in;transition:opacity var(--tr)}
    .exo-card-img:hover,.exo-card-img-ph:hover{opacity:.82}
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
    .ov.open{opacity:1;pointer-events:all}
    .modal{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rxl);padding:1.5rem;width:min(440px,92vw);box-shadow:var(--shmd);transform:translateY(8px);transition:transform .18s;max-height:90dvh;overflow-y:auto}
    .ov.open .modal{transform:translateY(0)}
    .modal-title{font-weight:700;font-size:1rem;margin-bottom:1rem}
    .fld{display:grid;gap:.4rem;margin-bottom:.85rem}
    .fld label{font-size:.78rem;font-weight:600;color:var(--txm)}
    .fld input,.fld select,.fld textarea{padding:.55rem .75rem;border-radius:var(--rmd);border:1px solid var(--bord);background:var(--surf);color:var(--tx);width:100%;outline:none;font:inherit;transition:border-color var(--tr)}
    .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--prim)}
    .modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.5rem}

    /* ── RESPONSIVE ── */
    @media(max-width:900px){
      .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
      .sidebar{grid-row:auto;max-height:160px;border-right:none;border-bottom:1px solid var(--bord)}
      .sb-inner{display:flex;gap:.5rem;flex-wrap:wrap;flex-direction:row;align-items:center}
      .stat-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">

<script src="db.js"></script>
<script src="gymos-utils.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
// CONSTANTES & COULEURS
// ══════════════════════════════════════════════════════════════
const PROG_KEY = 'gymos-programmes-v2';
const EXO_KEY  = 'exercices-studio-autosave-v2';
const RESSENTI = [
  { key:'bien',      emoji:'😊', label:'Bien',      bg:'rgba(67,122,34,.18)',  color:'#437a22' },
  { key:'dur',       emoji:'😤', label:'Dur',       bg:'rgba(150,66,25,.18)',  color:'#964219' },
  { key:'tres_dur',  emoji:'😰', label:'Très dur',  bg:'rgba(161,44,123,.18)', color:'#a12c7b' },
  { key:'super_dur', emoji:'💀', label:'Super dur', bg:'rgba(40,37,29,.12)',   color:'#28251d' },
];
function getExoImage(nom) {
  try {
    const rows = JSON.parse(localStorage.getItem(EXO_KEY)||'{}').rows||[];
    const e = rows.find(x => x.exercice?.toLowerCase() === nom?.toLowerCase());
    return e ? (e.image||'') : '';
  } catch { return ''; }
}
const OBJ_KEY  = 'exercices-objectifs-v1';
const HIST_KEY = 'gymos-historique-v1';
const CUR_KEY  = 'gymos-session-en-cours-v1';

// ══════════════════════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════════════════════
const S = {
  phase: 'choice',     // 'choice' | 'session' | 'summary'
  progId: null,
  seanceId: null,
  libre: false,
  dateDebut: null,     // Date ISO
  chronoStart: null,   // Date.now()
  exercices: [],       // [{id, nom, groupe, refSeries, refReps, refPoids, refRecup, series:[{reps,poids,done}], note}]
  noteGlobale: '',
  dureeMin: 0,
};
let _chronoInterval = null;
let _timerTimeout   = null;
let _timerInterval  = null;
let _timerTotal     = 0;
let _timerEnd       = 0;
let _programmes     = [];
let _exoLib         = [];
let _objectifs      = {};
let _historique     = [];

// ══════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════
const tc   = t  => TC[t] || '#9a9891';
function fmtDuration(ms) {
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  return h>0 ? `${h}h${String(m%60).padStart(2,'0')}` : `${m}min${String(s%60).padStart(2,'0')}`;
}
function fmtChrono(ms) {
  const s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000)%60, h=Math.floor(ms/3600000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function parseRecup(v) {
  if (!v) return 90;
  const n = parseInt(String(v).replace(/[^0-9]/g,''));
  return isNaN(n) ? 90 : n;
}
function getLatestRef(nom) {
  try {
    const row = _exoLib.find(e => e.exercice?.toLowerCase()===nom.toLowerCase());
    if (!row) return null;
    const entries = _objectifs[row.id];
    if (!entries?.length) return null;
    return entries.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  } catch { return null; }
}
function computeVolume(exos) {
  return exos.reduce((tot,e) => tot + e.series.filter(s=>s.done).reduce((v,s)=>{
    const p=parseFloat(s.poids)||0, r=parseInt(s.reps)||0; return v+p*r;
  },0), 0);
}

// ══════════════════════════════════════════════════════════════
// PERSISTANCE
// ══════════════════════════════════════════════════════════════
function loadData() {
  try { _programmes = JSON.parse(localStorage.getItem(PROG_KEY)||'[]'); } catch { _programmes=[]; }
  try { _exoLib = JSON.parse(localStorage.getItem(EXO_KEY)||'{}').rows||[]; } catch { _exoLib=[]; }
  try { _objectifs = JSON.parse(localStorage.getItem(OBJ_KEY)||'{}'); } catch { _objectifs={}; }
  try { _historique = JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); } catch { _historique=[]; }
}
function saveHistorique() {
  localStorage.setItem(HIST_KEY, JSON.stringify(_historique));
  GymDB.write('historique.json', _historique);
}
function saveCurrentSession() {
  if (S.phase === 'session') localStorage.setItem(CUR_KEY, JSON.stringify(S));
  else localStorage.removeItem(CUR_KEY);
}
function loadCurrentSession() {
  try {
    const raw = localStorage.getItem(CUR_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (saved.phase === 'session') { Object.assign(S, saved); return true; }
  } catch {}
  return false;
}

// ══════════════════════════════════════════════════════════════
// CHRONO TOTAL
// ══════════════════════════════════════════════════════════════
function startChrono() {
  stopChrono();
  _chronoInterval = setInterval(updateChrono, 1000);
}
function stopChrono() {
  if (_chronoInterval) clearInterval(_chronoInterval);
}
function updateChrono() {
  const el = document.getElementById('sbChronoTime');
  if (el && S.chronoStart) el.textContent = fmtChrono(Date.now() - S.chronoStart);
}

// ══════════════════════════════════════════════════════════════
// TIMER RÉCUPÉRATION (supprimé — fonctions conservées en no-op)
// ══════════════════════════════════════════════════════════════
function startTimer() {}
function stopTimer() {}

// ══════════════════════════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════════════════════════
function renderSidebar() {
  const inner = document.getElementById('sbInner');
  document.getElementById('sfHistCount').textContent = _historique.length + ' séance' + (_historique.length!==1?'s':'');

  if (S.phase === 'choice') {
    document.getElementById('sbSubtitle').textContent = '—';
    inner.innerHTML = '<div style="color:var(--txf);font-size:.8rem;text-align:center;padding:1rem;width:100%">Choisissez une séance pour démarrer</div>';
    return;
  }

  const seance = getSeance();
  document.getElementById('sbSubtitle').textContent = seance?.nom || 'Séance libre';
  inner.innerHTML = '';

  // Chrono
  const chrono = document.createElement('div'); chrono.className='sb-chrono';
  const chronoStart = Date.now() - (S.chronoStart ? Date.now() - S.chronoStart : 0);
  chrono.innerHTML = `<div class="sb-chrono-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
    <div><div class="sb-chrono-time" id="sbChronoTime">${fmtChrono(S.chronoStart ? Date.now()-S.chronoStart : 0)}</div><div class="sb-chrono-label">Durée de séance</div></div>`;
  inner.appendChild(chrono);

  if (!S.exercices.length) return;

  // Liste exercices
  const lbl = document.createElement('div'); lbl.className='sb-exo-label'; lbl.textContent='Exercices'; inner.appendChild(lbl);
  S.exercices.forEach((e,i) => {
    const done = e.series.filter(s=>s.done).length;
    const total = e.series.length;
    const allDone = done === total && total > 0;
    const item = document.createElement('div');
    item.className = 'sb-exo-item' + (allDone?' done':'');
    const dot = document.createElement('span'); dot.className='sb-exo-dot'; dot.style.background=grpc(e.groupe);
    const name = document.createElement('span'); name.className='sb-exo-name'; name.textContent=e.nom;
    const prog = document.createElement('span'); prog.className='sb-exo-prog'; prog.textContent=`${done}/${total}`;
    item.append(dot,name,prog);
    item.addEventListener('click', ()=>{ document.getElementById(`exo-card-${i}`)?.scrollIntoView({behavior:'smooth',block:'center'}); });
    inner.appendChild(item);
  });
}

// ══════════════════════════════════════════════════════════════
// DONNÉES PROGRAMME
// ══════════════════════════════════════════════════════════════
function getProg()   { return _programmes.find(p=>p.id===S.progId); }
function getSeance() { return getProg()?.seances?.find(s=>s.id===S.seanceId); }

function buildExercicesFromSeance(seance) {
  return (seance?.exercices||[]).map(e => {
    const ref = getLatestRef(e.nom);
    const nbSeries = parseInt(e.series)||3;
    return {
      id: uid(), nom: e.nom, groupe: e.groupe||'',
      image: e.image || getExoImage(e.nom),
      refSeries: e.series||'3', refReps: e.reps||'', refPoids: e.poids||'',
      refDuree: e.duree||'', refDistance: e.distance||'',
      refRecup: e.recup||(ref?.recup||'90 s'),
      series: Array.from({length:nbSeries},(_,i)=>({
        num:i+1, reps: ref?.reps||e.reps||'', poids: ref?.poids||e.poids||'',
        duree:'', distance:'', done:false, ressenti:''
      })),
      note: '',
    };
  });
}

// ══════════════════════════════════════════════════════════════
// RENDER MAIN
// ══════════════════════════════════════════════════════════════
function render() {
  renderSidebar();
  const main = document.getElementById('mainArea');
  if (S.phase==='choice')  { renderChoice(main); return; }
  if (S.phase==='session') { renderSession(main); if(S.chronoStart) startChrono(); return; }
  if (S.phase==='summary') { renderSummary(main); return; }
}

// ─── PHASE CHOIX ─────────────────────────────────────────────
function renderChoice(main) {
  stopChrono();
  document.getElementById('hdrTitle').textContent = 'Nouvelle séance';
  main.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='choice-wrap';

  const titleBlock = document.createElement('div');
  titleBlock.innerHTML = `<div class="choice-title">Quelle séance aujourd'hui ?</div><div class="choice-sub">Choisissez un programme ou lancez une séance libre.</div>`;
  wrap.appendChild(titleBlock);

  const actifs = _programmes.filter(p=>p.statut==='actif');

  if (actifs.length) {
    const card = document.createElement('div'); card.className='choice-card';
    const cardTitle = document.createElement('div'); cardTitle.className='choice-section-title'; cardTitle.textContent='Depuis un programme';
    const sel = document.createElement('select'); sel.className='prog-select';
    sel.innerHTML = '<option value="">— Choisir un programme —</option>' + actifs.map(p=>`<option value="${esc(p.id)}">${esc(p.nom)}</option>`).join('');
    sel.value = S.progId||'';

    const seanceGrid = document.createElement('div'); seanceGrid.className='seance-grid'; seanceGrid.id='seanceGrid';

    function refreshSeances() {
      const prog = actifs.find(p=>p.id===sel.value);
      S.progId = sel.value||null; S.seanceId=null;
      seanceGrid.innerHTML = '';
      if (!prog?.seances?.length) return;
      prog.seances.forEach(s => {
        const hex = tc(s.type);
        const [r,g,b]=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
        const c=document.createElement('div'); c.className='seance-pick-card'; c.style.setProperty('--sc-color',hex);
        if(s.id===S.seanceId) c.classList.add('active');
        c.innerHTML=`<span class="spc-type" style="background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.35)">${esc(s.type)}</span>
          <div class="spc-name">${esc(s.nom)}</div>
          <div class="spc-info">${s.exercices?.length||0} exercices${s.jours?.length?' · '+s.jours.slice(0,2).join(', '):''}</div>`;
        c.addEventListener('click',()=>{
          seanceGrid.querySelectorAll('.seance-pick-card').forEach(x=>x.classList.remove('active'));
          c.classList.add('active'); S.seanceId=s.id;
          startBtn.disabled=false;
        });
        seanceGrid.appendChild(c);
      });
    }
    sel.addEventListener('change', refreshSeances);
    card.append(cardTitle, sel, seanceGrid);
    wrap.appendChild(card);
    refreshSeances();
  }

  const libreCard = document.createElement('div'); libreCard.className='choice-card';
  const libreCardTitle = document.createElement('div'); libreCardTitle.className='choice-section-title'; libreCardTitle.textContent='Séance libre';
  const libreBtn = document.createElement('button'); libreBtn.className='libre-btn';
  libreBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Créer une séance personnalisée`;
  libreBtn.addEventListener('click', startLibre);
  libreCard.append(libreCardTitle, libreBtn);
  wrap.appendChild(libreCard);

  const startBtn = document.createElement('button');
  startBtn.className='btn btn-p'; startBtn.style.cssText='width:100%;min-height:48px;font-size:1rem;font-weight:700';
  startBtn.textContent='Démarrer la séance →';
  startBtn.disabled = !S.seanceId;
  startBtn.addEventListener('click', startSession);
  wrap.appendChild(startBtn);

  // ── Historique des séances terminées ──
  if (_historique.length) {
    const histTitle = document.createElement('div');
    histTitle.style.cssText = 'font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txf);margin-top:.5rem';
    histTitle.textContent = `Séances enregistrées (${_historique.length})`;
    wrap.appendChild(histTitle);

    const histCard = document.createElement('div'); histCard.className='hist-card';
    _historique.slice(0, 20).forEach(h => {
      const tc = TC[h.seanceType] || '#9a9891';
      const [r,g,b] = [parseInt(tc.slice(1,3),16),parseInt(tc.slice(3,5),16),parseInt(tc.slice(5,7),16)];
      const row = document.createElement('div'); row.className='hist-row';
      const dateEl = document.createElement('div'); dateEl.className='hist-date';
      const d = new Date(h.date+'T00:00');
      dateEl.innerHTML=`<div style="font-weight:600;color:var(--tx)">${d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div><div>${h.heure||''}</div>`;
      const nameEl = document.createElement('div'); nameEl.className='hist-name';
      nameEl.innerHTML=`<div class="hist-seance">${esc(h.seanceNom)}</div><div class="hist-prog">${esc(h.programmeNom)}</div>`;
      const stats = document.createElement('div'); stats.className='hist-stats';
      const dot=document.createElement('span'); dot.className='hist-type-dot'; dot.style.background=tc;
      const nbSeries=h.exercices?.reduce((n,e)=>n+(e.series?.length||0),0)||0;
      const statItems=[
        h.dureeMin?`${h.dureeMin} min`:'',
        nbSeries?`${nbSeries} séries`:'',
        h.volumeTotal>0?`${h.volumeTotal}kg`:'',
      ].filter(Boolean);
      statItems.forEach(s=>{ const sp=document.createElement('span'); sp.className='hist-stat'; sp.textContent=s; stats.appendChild(sp); });
      row.append(dot,dateEl,nameEl,stats);
      histCard.appendChild(row);
    });
    wrap.appendChild(histCard);
  }

  main.appendChild(wrap);
}

// ─── PHASE SESSION ────────────────────────────────────────────
function renderSession(main) {
  document.getElementById('hdrTitle').textContent = S.libre ? 'Séance libre' : (getSeance()?.nom || 'Séance');
  main.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='session-wrap';

  // Header séance
  const seance = getSeance();
  const prog   = getProg();
  const hex    = tc(seance?.type || 'Autre');
  const [r,g,b]= [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];

  if (!S.libre) {
    const shdr = document.createElement('div'); shdr.className='session-hdr';
    shdr.innerHTML=`<span class="sh-type-badge" style="background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.3)">${esc(seance?.type||'Libre')}</span>
      <div><div class="sh-name">${esc(seance?.nom||'')}</div><div class="sh-meta">${esc(prog?.nom||'')}</div></div>`;
    const abortBtn=document.createElement('button'); abortBtn.className='btn btn-sm'; abortBtn.textContent='Abandonner';
    abortBtn.style.marginLeft='auto';
    abortBtn.addEventListener('click', ()=>{ if(confirm('Abandonner la séance ? Les données seront perdues.')) abortSession(); });
    shdr.appendChild(abortBtn);
    wrap.appendChild(shdr);
  }

  // Bouton ajout exercice (séance libre ou toujours)
  const addExoBar=document.createElement('div'); addExoBar.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap';
  const addTitle=document.createElement('div'); addTitle.style.cssText='font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txf)';
  addTitle.textContent='Exercices de la séance';
  const addBtn=document.createElement('button'); addBtn.className='btn btn-sm';
  addBtn.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Ajouter un exercice`;
  addBtn.addEventListener('click', openLibreModal);
  addExoBar.append(addTitle, addBtn); wrap.appendChild(addExoBar);

  // Cards exercices
  if (!S.exercices.length) {
    const empty=document.createElement('div'); empty.style.cssText='text-align:center;padding:2rem;color:var(--txf);font-size:.9rem;background:var(--surf);border:1px dashed var(--bord);border-radius:var(--rxl)';
    empty.textContent='Aucun exercice. Cliquez sur "+ Ajouter un exercice".'; wrap.appendChild(empty);
  } else {
    S.exercices.forEach((exo,ei) => {
      wrap.appendChild(buildExoCard(exo, ei));
    });
  }

  // Terminer
  const finBtn=document.createElement('button'); finBtn.className='btn btn-p';
  finBtn.style.cssText='width:100%;min-height:48px;font-size:1rem;font-weight:700;margin-top:.5rem';
  finBtn.textContent='Terminer la séance ✓';
  finBtn.addEventListener('click', finishSession);
  wrap.appendChild(finBtn);
  main.appendChild(wrap);
}

function buildExoCard(exo, ei) {
  const hex = grpc(exo.groupe);
  const card=document.createElement('div'); card.className='exo-card'; card.id=`exo-card-${ei}`;
  card.style.setProperty('--ec-color',hex);

  // Header avec image
  const hdr=document.createElement('div'); hdr.className='exo-card-hdr';

  // Image miniature (cliquable → info exercice)
  const imgSrc = exo.image || getExoImage(exo.nom);
  if (imgSrc) {
    const img=document.createElement('img'); img.className='exo-card-img';
    img.src='./img/'+imgSrc; img.alt=exo.nom; img.title='Voir les informations';
    img.onerror=()=>img.replaceWith(makePh(hex, exo.nom));
    img.addEventListener('click',()=>openSeaExoInfo(exo.nom));
    hdr.appendChild(img);
  } else {
    const ph=makePh(hex, exo.nom);
    ph.title='Voir les informations';
    ph.addEventListener('click',()=>openSeaExoInfo(exo.nom));
    hdr.appendChild(ph);
  }

  const dot=document.createElement('span'); dot.className='exo-color-dot'; dot.style.background=hex;
  const name=document.createElement('span'); name.className='exo-card-name'; name.textContent=exo.nom;
  const doneCount=exo.series.filter(s=>s.done).length;
  const ref=document.createElement('span'); ref.className='exo-ref-badge';
  const refParts=[
    exo.refSeries&&`${exo.refSeries} séries`,
    exo.refReps&&`${exo.refReps} reps`,
    exo.refPoids&&`${exo.refPoids} kg`,
    exo.refDuree&&`${exo.refDuree}`,
    exo.refDistance&&`${exo.refDistance}`,
  ].filter(Boolean);
  ref.textContent=refParts.join(' · ')||'Pas de référence';
  const doneBadge=document.createElement('span'); doneBadge.className='exo-card-done-badge';
  doneBadge.textContent=`${doneCount}/${exo.series.length}`;
  hdr.append(dot,name,ref,doneBadge); card.appendChild(hdr);

  // Table séries avec scroll horizontal
  const tblWrap=document.createElement('div'); tblWrap.className='series-table-wrap';
  const tbl=document.createElement('table'); tbl.className='series-table';
  const hasDuree = true;  // toujours visible pour permettre la saisie
  const hasDist  = true;  // toujours visible pour permettre la saisie
  let thHtml=`<thead><tr><th style="width:32px">#</th><th>Reps</th><th>Kg</th>`;
  if(hasDuree)   thHtml+=`<th>Durée</th>`;
  if(hasDist)    thHtml+=`<th>Distance</th>`;
  thHtml+=`<th style="width:56px">Réf.</th><th>Ressenti</th><th style="width:36px"></th></tr></thead>`;
  tbl.innerHTML=thHtml;
  const tbody=document.createElement('tbody');
  exo.series.forEach((serie,si) => {
    tbody.appendChild(buildSerieRow(exo,ei,serie,si,hasDuree,hasDist));
  });
  tbl.appendChild(tbody); tblWrap.appendChild(tbl); card.appendChild(tblWrap);

  // Footer
  const footer=document.createElement('div'); footer.className='exo-card-footer';

  // Boutons déplacement ↑↓
  const moveWrap=document.createElement('div'); moveWrap.style.cssText='display:flex;gap:.25rem;flex-shrink:0';
  const upBtn=document.createElement('button'); upBtn.className='exo-move-btn'; upBtn.title='Monter';
  upBtn.disabled=ei===0;
  upBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>`;
  upBtn.addEventListener('click',()=>moveExo(ei,-1));
  const dnBtn=document.createElement('button'); dnBtn.className='exo-move-btn'; dnBtn.title='Descendre';
  dnBtn.disabled=ei===S.exercices.length-1;
  dnBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>`;
  dnBtn.addEventListener('click',()=>moveExo(ei,1));
  moveWrap.append(upBtn,dnBtn);
  const addSerie=document.createElement('button'); addSerie.className='add-serie-btn';
  addSerie.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Série`;
  addSerie.addEventListener('click', ()=>{
    const last=exo.series[exo.series.length-1]||{};
    exo.series.push({num:exo.series.length+1,reps:last.reps||'',poids:last.poids||'',duree:'',distance:'',done:false,ressenti:''});
    saveCurrentSession(); refreshExoCard(card,exo,ei);
  });
  const noteInp=document.createElement('input'); noteInp.className='note-field'; noteInp.type='text';
  noteInp.placeholder='Note…'; noteInp.value=exo.note||'';
  noteInp.addEventListener('input',()=>{ exo.note=noteInp.value; saveCurrentSession(); });
  const delBtn=document.createElement('button'); delBtn.className='btn btn-sm';
  delBtn.style.cssText='color:var(--err);border-color:var(--err)44;min-height:30px;padding:.3rem .6rem;font-size:.75rem;margin-left:auto';
  delBtn.innerHTML=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;
  delBtn.title='Supprimer cet exercice';
  delBtn.addEventListener('click',()=>{
    S.exercices.splice(ei,1); saveCurrentSession(); renderSession(document.getElementById('mainArea')); renderSidebar();
  });
  footer.append(moveWrap,addSerie,noteInp,delBtn); card.appendChild(footer);
  return card;
}

function makePh(hex, nom) {
  const [r,g,b]=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  const ph=document.createElement('div'); ph.className='exo-card-img-ph';
  ph.style.cssText=`border-color:rgba(${r},${g},${b},.3);color:rgba(${r},${g},${b},.6)`;
  ph.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 18V8.5C6 6.57 7.57 5 9.5 5h.5v14H9.5A3.5 3.5 0 0 1 6 15.5"/><path d="M18 18V8.5C18 6.57 16.43 5 14.5 5H14v14h.5a3.5 3.5 0 0 0 3.5-3.5"/></svg>`;
  return ph;
}

function buildSerieRow(exo,ei,serie,si,hasDuree,hasDist) {
  const tr=document.createElement('tr');
  if(serie.done) tr.classList.add('done-row');

  // Num
  const tdNum=document.createElement('td'); tdNum.className='serie-num'; tdNum.textContent=si+1;

  // Reps
  const tdReps=document.createElement('td');
  const ireps=document.createElement('input'); ireps.type='number'; ireps.className='serie-input'+(serie.done?' done':'');
  ireps.value=serie.reps||''; ireps.placeholder='—'; ireps.min=0; ireps.disabled=serie.done;
  ireps.addEventListener('input',()=>{ serie.reps=ireps.value; saveCurrentSession(); });
  tdReps.appendChild(ireps);

  // Poids
  const tdPoids=document.createElement('td');
  const ipoids=document.createElement('input'); ipoids.type='number'; ipoids.className='serie-input'+(serie.done?' done':'');
  ipoids.value=serie.poids||''; ipoids.placeholder='—'; ipoids.step=0.5; ipoids.min=0; ipoids.disabled=serie.done;
  ipoids.addEventListener('input',()=>{ serie.poids=ipoids.value; saveCurrentSession(); });
  tdPoids.appendChild(ipoids);

  // Durée (optionnelle)
  const tdDuree=document.createElement('td');
  if(hasDuree){
    const iduree=document.createElement('input'); iduree.type='text'; iduree.className='serie-input'+(serie.done?' done':'');
    // Pré-remplir avec la valeur de référence si le champ est vide
    iduree.value=serie.duree||(serie.done?'':exo.refDuree)||'';
    iduree.placeholder=exo.refDuree||'ex: 30 min';
    iduree.style.width='72px'; iduree.disabled=serie.done; iduree.dataset.field='duree';
    // Synchroniser immédiatement l'objet serie avec la valeur affichée
    if(!serie.duree && iduree.value) { serie.duree=iduree.value; }
    iduree.addEventListener('input',()=>{ serie.duree=iduree.value; saveCurrentSession(); });
    tdDuree.appendChild(iduree);
  }

  // Distance (optionnelle)
  const tdDist=document.createElement('td');
  if(hasDist){
    const idist=document.createElement('input'); idist.type='text'; idist.className='serie-input'+(serie.done?' done':'');
    idist.value=serie.distance||(serie.done?'':exo.refDistance)||'';
    idist.placeholder=exo.refDistance||'ex: 500m';
    idist.style.width='72px'; idist.disabled=serie.done; idist.dataset.field='distance';
    if(!serie.distance && idist.value) { serie.distance=idist.value; }
    idist.addEventListener('input',()=>{ serie.distance=idist.value; saveCurrentSession(); });
    tdDist.appendChild(idist);
  }

  // Référence
  const tdRef=document.createElement('td'); tdRef.className='serie-ref';
  tdRef.textContent=exo.refPoids?`${exo.refPoids}kg`:'—';

  // Ressenti — 4 emojis ou badge si déjà validé
  const tdRes=document.createElement('td'); tdRes.style.cssText='padding:.3rem .5rem';

  function validateWithRessenti(key) {
    // Pré-remplir reps/poids/durée/distance depuis les références si vides
    if(!serie.reps && exo.refReps) serie.reps=exo.refReps.split('-')[0]||exo.refReps;
    if(!serie.poids && exo.refPoids) serie.poids=exo.refPoids;
    if(!serie.duree && exo.refDuree) serie.duree=exo.refDuree;
    if(!serie.distance && exo.refDistance) serie.distance=exo.refDistance;
    // Lire aussi les valeurs actuelles des inputs DOM (au cas où l'event input n'aurait pas déclenché)
    const card=document.getElementById(`exo-card-${ei}`);
    if(card){
      const inputs=card.querySelectorAll('.serie-input');
      inputs.forEach(inp=>{
        if(inp.dataset.field==='duree' && inp.value) serie.duree=inp.value;
        if(inp.dataset.field==='distance' && inp.value) serie.distance=inp.value;
      });
    }
    serie.done=true; serie.ressenti=key;
    const recupSec=parseRecup(exo.refRecup);
    if(recupSec>0) startTimer(recupSec,exo.nom);
    saveCurrentSession();
    if(card) refreshExoCard(card,exo,ei);
    renderSidebar();
  }

  if(serie.done && serie.ressenti) {
    // Badge coloré cliquable pour annuler
    const r=RESSENTI.find(x=>x.key===serie.ressenti)||RESSENTI[0];
    const badge=document.createElement('span'); badge.className='ressenti-badge';
    badge.style.cssText=`background:${r.bg};color:${r.color};cursor:pointer`;
    badge.title='Cliquer pour annuler la validation';
    badge.textContent=`${r.emoji} ${r.label}`;
    badge.addEventListener('click',()=>{
      serie.done=false; serie.ressenti='';
      saveCurrentSession();
      const card=document.getElementById(`exo-card-${ei}`);
      if(card) refreshExoCard(card,exo,ei);
      renderSidebar();
    });
    tdRes.appendChild(badge);
  } else {
    // Liste déroulante
    const sel=document.createElement('select'); 
    sel.className='ressenti-sel';
    sel.innerHTML=`<option value="">— Ressenti —</option>`
      + RESSENTI.map(r=>`<option value="${r.key}">${r.emoji} ${r.label}</option>`).join('');
    sel.value='';
    sel.addEventListener('change',()=>{
      if(sel.value) validateWithRessenti(sel.value);
    });
    tdRes.appendChild(sel);
  }

  // Bouton supprimer la série
  const tdDel=document.createElement('td'); tdDel.style.cssText='padding:.2rem .4rem;text-align:center';
  const delSerieBtn=document.createElement('button'); delSerieBtn.className='del-serie-btn'; delSerieBtn.title='Supprimer cette série';
  delSerieBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  delSerieBtn.addEventListener('click',()=>{
    exo.series.splice(si,1);
    exo.series.forEach((s,i)=>s.num=i+1);
    saveCurrentSession();
    const card=document.getElementById(`exo-card-${ei}`);
    if(card) refreshExoCard(card,exo,ei);
    renderSidebar();
  });
  tdDel.appendChild(delSerieBtn);

  tr.append(tdNum,tdReps,tdPoids);
  if(hasDuree) tr.appendChild(tdDuree);
  if(hasDist)  tr.appendChild(tdDist);
  tr.append(tdRef,tdRes,tdDel);
  return tr;
}

function refreshExoCard(card,exo,ei) {
  const newCard=buildExoCard(exo,ei);
  card.replaceWith(newCard);
}

// ─── PHASE RÉSUMÉ ─────────────────────────────────────────────
function renderSummary(main) {
  stopChrono(); stopTimer();
  document.getElementById('hdrTitle').textContent = 'Récapitulatif';
  main.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='summary-wrap';
  const dureeMs=S.dureeMin*60000;
  const volume=computeVolume(S.exercices);
  const totalSeries=S.exercices.reduce((n,e)=>n+e.series.filter(s=>s.done).length,0);

  // Header
  const shdr=document.createElement('div'); shdr.className='summary-hdr';
  shdr.innerHTML=`<div class="summary-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="summary-title">Séance terminée ! 💪</div>
    <div class="summary-sub">${new Date(S.dateDebut).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>`;
  wrap.appendChild(shdr);

  // Stats
  const stats=document.createElement('div'); stats.className='stat-grid';
  [{val:fmtDuration(dureeMs),lbl:'Durée'},{val:totalSeries,lbl:'Séries'},{val:volume>0?(volume+'kg'):'-',lbl:'Volume total'}].forEach(({val,lbl})=>{
    const c=document.createElement('div'); c.className='stat-card';
    c.innerHTML=`<div class="stat-value">${val}</div><div class="stat-label">${lbl}</div>`;
    stats.appendChild(c);
  });
  wrap.appendChild(stats);

  // Exercices recap
  if (S.exercices.length) {
    const recapTitle=document.createElement('div'); recapTitle.style.cssText='font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txf)'; recapTitle.textContent='Détail des exercices';
    wrap.appendChild(recapTitle);
    const recapCard=document.createElement('div'); recapCard.className='exo-recap';
    S.exercices.forEach(e=>{
      const doneS=e.series.filter(s=>s.done);
      const maxPoids=Math.max(...doneS.map(s=>parseFloat(s.poids)||0));
      const refPoids=parseFloat(e.refPoids)||0;
      const isPR=maxPoids>refPoids&&refPoids>0;
      const row=document.createElement('div'); row.className='exo-recap-row';
      const dot=document.createElement('span'); dot.className='exo-recap-dot'; dot.style.background=grpc(e.groupe);
      const name=document.createElement('span'); name.className='exo-recap-name';
      name.innerHTML=esc(e.nom)+(isPR?'<span class="pr-badge">PR 🏆</span>':'');
      const info=document.createElement('span'); info.className='exo-recap-info';
      const vols=doneS.map(s=>`${s.reps||'?'}×${s.poids||'?'}kg`).join(', ');
      info.textContent=vols||'—';
      row.append(dot,name,info); recapCard.appendChild(row);
    });
    wrap.appendChild(recapCard);
  }

  // Note globale
  const noteBlock=document.createElement('div'); noteBlock.className='choice-card';
  const noteTitle=document.createElement('div'); noteTitle.className='choice-section-title'; noteTitle.textContent='Note globale';
  const noteTA=document.createElement('textarea'); noteTA.className='note-area';
  noteTA.placeholder='Sensations, observations, points à améliorer…'; noteTA.value=S.noteGlobale||'';
  noteTA.addEventListener('input',()=>S.noteGlobale=noteTA.value);
  noteBlock.append(noteTitle,noteTA); wrap.appendChild(noteBlock);

  // Actions
  const acts=document.createElement('div'); acts.className='summary-actions';
  const saveBtn=document.createElement('button'); saveBtn.className='btn btn-p';
  saveBtn.style.cssText='min-width:180px;font-size:.95rem;font-weight:700';
  saveBtn.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg> Sauvegarder`;
  saveBtn.addEventListener('click',()=>{ saveSession(); saveBtn.disabled=true; saveBtn.textContent='✓ Sauvegardée'; });
  const newBtn=document.createElement('button'); newBtn.className='btn';
  newBtn.textContent='Nouvelle séance';
  newBtn.addEventListener('click',()=>{ S.phase='choice'; S.progId=null; S.seanceId=null; S.libre=false; S.exercices=[]; render(); });
  acts.append(saveBtn,newBtn); wrap.appendChild(acts);
  main.appendChild(wrap);
}

// ACTIONS
// ══════════════════════════════════════════════════════════════
function startSession() {
  if (!S.seanceId) return;
  const seance=getSeance();
  S.phase='session'; S.libre=false;
  S.dateDebut=new Date().toISOString();
  S.chronoStart=Date.now();
  S.exercices=buildExercicesFromSeance(seance);
  S.noteGlobale='';
  saveCurrentSession(); render();
}

function startLibre() {
  S.phase='session'; S.libre=true; S.seanceId=null;
  S.dateDebut=new Date().toISOString(); S.chronoStart=Date.now();
  S.exercices=[]; S.noteGlobale='';
  saveCurrentSession(); render();
  setTimeout(openLibreModal,300);
}

function abortSession() {
  stopChrono(); stopTimer();
  S.phase='choice'; localStorage.removeItem(CUR_KEY); render();
}

function finishSession() {
  stopChrono(); stopTimer();
  S.dureeMin=Math.round((Date.now()-S.chronoStart)/60000);
  S.phase='summary'; localStorage.removeItem(CUR_KEY); render();
}

function saveSession() {
  // Capturer les valeurs actuelles des inputs DOM avant de sauvegarder
  document.querySelectorAll('.exo-card').forEach((card,ei)=>{
    const exo=S.exercices[ei]; if(!exo) return;
    card.querySelectorAll('[data-field]').forEach(inp=>{
      const rows=card.querySelectorAll('tbody tr');
      rows.forEach((tr,si)=>{
        if(exo.series[si]&&inp.closest('tr')===tr){
          if(inp.dataset.field==='duree'&&inp.value) exo.series[si].duree=inp.value;
          if(inp.dataset.field==='distance'&&inp.value) exo.series[si].distance=inp.value;
        }
      });
    });
  });
  const seance=getSeance(); const prog=getProg();
  const entry={
    id:uid(), date:S.dateDebut.split('T')[0],
    heure:new Date(S.dateDebut).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
    dureeMin:S.dureeMin,
    programmeNom:prog?.nom||'Libre', seanceNom:seance?.nom||'Libre', seanceType:seance?.type||'Autre',
    exercices:S.exercices.map(e=>({
      nom:e.nom, groupe:e.groupe,
      series:e.series.filter(s=>s.done).map(s=>({reps:s.reps,poids:s.poids,duree:s.duree,distance:s.distance,ressenti:s.ressenti})),
      note:e.note
    })),
    noteGlobale:S.noteGlobale,
    volumeTotal:computeVolume(S.exercices),
  };
  _historique.unshift(entry);
  localStorage.setItem(HIST_KEY, JSON.stringify(_historique));
  GymDB.write('historique.json', _historique);
  renderSidebar();
}

// ─── DÉPLACEMENT EXERCICES ────────────────────────────────────────────────────
function moveExo(ei, dir) {
  const ni = ei + dir;
  if (ni < 0 || ni >= S.exercices.length) return;
  [S.exercices[ei], S.exercices[ni]] = [S.exercices[ni], S.exercices[ei]];
  saveCurrentSession();
  renderSession(document.getElementById('mainArea'));
  renderSidebar();
}

// ─── MODALE AJOUT EXERCICE (picker riche) ────────────────────────────────────
let _seaSelectedExo = null; // exercice sélectionné dans le picker

function seaPickerRender(items) {
  const list = document.getElementById('seaPickList');
  list.innerHTML = '';
  if (!items.length) {
    const d=document.createElement('div'); d.className='epi-empty'; d.textContent='Aucun exercice trouvé.'; list.appendChild(d); return;
  }
  items.forEach(e => {
    const hex = MC[(e.groupe_musculaire||'').split(',')[0].trim()] || '#9a9891';
    const [r,g,b]=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
    const imgSrc = e.image || '';
    const item=document.createElement('div'); item.className='epi';
    if(_seaSelectedExo?.exercice===e.exercice) item.classList.add('active');
    // Miniature
    if(imgSrc){
      const img=document.createElement('img'); img.className='epi-img';
      img.src='./img/'+imgSrc; img.alt=e.exercice;
      img.onerror=()=>img.replaceWith(seaMakePh(hex));
      item.appendChild(img);
    } else { item.appendChild(seaMakePh(hex)); }
    const dot=document.createElement('span'); dot.className='epi-dot'; dot.style.background=hex;
    const info=document.createElement('div'); info.className='epi-info';
    const name=document.createElement('div'); name.className='epi-name'; name.textContent=e.exercice||'';
    const grp=document.createElement('div'); grp.className='epi-grp';
    grp.textContent=(e.groupe_musculaire||'')+(e.muscle?' · '+e.muscle:'');
    info.append(name,grp); item.append(dot,info);
    item.addEventListener('mousedown', ev=>{ ev.preventDefault(); seaSelectExo(e); });
    list.appendChild(item);
  });
}

function seaMakePh(hex) {
  const [r,g,b]=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  const ph=document.createElement('div'); ph.className='epi-ph';
  ph.style.cssText=`border-color:rgba(${r},${g},${b},.3);color:rgba(${r},${g},${b},.7)`;
  ph.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 18V8.5C6 6.57 7.57 5 9.5 5h.5v14H9.5A3.5 3.5 0 0 1 6 15.5"/><path d="M18 18V8.5C18 6.57 16.43 5 14.5 5H14v14h.5a3.5 3.5 0 0 0 3.5-3.5"/></svg>`;
  return ph;
}

function seaSelectExo(e) {
  _seaSelectedExo = e;
  document.getElementById('lm-nom').value = e.exercice || '';
  document.getElementById('seaPickSearch').value = e.exercice || '';
  document.getElementById('seaExoPick').classList.remove('open');
  // Aperçu dans le trigger
  const hex = MC[(e.groupe_musculaire||'').split(',')[0].trim()] || '#9a9891';
  const [r,g,b]=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  const prev=document.getElementById('seaPickPrev'); prev.innerHTML='';
  if(e.image){
    const img=document.createElement('img'); img.className='epp-img';
    img.src='./img/'+e.image; img.alt=e.exercice; img.onerror=()=>img.remove();
    prev.appendChild(img);
  }
  const dot=document.createElement('span'); dot.className='epp-dot'; dot.style.background=hex;
  prev.append(dot); prev.style.display='flex';
  // Badge groupe
  const badge=document.getElementById('seaGrpBadge');
  badge.textContent=e.groupe_musculaire||'';
  badge.style.cssText=`background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.35);font-size:.72rem;font-weight:700;padding:.3rem .75rem;border-radius:999px`;
  document.getElementById('seaGrpDisplay').style.display='block';
  // Auto-fill depuis référence
  const ref = getLatestRef(e.exercice);
  if(ref){
    if(ref.series) document.getElementById('lm-series').value=ref.series;
    if(ref.reps)   document.getElementById('lm-reps').value=ref.reps;
    if(ref.poids)  document.getElementById('lm-poids').value=ref.poids;
    if(ref.recup)  document.getElementById('lm-recup').value=parseRecup(ref.recup);
    if(ref.duree)  document.getElementById('lm-duree').value=ref.duree||'';
    if(ref.distance) document.getElementById('lm-distance').value=ref.distance||'';
  }
}

function openLibreModal() {
  _seaSelectedExo = null;
  ['lm-nom','lm-series','lm-reps','lm-poids','lm-recup','lm-duree','lm-distance'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('seaPickPrev').style.display='none';
  document.getElementById('seaPickPrev').innerHTML='';
  document.getElementById('seaPickSearch').value='';
  document.getElementById('seaGrpDisplay').style.display='none';
  document.getElementById('libreModal').classList.add('open');
  const search=document.getElementById('seaPickSearch');
  // Remplir la liste complète
  seaPickerRender(_exoLib);
  // Wiring picker (re-bind à chaque ouverture pour éviter les doublons)
  const picker=document.getElementById('seaExoPick');
  const list=document.getElementById('seaPickList');
  search.onfocus=()=>{ picker.classList.add('open'); seaPickerRender(_exoLib.filter(e=>!search.value||e.exercice?.toLowerCase().includes(search.value.toLowerCase()))); };
  search.oninput=()=>{ picker.classList.add('open'); seaPickerRender(_exoLib.filter(e=>e.exercice?.toLowerCase().includes(search.value.toLowerCase()))); };
  setTimeout(()=>search.focus(),60);
}

function closeLibreModal(){
  document.getElementById('libreModal').classList.remove('open');
  document.getElementById('seaExoPick').classList.remove('open');
}

function confirmLibreModal(){
  const nom=(document.getElementById('lm-nom').value||document.getElementById('seaPickSearch').value).trim();
  if(!nom) return;
  const nbSeries=parseInt(document.getElementById('lm-series').value)||3;
  const reps=document.getElementById('lm-reps').value.trim();
  const poids=document.getElementById('lm-poids').value.trim();
  const recup=document.getElementById('lm-recup').value.trim();
  const duree=document.getElementById('lm-duree').value.trim();
  const distance=document.getElementById('lm-distance').value.trim();
  const groupe=_seaSelectedExo?.groupe_musculaire||'';
  const ref=getLatestRef(nom);
  S.exercices.push({
    id:uid(), nom, groupe,
    image: _seaSelectedExo?.image || getExoImage(nom),
    refSeries:String(nbSeries), refReps:reps, refPoids:poids,
    refDuree:duree, refDistance:distance,
    refRecup:recup?recup+' s':(ref?.recup||'90 s'),
    series:Array.from({length:nbSeries},(_,i)=>({
      num:i+1, reps:reps||ref?.reps||'', poids:poids||ref?.poids||'',
      duree:'', distance:'', done:false, ressenti:''
    })),
    note:'',
  });
  closeLibreModal(); saveCurrentSession();
  renderSession(document.getElementById('mainArea')); renderSidebar();
}

// ══════════════════════════════════════════════════════════════
// WIRING
// ══════════════════════════════════════════════════════════════
document.getElementById('homeBtn').addEventListener('click',()=>window.location.href='index.html');
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
document.getElementById('libreModal').addEventListener('click',e=>{
  const picker=document.getElementById('seaExoPick');
  if(!picker.contains(e.target)) picker.classList.remove('open');
  if(e.target===document.getElementById('libreModal')) closeLibreModal();
});
document.getElementById('lmCancel').addEventListener('click',closeLibreModal);
document.getElementById('lmConfirm').addEventListener('click',confirmLibreModal);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(document.getElementById('libreModal').classList.contains('open')) closeLibreModal(); }
});

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
(async function init(){
  applyTheme(localStorage.getItem('muscle-xml-theme')||'light');
  loadData();
  await GymDB.init();
  // Charger historique depuis GymDB
  try { const h=await GymDB.read('historique.json'); if(Array.isArray(h)) { _historique=h; localStorage.setItem(HIST_KEY,JSON.stringify(h)); } } catch{}
  // Restaurer session en cours ?
  if (loadCurrentSession() && S.phase==='session') {
    S.chronoStart = Date.now() - (S.dureeMin||0)*60000; // approximation
    render();
  } else {
    render();
  }
})();
</script>

<script>
// ─── INFO EXERCICE DEPUIS SÉANCE ──────────────────────────────────────────────
function openSeaExoInfo(nom) {
  const rows = (() => { try { return JSON.parse(localStorage.getItem(EXO_KEY)||'{}').rows||[]; } catch{ return []; } })();
  const exo = rows.find(e=>e.exercice?.toLowerCase()===nom?.toLowerCase()) || { exercice:nom };
  const hex = MC[(exo.groupe_musculaire||'').split(',')[0].trim()] || '#01696f';
  const [r,g,b]=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  document.getElementById('seaExoInfoBar').style.background=hex;
  document.getElementById('seaExoInfoHdr').style.background=`rgba(${r},${g},${b},.07)`;
  const badge=document.getElementById('seaExoInfoBadge');
  badge.textContent=exo.groupe_musculaire||'—';
  badge.style.cssText=`font-size:.65rem;font-weight:800;padding:.25rem .7rem;border-radius:999px;white-space:nowrap;flex-shrink:0;background:rgba(${r},${g},${b},.15);color:${hex};border:1px solid rgba(${r},${g},${b},.35)`;
  document.getElementById('seaExoInfoName').textContent=exo.exercice||'—';
  document.getElementById('seaExoInfoName').style.color=hex;
  document.getElementById('seaExoInfoSub').textContent=[exo.muscle,exo.subdivision&&exo.subdivision!=='—'?exo.subdivision:''].filter(Boolean).join(' · ');
  const img=document.getElementById('seaExoInfoImg');
  const ph=document.getElementById('seaExoInfoPh');
  const src=exo.image||'';
  if(src){ img.src='./img/'+src; img.alt=exo.exercice; img.style.display='block'; ph.style.display='none'; img.onerror=()=>{ img.style.display='none'; ph.style.display='flex'; }; }
  else{ img.style.display='none'; ph.style.display='flex'; }
  const tags=document.getElementById('seaExoInfoTags'); tags.innerHTML='';
  [exo.equipement,exo.type_exercice].filter(Boolean).forEach(t=>{ const s=document.createElement('span'); s.style.cssText='display:inline-flex;padding:.2rem .5rem;border-radius:999px;font-size:.65rem;font-weight:600;background:var(--surfoff);color:var(--txm);border:1px solid var(--bord)'; s.textContent=t; tags.appendChild(s); });
  const secs=document.getElementById('seaExoInfoSections'); secs.innerHTML='';
  [{lbl:'Muscles secondaires',val:exo.muscle_secondaire},{lbl:'Descriptif',val:exo.descriptif},{lbl:'Exécution / Technique',val:exo.execution}].forEach(({lbl,val})=>{
    if(!val) return;
    const d=document.createElement('div'); d.style.cssText='display:flex;flex-direction:column;gap:.3rem';
    const t=document.createElement('div'); t.style.cssText=`font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:${hex};padding-bottom:.2rem;border-bottom:1px solid rgba(${r},${g},${b},.2)`; t.textContent=lbl;
    const tx=document.createElement('div'); tx.style.cssText='font-size:.82rem;line-height:1.6;color:var(--tx);white-space:pre-wrap'; tx.textContent=val;
    d.append(t,tx); secs.appendChild(d);
  });
  if(!secs.children.length) secs.innerHTML='<div style="color:var(--txf);font-size:.82rem;font-style:italic">Aucune information renseignée.</div>';
  document.getElementById('seaExoInfoOv').style.display='flex';
}
document.getElementById('seaExoInfoClose').addEventListener('click',()=>document.getElementById('seaExoInfoOv').style.display='none');
document.getElementById('seaExoInfoOv').addEventListener('click',e=>{ if(e.target===document.getElementById('seaExoInfoOv')) document.getElementById('seaExoInfoOv').style.display='none'; });
</script>
